  <style>
/* Salon queue: mobile first (designed at 360px wide).
   Identity: a barber pole. Navy ink, pole red + blue, brass trim like the bulbs round a barber's mirror.
   Yatra One (signboard style Devanagari) for headings, Mukta for text, Barlow Condensed for numbers. */
:root {
  --ink: #0f1b30;
  --ink-2: #1a2b49;
  --lather: #eef1f5;
  --paper: #ffffff;
  --chrome: #d3dae4;
  --steel: #5a687c;
  --red: #d1342c;
  --red-dark: #a5251e;
  --blue: #2457a6;
  --brass: #b98a35;
  --brass-light: #ecd391;
  --green: #17734a;
  --green-bg: #dff3e8;
  --amber: #85540a;
  --amber-bg: #fff0cd;
  --blue-bg: #e1ebfa;
  --grey-bg: #e8ecf1;
  --rose-bg: #fbe3e1;
  --font-display: 'Yatra One', 'Mukta', 'Noto Sans Devanagari', sans-serif;
  --font-body: 'Mukta', 'Noto Sans Devanagari', 'Roboto', system-ui, sans-serif;
  --font-num: 'Barlow Condensed', 'Mukta', sans-serif;
  --stripes: repeating-linear-gradient(-45deg, var(--red) 0 8px, #fff 8px 16px, var(--blue) 16px 24px, #fff 24px 32px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--lather); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.35; margin: 0; }
h2 { font-size: 24px; }
p { margin: 0; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; }

/* shop name board at the very top */
.shop-head { position: relative; z-index: 6; display: flex; align-items: center; gap: 12px; max-width: 560px; margin: 0 auto; padding: 8px 12px 8px 14px; padding-top: calc(8px + env(safe-area-inset-top)); background: var(--ink); color: #fff; border-bottom: 3px solid var(--brass); }
.shop-head .pole { flex: none; width: 16px; height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,.65); background: var(--stripes); }
.sh-text { flex: 1; min-width: 0; }
.shop-head h1 { font-size: 24px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-clock { display: flex; align-items: center; gap: 5px; margin-top: -3px; font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--brass-light); }
.shop-login { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 13px 0 11px; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
.shop-login svg { color: var(--brass-light); }
.demo-banner { background: var(--amber-bg); color: var(--amber); font-size: 14px; line-height: 1.4; padding: 8px 16px; text-align: center; }

/* ============================ HERO (small slider) ============================ */
.hero { position: relative; height: clamp(104px, 30vw, 156px); background: var(--ink); overflow: hidden; max-width: 560px; margin: 0 auto; }
.slides { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; margin: 0; }
.slide img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.hero-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(15,27,48,0) 55%, rgba(15,27,48,.6) 100%); }
.hero.no-photos { display: none; }
.hero.no-photos + .live { margin-top: 10px; }
.dots { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 3; display: flex; justify-content: center; gap: 6px; }
.dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 4px; background: rgba(255,255,255,.55); transition: width .2s, background .2s; }
.dots button[aria-current="true"] { width: 20px; background: var(--brass-light); }

/* live strip overlaps the slider: queue length, wait for a new booking, who is in the chair */
.live {
  position: relative; z-index: 4; margin: -18px 10px 0; max-width: 540px; overflow: hidden;
  display: grid; grid-template-columns: .72fr .95fr 1.5fr; background: #fff; border-radius: 16px;
  box-shadow: 0 10px 24px rgba(15,27,48,.26);
}
@media (min-width: 560px) { .live { margin-left: auto; margin-right: auto; } }
.live > div { padding: 8px 10px 11px 12px; min-width: 0; }
.live > div + div { border-left: 1px dashed var(--chrome); }
.live b { display: block; font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.05; color: var(--ink); }
.live b small { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--steel); margin-left: 2px; }
.live span { display: block; font-size: 12px; line-height: 1.25; color: var(--steel); }
.live .lc-label { display: flex; align-items: center; gap: 4px; font-weight: 600; }
.lc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.live .lc-end { display: block; font-size: 12px; line-height: 1.3; color: var(--steel); }
.live .lc-end:empty { display: none; }
.live .live-chair b { font-family: var(--font-display); font-weight: 400; font-size: 17px; line-height: 1.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--blue); }
.live .lc-row i { font-style: normal; font-family: var(--font-num); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.live .lc-row i.over { color: var(--red); }
.live .lc-row i.over + * { color: var(--red); }
.live-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--grey-bg); padding: 0 !important; border: 0 !important; }
.live-bar .pole-fill { height: 100%; border-radius: 0; }

/* ============================ CARDS ============================ */
.card { background: var(--paper); border: 1px solid var(--chrome); border-radius: 16px; padding: 14px; margin: 10px 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.section-head h2 { font-size: 20px; }
.count { font-size: 14px; color: var(--steel); font-weight: 600; }
.hint { color: var(--steel); font-size: 16px; line-height: 1.5; margin: 6px 0 16px; max-width: 46ch; }

/* contact: one dark line, name on the left, tap-to-call number on the right */
.contact { position: relative; overflow: hidden; margin-top: 10px; padding: 8px 12px 10px 26px; background: var(--ink); color: #fff; border: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'who who' 'main call'; align-items: center; gap: 2px 10px; }
.contact .who { grid-area: who; }
.contact-main { grid-area: main; min-width: 0; }
.contact-call { grid-area: call; }
.contact::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(-45deg, var(--red) 0 8px, #fff 8px 16px, var(--blue) 16px 24px, #fff 24px 32px); }
.who { display: flex; align-items: center; gap: 6px; color: var(--brass-light); font-size: 13px; font-weight: 700; line-height: 1.5; }
.who svg { flex: none; }
.state { font-style: normal; margin-left: auto; padding: 0 9px 0 8px; border-radius: 999px; background: rgba(47,168,102,.25); color: #8ee8b4; font-size: 12px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
.state::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
.state.closed { background: rgba(209,52,44,.3); color: #ffb3ad; }
.contact-name { font-family: var(--font-display); font-size: 21px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-address { color: #aebbd0; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-call { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 14px; background: var(--red); color: #fff; text-decoration: none; font-family: var(--font-num); font-weight: 700; font-size: 23px; letter-spacing: .04em; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border: 0; border-radius: 14px;
  font-weight: 700; font-size: 17px; text-decoration: none; cursor: pointer; text-align: center;
  transition: transform .08s, background .15s;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--red); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.btn-primary:hover { background: var(--red-dark); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-call { background: #fff; color: var(--ink); }
.btn-ghost { background: transparent; border: 1.5px solid var(--chrome); color: var(--ink); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-danger { background: var(--rose-bg); color: var(--red-dark); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: 15px; }

/* ============================ FORMS ============================ */
.book { position: relative; overflow: hidden; padding-top: 22px; }
.book h2 { margin-bottom: 16px; }
.book::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--stripes); }
.field { margin-bottom: 10px; }
.field label { display: block; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.field input { width: 100%; min-height: 52px; padding: 0 14px; font-size: 17px; background: #f8fafc; border: 1.5px solid var(--chrome); border-radius: 12px; }
.field input:focus { border-color: var(--blue); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(36,87,166,.16); }
.form-error { color: var(--red-dark); background: var(--rose-bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-bottom: 12px; }
.closed-msg { background: var(--rose-bg); color: var(--red-dark); padding: 12px 14px; border-radius: 12px; }

.field select { width: 100%; min-height: 52px; padding: 0 40px 0 14px; font-size: 17px; background: #f8fafc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24'><path fill='%230f1b30' d='M7 10l5 5 5-5z'/></svg>") no-repeat right 12px center; border: 1.5px solid var(--chrome); border-radius: 12px; appearance: none; -webkit-appearance: none; }
.field select:focus { border-color: var(--blue); background-color: #fff; outline: none; box-shadow: 0 0 0 4px rgba(36,87,166,.16); }
.field select:invalid { color: #6b7787; }
.field select option { color: var(--ink); }
.input-mic { position: relative; }
.input-mic input { padding-right: 64px; }
.mic { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; cursor: pointer; }
.mic.listening { background: var(--red); animation: mic-pulse 1.1s ease-out infinite; }
@keyframes mic-pulse { 0% { box-shadow: 0 0 0 0 rgba(209,52,44,.55); } 100% { box-shadow: 0 0 0 16px rgba(209,52,44,0); } }
.mic-status { margin-top: 6px; font-size: 14px; color: var(--steel); }
.mic-status.err { color: var(--red-dark); }

/* ============================ MY TICKET ============================ */
.ticket { padding: 0; border: 2px solid var(--ink); overflow: hidden; background: #fff; }
.ticket-head { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 2px dashed var(--chrome); }
.t-num { flex: none; min-width: 60px; padding: 6px 8px; text-align: center; background: var(--ink); color: #fff; border-radius: 10px; font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.15; }
.ticket h2 { font-size: 20px; line-height: 1.4; }
.ticket-head p { color: var(--steel); margin-top: 0; font-size: 14px; line-height: 1.4; }
.ticket .note { font-size: 13px; line-height: 1.4; color: var(--steel); padding: 8px 14px 10px; }
.ticket .t-actions { padding: 10px 14px 12px; display: grid; gap: 8px; }
.ticket .t-actions .note { padding: 0; }
.ticket.is-next { border-color: var(--amber); }
.ticket.is-next .ticket-head { background: var(--amber-bg); }
.ticket.is-next .t-num { background: var(--amber); }
.ticket.is-chair { border-color: var(--blue); }
.ticket.is-chair .ticket-head { background: var(--blue-bg); }
.ticket.is-chair .t-num { background: var(--blue); }
.ticket.is-done .t-num { background: var(--green); }

/* ============================ CHAIR (dark panel) ============================ */
.chair { background: var(--ink); color: #fff; border: 0; position: relative; overflow: hidden; }
.chair::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(236,211,145,.22), transparent 70%); pointer-events: none; }
.chair h2 { color: #fff; }
.chair-person { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 14px; }
.chair-name { font-family: var(--font-display); font-size: 28px; line-height: 1.35; }
.chair-time { font-family: var(--font-num); font-weight: 700; font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--brass-light); }
.chair-time.over { color: #ff8b82; }
.chair .pole-bar { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }
.chair-meta { margin-top: 10px; color: #b7c4d8; font-size: 15px; line-height: 1.45; }
.chair .empty { color: #b7c4d8; }
.chair a.b-phone { color: var(--brass-light); }
.pole-bar { height: 24px; border-radius: 12px; background: var(--grey-bg); border: 1px solid var(--chrome); overflow: hidden; }
.pole-fill { height: 100%; width: 0; border-radius: 12px; transition: width 1s linear; background: repeating-linear-gradient(-45deg, var(--red) 0 12px, #fff 12px 24px, var(--blue) 24px 36px, #fff 36px 48px); background-size: 68px 68px; animation: pole-spin 1.2s linear infinite; }
@keyframes pole-spin { to { background-position: 68px 0; } }
.empty { color: var(--steel); padding: 6px 0; }

/* ============================ QUEUE (ticket stubs) ============================ */
.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
li.empty { padding: 6px 2px; }
.q-item { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: stretch; background: #fff; border: 1.5px solid var(--chrome); border-radius: 14px; overflow: hidden; }
.q-num { display: grid; place-items: center; background: var(--ink); color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 26px; border-right: 3px dotted rgba(255,255,255,.35); }
.q-item > div:nth-child(2) { padding: 6px 6px 6px 10px; min-width: 0; align-self: center; }
.q-item.mine { border-color: var(--red); background: #fff6f4; }
.q-item.mine .q-num { background: var(--red); }
.q-name { font-weight: 700; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
.q-phone { color: var(--steel); font-size: 13px; line-height: 1.2; font-family: var(--font-num); letter-spacing: .05em; }
.you { margin-left: 6px; padding: 0 9px; border-radius: 999px; background: var(--red); color: #fff; font-size: 13px; font-weight: 700; vertical-align: 2px; }
.walkin { margin-left: 6px; padding: 0 9px; border-radius: 999px; background: var(--grey-bg); color: var(--steel); font-size: 13px; font-weight: 700; vertical-align: 2px; }
.q-side { display: grid; align-content: center; justify-items: end; gap: 2px; text-align: right; padding: 6px 10px 6px 0; }
.q-wait { font-size: 12px; line-height: 1.2; color: var(--steel); }

.badge { display: inline-block; padding: 0 10px; border-radius: 999px; font-size: 12px; line-height: 1.6; font-weight: 700; white-space: nowrap; }
.badge[data-s="pending"] { background: var(--amber-bg); color: var(--amber); }
.badge[data-s="accepted"] { background: var(--green-bg); color: var(--green); }
.badge[data-s="in_progress"] { background: var(--blue-bg); color: var(--blue); }
.badge[data-s="completed"] { background: var(--grey-bg); color: var(--steel); }
.badge[data-s="cancelled"], .badge[data-s="rejected"] { background: var(--rose-bg); color: var(--red-dark); }

/* ============================ TOASTS ============================ */
#toasts { position: fixed; z-index: 100; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: grid; gap: 8px; pointer-events: none; max-width: 536px; margin: 0 auto; }
.toast { pointer-events: auto; display: grid; gap: 2px; padding: 14px 16px; border-radius: 14px; background: var(--ink); color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,.35); animation: toast-in .25s ease-out; line-height: 1.4; }
.toast strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.toast-alert { background: var(--red); }
.toast-ok { background: var(--green); }
.toast-error { background: var(--red-dark); }
.toast.out { opacity: 0; transition: opacity .35s; }
@keyframes toast-in { from { transform: translateY(-10px); opacity: 0; } }

.ver { text-align: center; font-size: 11px; color: #9aa6b6; padding: 4px 0 14px; }
.foot { text-align: center; padding: 2px 16px 18px; font-size: 13px; }
.foot a { color: var(--steel); }

/* ============================ BARBER PAGES ============================ */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: #fff; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); border-bottom: 3px solid var(--brass); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-name { font-family: var(--font-display); font-size: 20px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .pole, .login-card .pole { flex: none; width: 14px; height: 32px; border-radius: 7px; border: 1px solid rgba(255,255,255,.6); background: var(--stripes); }

.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 0, #223a63 0, var(--ink) 70%); }
.login-card { width: 100%; max-width: 380px; margin: 0; border: 0; position: relative; overflow: hidden; padding-top: 34px; }
.login-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--stripes); }
.login-card .pole { width: 18px; height: 44px; margin-bottom: 12px; border-color: var(--ink); }
.login-card h1 { font-size: 30px; margin-bottom: 2px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px; }
.stat { background: #fff; border: 1px solid var(--chrome); border-radius: 14px; padding: 6px 6px 8px; text-align: center; }
.stat b { display: block; font-family: var(--font-num); font-weight: 700; font-size: 32px; line-height: 1.1; }
.stat span { font-size: 14px; color: var(--steel); }

.switch { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 0; color: #fff; cursor: pointer; padding: 6px 0; min-height: 44px; font-weight: 600; }
.switch .track { width: 48px; height: 28px; border-radius: 14px; background: #6b7a90; position: relative; transition: background .2s; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] .track { background: #2fa866; }
.switch[aria-checked="true"] .track::after { transform: translateX(20px); }

.toolbar { display: flex; gap: 8px; margin: 0 10px; flex-wrap: wrap; }
.toolbar .btn { flex: 1 1 140px; }

.b-item { border: 1.5px solid var(--chrome); border-radius: 14px; padding: 10px; background: #fff; display: grid; gap: 10px; }
.b-top { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.b-top .q-num { height: 50px; border-radius: 10px; border-right: 0; }
.b-name { font-weight: 700; font-size: 19px; line-height: 1.35; overflow-wrap: anywhere; }
.b-phone { color: var(--blue); font-family: var(--font-num); font-weight: 600; font-size: 20px; letter-spacing: .04em; text-decoration: none; }
.b-time { font-size: 13px; line-height: 1.35; color: var(--steel); }
.b-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.b-actions .btn { flex: 1 1 78px; padding: 0 10px; }
.b-actions.row { display: grid; grid-template-columns: 1fr 1fr 46px 46px; gap: 8px; }
.b-actions.row .btn { flex: none; padding: 0 6px; min-width: 0; }
.b-actions.row .btn-icon { padding: 0; font-size: 20px; }
.chair .b-actions .btn-ghost { border-color: rgba(255,255,255,.35); color: #fff; }

dialog { border: 0; border-radius: 20px; padding: 22px 16px; width: min(92vw, 420px); color: var(--ink); }
dialog::backdrop { background: rgba(15,27,48,.65); }
dialog h2 { margin-bottom: 2px; }
.dur-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.dur-grid button { min-height: 72px; border: 1.5px solid var(--chrome); border-radius: 14px; background: #fff; cursor: pointer; font-family: var(--font-num); font-size: 36px; font-weight: 700; line-height: 1.1; }
.dur-grid button small { display: block; font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--steel); }
.dur-grid button.suggest { border-color: var(--green); background: var(--green-bg); }
.dur-grid button.suggest small { color: var(--green); }
.svc-chip { display: inline-block; margin: 2px 0; padding: 0 10px; border-radius: 999px; background: var(--blue-bg); color: var(--blue); font-size: 13px; font-weight: 700; line-height: 1.6; }
.chair .svc-chip { background: rgba(236,211,145,.2); color: var(--brass-light); }
.ticket .svc b { color: var(--ink); }

/* timer reached zero popup */
.time-dialog { position: relative; overflow: hidden; padding-top: 28px; }
.time-dialog::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--stripes); }
.time-dialog h2 { color: var(--red-dark); font-size: 28px; }
.dlg-label { margin: 10px 0 6px; font-weight: 700; font-size: 15px; color: var(--steel); }
.ext-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
.ext-grid button { min-height: 62px; border: 1.5px solid var(--chrome); border-radius: 12px; background: #fff; cursor: pointer; font-family: var(--font-num); font-size: 28px; font-weight: 700; line-height: 1.1; }
.ext-grid button small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--steel); }
.ext-grid button:hover, .ext-grid button:focus-visible { border-color: var(--blue); background: var(--blue-bg); }
.time-dialog .btn-block + .btn-block { margin-top: 8px; }
.dur-grid button:hover, .dur-grid button:focus-visible { border-color: var(--blue); background: var(--blue-bg); }

@media (min-width: 600px) {
  .contact { grid-template-columns: 1fr 200px; align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .pole-fill, .mic.listening, .toast { animation: none; }
  .btn, .dots button { transition: none; }
}

/* photo manager (barber) */
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.photo-grid .ph { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--grey-bg); }
.photo-grid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-grid .ph button { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(15,27,48,.82); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
.photo-empty { grid-column: 1 / -1; padding: 14px 4px; color: var(--steel); }
label.btn input { display: none; }

  </style>
</head>

<div id="demoBanner" class="demo-banner" hidden>डेमो मोड: माहिती फक्त या फोनमध्येच राहते. प्रत्यक्ष वापरासाठी Supabase कळा टाका.</div>

function normalizePhone(value) {
  let d = String(value || '').replace(/\D/g, '');
  if (d.length > 10) d = d.slice(-10); // drop +91 / 0 prefixes
  return d;
}

const validPhone = (d) => /^\d{10}$/.test(d);

function maskPhone(p) {
  const d = String(p || '');
  if (d.length < 6) return d;
  return d.slice(0, 2) + '****' + d.slice(-4);
}

function statusLabel(s) {
  return (
    { pending: 'मंजुरीची वाट', accepted: 'रांगेत', in_progress: 'खुर्चीवर', completed: 'पूर्ण', cancelled: 'रद्द', rejected: 'नाकारले' }[s] || s
  );
}

function fmtClock(ms) {
  const neg = ms < 0;
  const total = Math.floor(Math.abs(ms) / 1000);
  const m = String(Math.floor(total / 60)).padStart(2, '0');
  const s = String(total % 60).padStart(2, '0');
  return (neg ? '+' : '') + m + ':' + s;
}

// Marathi style time of day, e.g. "सकाळी 8:38"
function fmtTime(iso) {
  const d = new Date(iso);
  const h = d.getHours();
  const part = h >= 4 && h < 12 ? 'सकाळी' : h >= 12 && h < 16 ? 'दुपारी' : h >= 16 && h < 20 ? 'संध्याकाळी' : 'रात्री';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${part} ${h12}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function waitText(min) {
  if (min <= 0) return 'आता';
  if (min < 60) return `सुमारे ${min} मिनिटे`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? `सुमारे ${h} तास ${m} मिनिटे` : `सुमारे ${h} तास`;
}

// ---- sound (needs one tap on the page first; browsers block autoplay) ----
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {
    /* sound is optional */
  }
}
window.addEventListener('pointerdown', unlockAudio, { once: true });

function beep(times = 2) {
  if (!audioCtx) return;
  for (let i = 0; i < times; i++) {
    const t = audioCtx.currentTime + i * 0.28;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.25);
  }
}

function vibrate(pattern = [200, 100, 200]) {
  try {
    navigator.vibrate?.(pattern);
  } catch {
    /* ignore */
  }
}

// ---- toast ----
function toast(message, { type = 'info', ms = 4500, title = '' } = {}) {
  let host = document.getElementById('toasts');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toasts';
    host.setAttribute('aria-live', 'polite');
    document.body.appendChild(host);
  }
  if (type === 'alert') host.querySelectorAll('.toast').forEach((t) => t.remove()); // newest alert wins
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  if (type === 'alert' || type === 'error') el.setAttribute('role', 'alert');
  el.innerHTML = (title ? `<strong>${esc(title)}</strong>` : '') + `<span>${esc(message)}</span>`;
  host.appendChild(el);
  setTimeout(() => el.classList.add('out'), ms);
  setTimeout(() => el.remove(), ms + 400);
}

function urlB64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function registerSW() {
  if (!('serviceWorker' in navigator)) return null;
  try {
    return await navigator.serviceWorker.register('sw.js');
  } catch {
    return null;
  }
}

// ---- voice input (Chrome on Android, needs https and internet) ----
const NUM_WORDS = {
  'शून्य': '0', 'शुन्य': '0', 'झिरो': '0', 'जीरो': '0', zero: '0',
  'एक': '1', one: '1', 'वन': '1',
  'दोन': '2', 'दो': '2', two: '2', 'टू': '2',
  'तीन': '3', three: '3', 'थ्री': '3',
  'चार': '4', four: '4', 'फोर': '4',
  'पाच': '5', 'पांच': '5', 'पाँच': '5', five: '5', 'फाईव्ह': '5', 'फाइव': '5',
  'सहा': '6', 'छह': '6', 'छः': '6', 'छे': '6', six: '6', 'सिक्स': '6',
  'सात': '7', seven: '7', 'सेव्हन': '7', 'सेवन': '7',
  'आठ': '8', eight: '8', 'एट': '8',
  'नऊ': '9', 'नौ': '9', 'नव': '9', nine: '9', 'नाईन': '9', 'नाइन': '9',
};
const REPEAT_WORDS = { double: 2, 'डबल': 2, triple: 3, 'ट्रिपल': 3 };

// "९८७६ पाच चार डबल तीन" -> "98765433"
function spokenToDigits(text) {
  const dev = '०१२३४५६७८९';
  const t = String(text || '').replace(/[०-९]/g, (ch) => String(dev.indexOf(ch))).toLowerCase();
  let out = '';
  let times = 1;
  for (const tok of t.split(/[\s,.\-]+/).filter(Boolean)) {
    if (REPEAT_WORDS[tok]) { times = REPEAT_WORDS[tok]; continue; }
    const d = NUM_WORDS[tok] ?? (/^\d+$/.test(tok) ? tok : null);
    if (d === null) continue;
    out += d.length === 1 ? d.repeat(times) : d;
    times = 1;
  }
  return out.length > 10 ? out.slice(-10) : out;
}

let stopActiveMic = null;

// kind: 'name' fills a name, 'phone' turns what is said into a 10 digit number
function attachMic(input, button, statusEl, lang = 'mr-IN', kind = 'name') {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { button.hidden = true; return; }
  let rec = null;
  let listening = false;
  const isPhone = kind === 'phone';
  const isText = kind === 'text';
  const what = isPhone ? 'नंबर' : isText ? 'माहिती' : 'नाव';
  const say = (text, isError = false) => {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.classList.toggle('err', isError);
    statusEl.hidden = !text;
  };
  const clean = (t) => t.replace(/[.,।?!]+$/g, '').replace(/\s+/g, ' ').trim();
  const stop = () => { try { rec && rec.stop(); } catch { /* already stopped */ } };

  button.addEventListener('click', () => {
    if (listening) { stop(); return; }
    if (stopActiveMic) stopActiveMic(); // only one microphone at a time
    rec = new SR();
    rec.lang = lang;
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    rec.onstart = () => {
      listening = true;
      stopActiveMic = stop;
      button.classList.add('listening');
      button.setAttribute('aria-pressed', 'true');
      say(isPhone ? 'ऐकत आहे... मोबाईल नंबर एक एक अंक बोला' : isText ? 'ऐकत आहे... बोला' : 'ऐकत आहे... तुमचे नाव सांगा');
    };
    rec.onresult = (e) => {
      let text = '';
      for (let i = 0; i < e.results.length; i++) text += ' ' + e.results[i][0].transcript;
      input.value = isPhone ? spokenToDigits(text) : clean(text);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') say(`माइकची परवानगी द्या (Chrome मध्ये कुलूप चिन्ह, परवानग्या, माइक) किंवा ${what} टाइप करा.`, true);
      else if (e.error === 'no-speech') say('काही ऐकू आले नाही. पुन्हा माइक दाबा.', true);
      else if (e.error === 'network') say(`बोलणे ओळखण्यासाठी इंटरनेट लागते. ${what} टाइप करा.`, true);
      else if (e.error !== 'aborted') say(`बोलणे ओळखता आले नाही. ${what} टाइप करा.`, true);
    };
    rec.onend = () => {
      listening = false;
      if (stopActiveMic === stop) stopActiveMic = null;
      button.classList.remove('listening');
      button.setAttribute('aria-pressed', 'false');
      if (statusEl && !statusEl.classList.contains('err')) {
        if (input.value) say(`${what} बरोबर नसेल तर दुरुस्त करा किंवा पुन्हा माइक दाबा.`);
        else say('');
      }
    };
    try { rec.start(); } catch { say('माइक सुरू करता आला नाही. टाइप करा.', true); }
  });
}

// Shrinks a phone photo (often 4000px, 5 MB) to about 100 KB so it loads fast and fits in the free database.
async function compressImage(file, maxSide = 1000, quality = 0.72) {
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    bmp = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  const w = bmp.width || bmp.naturalWidth;
  const h = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(w * scale));
  canvas.height = Math.max(1, Math.round(h * scale));
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

// Pure functions: no DOM, no network. Easy to reason about and test.

const ACTIVE = ['pending', 'accepted', 'in_progress'];

function endMs(row) {
  if (row.status !== 'in_progress' || !row.started_at) return 0;
  return new Date(row.started_at).getTime() + (row.duration_minutes || 0) * 60000;
}

/**
 * Orders the active bookings and works out wait times and who is "next".
 * - The person in the chair is always first.
 * - Everyone else is ordered by queue_position, then booking time.
 * - "Next" is the first accepted customer, once the chair is free or the
 *   current customer has nextAlertMin minutes (or less) left.
 */
function buildQueue(rows, now, avgMin = 20, nextAlertMin = 5) {
  const active = rows.filter((r) => ACTIVE.includes(r.status));
  active.sort((a, b) => {
    const ai = a.status === 'in_progress' ? 0 : 1;
    const bi = b.status === 'in_progress' ? 0 : 1;
    if (ai !== bi) return ai - bi;
    if (a.queue_position !== b.queue_position) return a.queue_position - b.queue_position;
    return new Date(a.created_at) - new Date(b.created_at);
  });

  const currentRow = active.find((r) => r.status === 'in_progress') || null;
  const leftMs = currentRow ? endMs(currentRow) - now : 0;
  const currentWaitMin = currentRow ? Math.max(0, Math.ceil(leftMs / 60000)) : 0;

  let waitingAhead = 0;
  const list = active.map((r, i) => {
    const item = { ...r, index: i, ahead: i, waitMin: 0, isNext: false, leftMs: 0, progress: 0 };
    if (r.status === 'in_progress') {
      item.leftMs = leftMs;
      const total = (r.duration_minutes || 1) * 60000;
      item.progress = Math.min(1, Math.max(0, 1 - leftMs / total));
    } else {
      item.waitMin = currentWaitMin + waitingAhead * avgMin;
      waitingAhead += 1;
    }
    return item;
  });

  const nextRow = list.find((r) => r.status === 'accepted');
  if (nextRow && (!currentRow || leftMs <= nextAlertMin * 60000)) nextRow.isNext = true;

  return {
    list,
    current: list.find((r) => r.status === 'in_progress') || null,
    waiting: list.filter((r) => r.status !== 'in_progress'),
  };
}

const demoBackend = (() => {
// DEMO backend: everything lives in this browser's localStorage.
// It mirrors the rules in supabase/schema.sql so you can try the whole flow
// (customer + barber in two tabs) before connecting a real database.

const KEY = 'bq_demo_db_v2';
const listeners = new Set();
const ACTIVE = ['pending', 'accepted', 'in_progress'];
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random());

function seed() {
  const now = Date.now();
  const mk = (name, phone, status, pos, extra = {}) => ({
    id: uid(), name, phone, service: '', status, is_walk_in: false, queue_position: pos,
    duration_minutes: null, started_at: null, notified_next: false, client_token: uid(),
    created_at: new Date(now - (10 - pos) * 60000).toISOString(),
    updated_at: new Date(now).toISOString(), ...extra,
  });
  return {
    is_open: CONFIG.SHOP.is_open,
    bookings: [
      mk('अमित जाधव', '9811100001', 'in_progress', 1, { service: 'कटिंग', duration_minutes: 30, started_at: new Date(now - 8 * 60000).toISOString() }),
      mk('विक्रम पवार', '9811100002', 'accepted', 2, { service: 'कटिंग + दाढी' }),
      mk('संदीप शिंदे', '9811100003', 'accepted', 3, { service: 'मसाज' }),
    ],
  };
}

function load() {
  try {
    const db = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (db) return db;
  } catch {
    /* fall through and reseed */
  }
  const db = seed();
  localStorage.setItem(KEY, JSON.stringify(db));
  return db;
}

function save(db) {
  localStorage.setItem(KEY, JSON.stringify(db));
  listeners.forEach((f) => f());
}

window.addEventListener('storage', (e) => {
  if (e.key === KEY) listeners.forEach((f) => f());
});

const fail = (msg, extra = {}) => Object.assign(new Error(msg), extra);

function requireBarber(token) {
  if (!token || !String(token).startsWith('demo-')) throw fail('पुन्हा साइन इन करा', { unauthorized: true });
}

function checkPerson(name, phone, service) {
  const sv = String(service || '').trim();
  if (sv.length < 2 || sv.length > 40) throw fail('कृपया सेवा निवडा');
  const n = String(name || '').trim();
  const p = normalizePhone(phone);
  if (n.length < 2 || n.length > 60) throw fail('कृपया नाव टाका');
  if (!validPhone(p)) throw fail('वैध 10 अंकी मोबाईल नंबर टाका');
  return { n, p, sv };
}

const toPublic = (b) => ({
  id: b.id, name: b.name, phone_masked: maskPhone(b.phone), status: b.status, is_walk_in: b.is_walk_in,
  queue_position: b.queue_position, duration_minutes: b.duration_minutes, started_at: b.started_at, created_at: b.created_at,
});

const nextPos = (db) => db.bookings.reduce((m, b) => Math.max(m, b.queue_position), 0) + 1;

function insert(db, n, p, sv, status, walkIn) {
  if (db.bookings.some((b) => b.phone === p && ACTIVE.includes(b.status))) throw fail('या नंबरवर आधीच एक नोंद सुरू आहे');
  const row = {
    id: uid(), name: n, phone: p, service: sv, status, is_walk_in: walkIn, queue_position: nextPos(db),
    duration_minutes: null, started_at: null, notified_next: false, client_token: uid(),
    created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
  };
  db.bookings.push(row);
  return row;
}

const api = {
  async getShop() {
    const db = load();
    return { ...CONFIG.SHOP, ...(db.shop || {}), is_open: db.is_open };
  },

  async getQueue() {
    const dayAgo = Date.now() - 86400000;
    return load().bookings.filter((b) => new Date(b.created_at).getTime() > dayAgo).map(toPublic);
  },

  async book({ name, phone, service }) {
    const db = load();
    if (!db.is_open) throw fail('दुकान सध्या बंद आहे. कृपया नंतर प्रयत्न करा किंवा फोन करा.');
    if (db.bookings.filter((b) => ACTIVE.includes(b.status)).length >= CONFIG.MAX_QUEUE) throw fail('रांग सध्या पूर्ण आहे. थोड्या वेळाने प्रयत्न करा');
    const { n, p, sv } = checkPerson(name, phone, service);
    const row = insert(db, n, p, sv, CONFIG.AUTO_ACCEPT ? 'accepted' : 'pending', false);
    save(db);
    return { id: row.id, token: row.client_token };
  },

  async savePush() {
    /* Real push needs the Supabase backend. Demo mode uses local notifications. */
  },

  subscribe(cb) {
    listeners.add(cb);
    return () => listeners.delete(cb);
  },

  // ---------- barber ----------
  async login(username, password) {
    const c = CONFIG.BARBER;
    if (username !== c.username || password !== c.password) throw fail('वापरकर्ता नाव किंवा पासवर्ड चुकीचा आहे');
    return 'demo-' + uid();
  },

  async list(token) {
    requireBarber(token);
    const db = load();
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);
    return {
      bookings: db.bookings.filter((b) => ACTIVE.includes(b.status)).map((b) => ({ ...b, client_token: undefined })),
      completed_today: db.bookings.filter((b) => b.status === 'completed' && new Date(b.updated_at) >= startOfDay).length,
    };
  },

  async update(token, id, action, minutes) {
    requireBarber(token);
    const db = load();
    const b = db.bookings.find((x) => x.id === id);
    if (!b) throw fail('नोंद सापडली नाही');
    const touch = () => { b.updated_at = new Date().toISOString(); };

    switch (action) {
      case 'accept':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या स्वीकारता येतात');
        b.status = 'accepted'; touch(); break;
      case 'reject':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या नाकारता येतात');
        b.status = 'rejected'; touch(); break;
      case 'start':
        if (!['pending', 'accepted'].includes(b.status)) throw fail('या ग्राहकाची सेवा सुरू करता येत नाही');
        if (![10, 20, 30, 40, 50, 60].includes(minutes)) throw fail('10 ते 60 मिनिटे निवडा');
        if (db.bookings.some((x) => x.status === 'in_progress')) throw fail('आधी सध्याच्या ग्राहकाचे काम पूर्ण करा');
        b.status = 'in_progress'; b.started_at = new Date().toISOString(); b.duration_minutes = minutes; b.notified_next = false; touch(); break;
      case 'complete':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        b.status = 'completed'; touch(); break;
      case 'extend':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        if (!(minutes >= 5 && minutes <= 60)) throw fail('5 ते 60 मिनिटे निवडा');
        b.duration_minutes += minutes; touch(); break;
      case 'cancel':
        if (!ACTIVE.includes(b.status)) throw fail('ही नोंद आधीच बंद झाली आहे');
        b.status = 'cancelled'; touch(); break;
      case 'move_up':
      case 'move_down': {
        const waiting = db.bookings.filter((x) => ['pending', 'accepted'].includes(x.status)).sort((p, q) => p.queue_position - q.queue_position);
        const i = waiting.findIndex((x) => x.id === id);
        const other = waiting[action === 'move_up' ? i - 1 : i + 1];
        if (other) {
          [b.queue_position, other.queue_position] = [other.queue_position, b.queue_position];
          b.notified_next = false; other.notified_next = false;
        }
        break;
      }
      default:
        throw fail('अज्ञात कृती');
    }
    save(db);
  },

  async addWalkin(token, { name, phone, service }) {
    requireBarber(token);
    const db = load();
    const { n, p, sv } = checkPerson(name, phone, service);
    insert(db, n, p, sv, 'accepted', true);
    save(db);
  },

  async saveShop(token, info) {
    requireBarber(token);
    const db = load();
    db.shop = { ...(db.shop || {}), ...info };
    save(db);
  },

  // ---------- slider photos ----------
  async getSlideIds() {
    return (load().slides || []).map((x) => x.id);
  },

  async getSlides() {
    return (load().slides || []).map((x) => ({ id: x.id, src: x.image, alt: 'दुकानाचा फोटो' }));
  },

  async addSlide(token, image) {
    requireBarber(token);
    const db = load();
    db.slides = db.slides || [];
    if (!String(image).startsWith('data:image/') || image.length > 700000) throw fail('हा फोटो वापरता येत नाही');
    if (db.slides.length >= CONFIG.MAX_PHOTOS) throw fail(`जास्तीत जास्त ${CONFIG.MAX_PHOTOS} फोटो ठेवता येतात. आधी एखादा काढा`);
    db.slides.push({ id: uid(), image });
    try { save(db); } catch { throw fail('फोन मध्ये जागा संपली. एखादा जुना फोटो काढा'); }
  },

  async deleteSlide(token, id) {
    requireBarber(token);
    const db = load();
    db.slides = (db.slides || []).filter((x) => x.id !== id);
    save(db);
  },

  async setOpen(token, open) {
    requireBarber(token);
    const db = load();
    db.is_open = !!open;
    save(db);
  },

  resetDemo() {
    localStorage.removeItem(KEY);
    listeners.forEach((f) => f());
  },
};

return api;

})();

const supabaseBackend = (() => {
// Supabase backend (simple version): the page talks straight to the tables with the public key.
// There are no SQL functions to maintain. The barber login is the one in js/config.js.

const ACTIVE = ['pending', 'accepted', 'in_progress'];
const COLS = 'id,name,phone,service,status,is_walk_in,queue_position,duration_minutes,started_at,created_at';
// ---------------------------------------------------------------------------
// Tiny client for Supabase's REST API. It uses plain fetch(), so it needs nothing
// from any CDN: if your network can reach your Supabase project, it works.
// ---------------------------------------------------------------------------
const baseUrl = () => CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/';

function authHeaders(extra = {}) {
  const h = { apikey: CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json', ...extra };
  if (String(CONFIG.SUPABASE_ANON_KEY).startsWith('eyJ')) h.Authorization = `Bearer ${CONFIG.SUPABASE_ANON_KEY}`; // old style keys
  return h;
}

class Query {
  constructor(table) {
    this.table = table;
    this.op = 'select';
    this.params = [];
    this.body = null;
    this.prefer = [];
    this.opts = {};
    this.wantRows = false;
    this.mode = null; // 'single' | 'maybe'
  }
  select(cols = '*', opts = {}) {
    if (this.op === 'select') { this.cols = cols; this.opts = opts; } else { this.cols = cols; this.wantRows = true; }
    return this;
  }
  insert(row) { this.op = 'insert'; this.body = row; return this; }
  update(patch) { this.op = 'update'; this.body = patch; return this; }
  delete() { this.op = 'delete'; return this; }
  upsert(row, o = {}) { this.op = 'upsert'; this.body = row; this.onConflict = o.onConflict; return this; }
  eq(c, v) { this.params.push([c, `eq.${v}`]); return this; }
  in(c, vs) { this.params.push([c, `in.(${vs.join(',')})`]); return this; }
  gte(c, v) { this.params.push([c, `gte.${v}`]); return this; }
  order(c, { ascending = true } = {}) { this.params.push(['order', `${c}.${ascending ? 'asc' : 'desc'}`]); return this; }
  limit(n) { this.params.push(['limit', String(n)]); return this; }
  single() { this.mode = 'single'; return this; }
  maybeSingle() { this.mode = 'maybe'; return this; }
  then(resolve, reject) { return this.exec().then(resolve, reject); }

  async exec() {
    const q = new URLSearchParams();
    if (this.cols) q.set('select', this.cols);
    if (this.onConflict) q.set('on_conflict', this.onConflict);
    for (const [k, v] of this.params) q.append(k, v);
    const prefer = [];
    let method = 'GET';
    if (this.op === 'insert') { method = 'POST'; prefer.push(this.wantRows ? 'return=representation' : 'return=minimal'); }
    if (this.op === 'update') { method = 'PATCH'; prefer.push(this.wantRows ? 'return=representation' : 'return=minimal'); }
    if (this.op === 'delete') { method = 'DELETE'; prefer.push('return=minimal'); }
    if (this.op === 'upsert') { method = 'POST'; prefer.push('resolution=merge-duplicates', 'return=minimal'); }
    if (this.op === 'select' && this.opts.head) method = 'HEAD';
    if (this.opts.count) prefer.push(`count=${this.opts.count}`);
    const headers = authHeaders(prefer.length ? { Prefer: prefer.join(',') } : {});
    let res;
    try {
      res = await fetch(`${baseUrl()}${this.table}?${q.toString()}`, { method, headers, body: this.body ? JSON.stringify(this.body) : undefined });
    } catch (err) {
      return { data: null, error: { message: err.message || 'Failed to fetch' } };
    }
    let count = null;
    const range = res.headers.get('content-range'); // "0-4/5" or "*/5"
    if (range && range.includes('/')) { const n = Number(range.split('/')[1]); count = Number.isNaN(n) ? null : n; }
    if (!res.ok) {
      let e = {};
      try { e = await res.json(); } catch { /* not json */ }
      return { data: null, error: { message: e.message || `HTTP ${res.status}`, details: e.details, code: e.code } };
    }
    if (this.opts.head) return { data: null, error: null, count };
    let data = null;
    const text = await res.text();
    if (text) { try { data = JSON.parse(text); } catch { data = null; } }
    if (this.mode === 'single') {
      if (!Array.isArray(data) || data.length !== 1) return { data: null, error: { message: 'row not found' } };
      return { data: data[0], error: null, count };
    }
    if (this.mode === 'maybe') return { data: Array.isArray(data) ? data[0] ?? null : null, error: null, count };
    return { data, error: null, count };
  }
}

async function sb() {
  return { from: (table) => new Query(table) };
}

// ---------------------------------------------------------------------------
// Optional live updates. This needs the official supabase-js library, which is loaded
// from a CDN only for this. If your network blocks every CDN the page still works:
// it just checks for changes every few seconds instead of instantly.
// ---------------------------------------------------------------------------
let realtimeLib;
let live = false;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    const timer = setTimeout(() => { el.remove(); reject(new Error('timeout')); }, 8000);
    el.src = src;
    el.onload = () => { clearTimeout(timer); resolve(); };
    el.onerror = () => { clearTimeout(timer); el.remove(); reject(new Error('blocked')); };
    document.head.appendChild(el);
  });
}

async function loadRealtimeLib() {
  if (realtimeLib !== undefined) return realtimeLib;
  realtimeLib = null;
  for (const src of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', 'https://unpkg.com/@supabase/supabase-js@2']) {
    try {
      await loadScript(src);
      if (window.supabase && window.supabase.createClient) { realtimeLib = window.supabase; break; }
    } catch { /* try the next one */ }
  }
  return realtimeLib; // null when no CDN is reachable: the page then just checks for changes every few seconds
}

const fail = (msg, extra = {}) => Object.assign(new Error(msg), extra);

// await a Supabase query and turn any error into a Marathi message
async function run(query) {
  const { data, error, count } = await query;
  if (error) {
    console.error('Supabase error:', error);
    // the technical reason is kept so the page can show what is wrong (e.g. tables missing)
    throw fail('काहीतरी चुकले. इंटरनेट तपासा आणि पुन्हा प्रयत्न करा', { detail: error.message || error.details || '' });
  }
  return { data, count };
}

function requireBarber(token) {
  if (!token || !String(token).startsWith('ok-')) throw fail('पुन्हा साइन इन करा', { unauthorized: true });
}

function checkPerson(name, phone, service) {
  const sv = String(service || '').trim();
  if (sv.length < 2 || sv.length > 40) throw fail('कृपया सेवा निवडा');
  const n = String(name || '').trim();
  const p = normalizePhone(phone);
  if (n.length < 2 || n.length > 60) throw fail('कृपया नाव टाका');
  if (!validPhone(p)) throw fail('वैध 10 अंकी मोबाईल नंबर टाका');
  return { n, p, sv };
}

async function assertNoActiveBooking(c, phone) {
  const { data } = await run(c.from('bookings').select('id').eq('phone', phone).in('status', ACTIVE).limit(1));
  if (data.length) throw fail('या नंबरवर आधीच एक नोंद सुरू आहे');
}

// tell the push function (optional) that something changed. Never blocks the page.
function notify(event, bookingId) {
  if (!CONFIG.VAPID_PUBLIC_KEY || !CONFIG.PUSH_KEY) return;
  fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.PUSH_FUNCTION}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify({ event, booking_id: bookingId, token: CONFIG.PUSH_KEY }),
  })
    .then((r) => r.json().then((j) => console.info('push:', r.status, j)))
    .catch((err) => console.warn('push function not reachable (alerts only work while the page is open):', err.message));
}

const EVENT_FOR_ACTION = { accept: 'accepted', reject: 'rejected', start: 'started', complete: 'check', cancel: 'cancelled', move_up: 'check', move_down: 'check', extend: 'check' };

const api = {
  async getShop() {
    const c = await sb();
    return (await run(c.from('shop_settings').select('*').eq('id', 1).single())).data;
  },

  // customers get the queue without full phone numbers
  async getQueue() {
    const c = await sb();
    const since = new Date(Date.now() - 86400000).toISOString();
    const { data } = await run(c.from('bookings').select(COLS).gte('created_at', since));
    return data.map(({ phone, service, ...r }) => ({ ...r, phone_masked: maskPhone(phone) }));
  },

  async book({ name, phone, service }) {
    const c = await sb();
    const { n, p, sv } = checkPerson(name, phone, service);
    const shop = (await run(c.from('shop_settings').select('is_open').eq('id', 1).single())).data;
    if (!shop.is_open) throw fail('दुकान सध्या बंद आहे. कृपया नंतर प्रयत्न करा किंवा फोन करा.');
    await assertNoActiveBooking(c, p);
    const full = await run(c.from('bookings').select('id', { count: 'exact', head: true }).in('status', ACTIVE));
    if (full.count >= CONFIG.MAX_QUEUE) throw fail('रांग सध्या पूर्ण आहे. थोड्या वेळाने प्रयत्न करा');
    const status = CONFIG.AUTO_ACCEPT ? 'accepted' : 'pending';
    const { data } = await run(c.from('bookings').insert({ name: n, phone: p, service: sv, status }).select('id').single());
    return { id: data.id, token: data.id };
  },

  async savePush(bookingId, _token, endpoint, p256dh, auth) {
    const c = await sb();
    await run(c.from('push_subscriptions').upsert({ booking_id: bookingId, endpoint, p256dh, auth }, { onConflict: 'endpoint' }));
  },

  subscribe(cb) {
    let channel = null;
    let rc = null;
    let stopped = false;
    loadRealtimeLib().then((lib) => {
      if (stopped || !lib) return;
      try {
        rc = lib.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        channel = rc
          .channel('queue-watch-' + Math.random().toString(36).slice(2))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, cb)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'shop_settings' }, cb)
          .subscribe((status) => { live = status === 'SUBSCRIBED'; });
      } catch (err) {
        console.warn('Live updates not available, using polling', err);
      }
    });
    return () => { stopped = true; live = false; if (rc && channel) rc.removeChannel(channel); };
  },

  // true while instant updates work, so the pages can check less often
  isLive() {
    return live;
  },

  // ---------- barber ----------
  async login(username, password) {
    const b = CONFIG.BARBER;
    if (username !== b.username || password !== b.password) throw fail('वापरकर्ता नाव किंवा पासवर्ड चुकीचा आहे');
    return 'ok-' + Math.random().toString(36).slice(2);
  },

  async list(token) {
    requireBarber(token);
    const c = await sb();
    const { data } = await run(c.from('bookings').select(COLS).in('status', ACTIVE).order('queue_position', { ascending: true }));
    const startOfDay = new Date();
    startOfDay.setHours(0, 0, 0, 0);
    const done = await run(c.from('bookings').select('id', { count: 'exact', head: true }).eq('status', 'completed').gte('updated_at', startOfDay.toISOString()));
    return { bookings: data, completed_today: done.count || 0 };
  },

  async update(token, id, action, minutes = null) {
    requireBarber(token);
    const c = await sb();
    const b = (await run(c.from('bookings').select('*').eq('id', id).maybeSingle())).data;
    if (!b) throw fail('नोंद सापडली नाही');
    const set = (patch) => run(c.from('bookings').update({ ...patch, updated_at: new Date().toISOString() }).eq('id', id));

    switch (action) {
      case 'accept':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या स्वीकारता येतात');
        await set({ status: 'accepted' }); break;
      case 'reject':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या नाकारता येतात');
        await set({ status: 'rejected' }); break;
      case 'start': {
        if (!['pending', 'accepted'].includes(b.status)) throw fail('या ग्राहकाची सेवा सुरू करता येत नाही');
        if (![10, 20, 30, 40, 50, 60].includes(minutes)) throw fail('10 ते 60 मिनिटे निवडा');
        const busy = await run(c.from('bookings').select('id').eq('status', 'in_progress').limit(1));
        if (busy.data.length) throw fail('आधी सध्याच्या ग्राहकाचे काम पूर्ण करा');
        await set({ status: 'in_progress', started_at: new Date().toISOString(), duration_minutes: minutes, notified_next: false }); break;
      }
      case 'complete':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        await set({ status: 'completed' }); break;
      case 'extend':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        if (!(minutes >= 5 && minutes <= 60)) throw fail('5 ते 60 मिनिटे निवडा');
        await set({ duration_minutes: b.duration_minutes + minutes }); break;
      case 'cancel':
        if (!ACTIVE.includes(b.status)) throw fail('ही नोंद आधीच बंद झाली आहे');
        await set({ status: 'cancelled' }); break;
      case 'move_up':
      case 'move_down': {
        const { data: waiting } = await run(c.from('bookings').select('id,queue_position').in('status', ['pending', 'accepted']).order('queue_position', { ascending: true }));
        const i = waiting.findIndex((x) => x.id === id);
        const other = waiting[action === 'move_up' ? i - 1 : i + 1];
        if (other) {
          const now = new Date().toISOString();
          await run(c.from('bookings').update({ queue_position: other.queue_position, notified_next: false, updated_at: now }).eq('id', id));
          await run(c.from('bookings').update({ queue_position: waiting[i].queue_position, notified_next: false, updated_at: now }).eq('id', other.id));
        }
        break;
      }
      default:
        throw fail('अज्ञात कृती');
    }
    const event = EVENT_FOR_ACTION[action];
    if (event) notify(event, id);
  },

  async addWalkin(token, { name, phone, service }) {
    requireBarber(token);
    const c = await sb();
    const { n, p, sv } = checkPerson(name, phone, service);
    await assertNoActiveBooking(c, p);
    await run(c.from('bookings').insert({ name: n, phone: p, service: sv, status: 'accepted', is_walk_in: true }));
  },

  async saveShop(token, info) {
    requireBarber(token);
    const c = await sb();
    await run(c.from('shop_settings').update(info).eq('id', 1));
  },

  // ---------- slider photos ----------
  async getSlideIds() {
    const c = await sb();
    return (await run(c.from('slider_photos').select('id').order('sort', { ascending: true }))).data.map((x) => x.id);
  },

  async getSlides() {
    const c = await sb();
    const { data } = await run(c.from('slider_photos').select('id,image').order('sort', { ascending: true }));
    return data.map((x) => ({ id: x.id, src: x.image, alt: 'दुकानाचा फोटो' }));
  },

  async addSlide(token, image) {
    requireBarber(token);
    const c = await sb();
    if (!String(image).startsWith('data:image/') || image.length > 700000) throw fail('हा फोटो वापरता येत नाही');
    const n = await run(c.from('slider_photos').select('id', { count: 'exact', head: true }));
    if (n.count >= CONFIG.MAX_PHOTOS) throw fail(`जास्तीत जास्त ${CONFIG.MAX_PHOTOS} फोटो ठेवता येतात. आधी एखादा काढा`);
    await run(c.from('slider_photos').insert({ image }));
  },

  async deleteSlide(token, id) {
    requireBarber(token);
    const c = await sb();
    await run(c.from('slider_photos').delete().eq('id', id));
  },

  async setOpen(token, open) {
    requireBarber(token);
    const c = await sb();
    await run(c.from('shop_settings').update({ is_open: !!open }).eq('id', 1));
  },
};

return api;

})();

function runCustomer() {

const $ = (id) => document.getElementById(id);
const STORE = 'bq_my_booking';

let shop = { ...CONFIG.SHOP };
let rows = [];
let q = buildQueue([], Date.now());
let mine = readMine();
let signature = '';
let showAll = false;
const VISIBLE = 4;
let prevKey = null;
let swReg = null;

function readMine() {
  try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; }
}
function writeMine(v) {
  mine = v;
  if (v) localStorage.setItem(STORE, JSON.stringify(v)); else localStorage.removeItem(STORE);
}

/* ------------------------------------------------------------------ slider (photos added by the barber) */
let slideSig = null; // what is on screen right now
let loadedIds = null; // what the database had the last time we looked
let slideIdx = 0;
let slideCount = 0;
let pausedUntil = 0;

function markDot() {
  [...$('dots').children].forEach((d, i) => d.setAttribute('aria-current', String(i === slideIdx)));
}

function goSlide(i) {
  if (!slideCount) return;
  slideIdx = (i + slideCount) % slideCount;
  $('slides').scrollTo({ left: slideIdx * $('slides').clientWidth, behavior: 'smooth' });
  markDot();
}

function renderSlides(list) {
  const all = [...CONFIG.SLIDES, ...list];
  const sig = all.map((s) => s.id || s.src).join('|');
  if (sig === slideSig) return;
  slideSig = sig;
  slideCount = all.length;
  slideIdx = 0;
  // no photos yet: the slider shrinks to a slim bar (login + clock) instead of showing a empty box
  document.querySelector('.hero').classList.toggle('no-photos', all.length === 0);
  $('slides').innerHTML = all
    .map((s, i) => `<figure class="slide"><img src="${esc(s.src)}" alt="${esc(s.alt || 'दुकानाचा फोटो')}" ${i ? 'loading="lazy"' : ''} decoding="async"></figure>`)
    .join('');
  $('dots').innerHTML = all.length > 1 ? all.map((_, i) => `<button type="button" aria-label="फोटो ${i + 1}" data-i="${i}"></button>`).join('') : '';
  $('slides').scrollLeft = 0;
  markDot();
}

// cheap check (ids only); the pictures themselves are downloaded only when something changed
async function loadSlides() {
  try {
    const ids = await backend.getSlideIds();
    const key = ids.join('|');
    if (key === loadedIds) return;
    const list = await backend.getSlides();
    loadedIds = key;
    renderSlides(list);
  } catch (err) {
    console.error(err);
    if (slideSig === null) renderSlides([]);
  }
}

function setupSlider() {
  const wrap = $('slides');
  wrap.addEventListener('scroll', () => {
    const i = Math.round(wrap.scrollLeft / (wrap.clientWidth || 1));
    if (i !== slideIdx && i < slideCount) { slideIdx = i; markDot(); }
  }, { passive: true });
  $('dots').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) { pausedUntil = Date.now() + 10000; goSlide(Number(b.dataset.i)); }
  });
  ['touchstart', 'pointerdown', 'keydown'].forEach((ev) => wrap.addEventListener(ev, () => { pausedUntil = Date.now() + 10000; }, { passive: true }));
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(() => {
      if (document.hidden || Date.now() < pausedUntil || slideCount < 2) return;
      goSlide(slideIdx + 1);
    }, 4500);
  }
}
