  <style>
/* Salon queue: mobile first (designed at 360px wide).
   Identity: a barber pole. Navy ink, pole red + blue, brass trim like the bulbs round a barber's mirror.
   Yatra One (signboard style Devanagari) for headings, Mukta for text, Barlow Condensed for numbers. */
:root {
  --ink: #0f1b30;
  --ink-2: #1a2b49;
  --lather: #eef1f5;
  --paper: #ffffff;
  --chrome: #d3dae4;
  --steel: #5a687c;
  --red: #d1342c;
  --red-dark: #a5251e;
  --blue: #2457a6;
  --brass: #b98a35;
  --brass-light: #ecd391;
  --green: #17734a;
  --green-bg: #dff3e8;
  --amber: #85540a;
  --amber-bg: #fff0cd;
  --blue-bg: #e1ebfa;
  --grey-bg: #e8ecf1;
  --rose-bg: #fbe3e1;
  --font-display: 'Yatra One', 'Mukta', 'Noto Sans Devanagari', sans-serif;
  --font-body: 'Mukta', 'Noto Sans Devanagari', 'Roboto', system-ui, sans-serif;
  --font-num: 'Barlow Condensed', 'Mukta', sans-serif;
  --stripes: repeating-linear-gradient(-45deg, var(--red) 0 8px, #fff 8px 16px, var(--blue) 16px 24px, #fff 24px 32px);
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--lather); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.35; margin: 0; }
h2 { font-size: 24px; }
p { margin: 0; }
a { color: inherit; }
button, input { font: inherit; color: inherit; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

.app { max-width: 560px; margin: 0 auto; }

/* shop name board at the very top */
.shop-head { position: relative; z-index: 6; display: flex; align-items: center; gap: 12px; max-width: 560px; margin: 0 auto; padding: 8px 12px 8px 14px; padding-top: calc(8px + env(safe-area-inset-top)); background: var(--ink); color: #fff; border-bottom: 3px solid var(--brass); }
.shop-head .pole { flex: none; width: 16px; height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,.65); background: var(--stripes); }
.sh-text { flex: 1; min-width: 0; }
.shop-head h1 { font-size: 24px; line-height: 1.35; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-clock { display: flex; align-items: center; gap: 5px; margin-top: -3px; font-size: 13px; line-height: 1.4; font-weight: 600; color: var(--brass-light); }
.shop-login { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 13px 0 11px; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; font-size: 14px; font-weight: 700; text-decoration: none; }
.shop-login svg { color: var(--brass-light); }
.demo-banner { background: var(--amber-bg); color: var(--amber); font-size: 14px; line-height: 1.4; padding: 8px 16px; text-align: center; }

/* ============================ HERO (small slider) ============================ */
.hero { position: relative; height: clamp(150px, 42vw, 200px); background: var(--ink); overflow: hidden; max-width: 560px; margin: 0 auto; }
.slides { display: flex; height: 100%; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.slides::-webkit-scrollbar { display: none; }
.slide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; margin: 0; }
.slide img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
.hero-shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(to bottom, rgba(15,27,48,0) 55%, rgba(15,27,48,.6) 100%); }
.dots { position: absolute; left: 0; right: 0; bottom: 26px; z-index: 3; display: flex; justify-content: center; gap: 6px; }
.dots button { width: 7px; height: 7px; padding: 0; border: 0; border-radius: 4px; background: rgba(255,255,255,.55); transition: width .2s, background .2s; }
.dots button[aria-current="true"] { width: 20px; background: var(--brass-light); }

/* live strip overlaps the slider: queue length, wait for a new booking, who is in the chair */
.live {
  position: relative; z-index: 4; margin: -18px 10px 0; max-width: 540px; overflow: hidden;
  display: grid; grid-template-columns: .72fr .95fr 1.5fr; background: #fff; border-radius: 16px;
  box-shadow: 0 10px 24px rgba(15,27,48,.26);
}
@media (min-width: 560px) { .live { margin-left: auto; margin-right: auto; } }
.live > div { padding: 8px 10px 11px 12px; min-width: 0; }
.live > div + div { border-left: 1px dashed var(--chrome); }
.live b { display: block; font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.05; color: var(--ink); }
.live b small { font-family: var(--font-body); font-size: 12px; font-weight: 600; color: var(--steel); margin-left: 2px; }
.live span { display: block; font-size: 12px; line-height: 1.25; color: var(--steel); }
.live .lc-label { display: flex; align-items: center; gap: 4px; font-weight: 600; }
.lc-row { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
.live .lc-end { display: block; font-size: 12px; line-height: 1.3; color: var(--steel); }
.live .lc-end:empty { display: none; }
.live .live-chair b { font-family: var(--font-display); font-weight: 400; font-size: 17px; line-height: 1.6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--blue); }
.live .lc-row i { font-style: normal; font-family: var(--font-num); font-weight: 700; font-size: 24px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--ink); }
.live .lc-row i.over { color: var(--red); }
.live .lc-row i.over + * { color: var(--red); }
.live-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: var(--grey-bg); padding: 0 !important; border: 0 !important; }
.live-bar .pole-fill { height: 100%; border-radius: 0; }

/* ============================ CARDS ============================ */
.card { background: var(--paper); border: 1px solid var(--chrome); border-radius: 16px; padding: 14px; margin: 10px 10px; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.section-head h2 { font-size: 20px; }
.count { font-size: 14px; color: var(--steel); font-weight: 600; }
.hint { color: var(--steel); font-size: 16px; line-height: 1.5; margin: 6px 0 16px; max-width: 46ch; }

/* contact: one dark line, name on the left, tap-to-call number on the right */
.contact { position: relative; overflow: hidden; margin-top: 10px; padding: 8px 12px 10px 26px; background: var(--ink); color: #fff; border: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: 'who who' 'main call'; align-items: center; gap: 2px 10px; }
.contact .who { grid-area: who; }
.contact-main { grid-area: main; min-width: 0; }
.contact-call { grid-area: call; }
.contact::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(-45deg, var(--red) 0 8px, #fff 8px 16px, var(--blue) 16px 24px, #fff 24px 32px); }
.who { display: flex; align-items: center; gap: 6px; color: var(--brass-light); font-size: 13px; font-weight: 700; line-height: 1.5; }
.who svg { flex: none; }
.state { font-style: normal; margin-left: auto; padding: 0 9px 0 8px; border-radius: 999px; background: rgba(47,168,102,.25); color: #8ee8b4; font-size: 12px; font-weight: 700; line-height: 1.6; white-space: nowrap; }
.state::before { content: ''; display: inline-block; width: 7px; height: 7px; margin-right: 5px; border-radius: 50%; background: currentColor; vertical-align: 1px; }
.state.closed { background: rgba(209,52,44,.3); color: #ffb3ad; }
.contact-name { font-family: var(--font-display); font-size: 21px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.contact-address { color: #aebbd0; font-size: 13px; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.contact-call { display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: 14px; background: var(--red); color: #fff; text-decoration: none; font-family: var(--font-num); font-weight: 700; font-size: 23px; letter-spacing: .04em; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }

/* buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 52px; padding: 0 20px; border: 0; border-radius: 14px;
  font-weight: 700; font-size: 17px; text-decoration: none; cursor: pointer; text-align: center;
  transition: transform .08s, background .15s;
}
.btn:active { transform: scale(.98); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--red); color: #fff; box-shadow: inset 0 -3px 0 rgba(0,0,0,.18); }
.btn-primary:hover { background: var(--red-dark); }
.btn-dark { background: var(--ink); color: #fff; }
.btn-call { background: #fff; color: var(--ink); }
.btn-ghost { background: transparent; border: 1.5px solid var(--chrome); color: var(--ink); }
.btn-blue { background: var(--blue); color: #fff; }
.btn-danger { background: var(--rose-bg); color: var(--red-dark); }
.btn-block { width: 100%; }
.btn-sm { min-height: 44px; padding: 0 14px; font-size: 15px; }

/* ============================ FORMS ============================ */
.book { position: relative; overflow: hidden; padding-top: 22px; }
.book h2 { margin-bottom: 16px; }
.book::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 8px; background: var(--stripes); }
.field { margin-bottom: 10px; }
.field label { display: block; font-weight: 700; font-size: 16px; margin-bottom: 6px; }
.field input { width: 100%; min-height: 52px; padding: 0 14px; font-size: 17px; background: #f8fafc; border: 1.5px solid var(--chrome); border-radius: 12px; }
.field input:focus { border-color: var(--blue); background: #fff; outline: none; box-shadow: 0 0 0 4px rgba(36,87,166,.16); }
.form-error { color: var(--red-dark); background: var(--rose-bg); border-radius: 10px; padding: 10px 12px; font-size: 15px; margin-bottom: 12px; }
.closed-msg { background: var(--rose-bg); color: var(--red-dark); padding: 12px 14px; border-radius: 12px; }

.field select { width: 100%; min-height: 52px; padding: 0 40px 0 14px; font-size: 17px; background: #f8fafc url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='20' height='20' viewBox='0 0 24 24'><path fill='%230f1b30' d='M7 10l5 5 5-5z'/></svg>") no-repeat right 12px center; border: 1.5px solid var(--chrome); border-radius: 12px; appearance: none; -webkit-appearance: none; }
.field select:focus { border-color: var(--blue); background-color: #fff; outline: none; box-shadow: 0 0 0 4px rgba(36,87,166,.16); }
.field select:invalid { color: #6b7787; }
.field select option { color: var(--ink); }
.input-mic { position: relative; }
.input-mic input { padding-right: 64px; }
.mic { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 42px; height: 42px; border: 0; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: #fff; cursor: pointer; }
.mic.listening { background: var(--red); animation: mic-pulse 1.1s ease-out infinite; }
@keyframes mic-pulse { 0% { box-shadow: 0 0 0 0 rgba(209,52,44,.55); } 100% { box-shadow: 0 0 0 16px rgba(209,52,44,0); } }
.mic-status { margin-top: 6px; font-size: 14px; color: var(--steel); }
.mic-status.err { color: var(--red-dark); }

/* ============================ MY TICKET ============================ */
.ticket { padding: 0; border: 2px solid var(--ink); overflow: hidden; background: #fff; }
.ticket-head { display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-bottom: 2px dashed var(--chrome); }
.t-num { flex: none; min-width: 60px; padding: 6px 8px; text-align: center; background: var(--ink); color: #fff; border-radius: 10px; font-family: var(--font-num); font-weight: 700; font-size: 30px; line-height: 1.15; }
.ticket h2 { font-size: 20px; line-height: 1.4; }
.ticket-head p { color: var(--steel); margin-top: 0; font-size: 14px; line-height: 1.4; }
.ticket .note { font-size: 13px; line-height: 1.4; color: var(--steel); padding: 8px 14px 10px; }
.ticket .t-actions { padding: 10px 14px 12px; display: grid; gap: 8px; }
.ticket .t-actions .note { padding: 0; }
.ticket.is-next { border-color: var(--amber); }
.ticket.is-next .ticket-head { background: var(--amber-bg); }
.ticket.is-next .t-num { background: var(--amber); }
.ticket.is-chair { border-color: var(--blue); }
.ticket.is-chair .ticket-head { background: var(--blue-bg); }
.ticket.is-chair .t-num { background: var(--blue); }
.ticket.is-done .t-num { background: var(--green); }

/* ============================ CHAIR (dark panel) ============================ */
.chair { background: var(--ink); color: #fff; border: 0; position: relative; overflow: hidden; }
.chair::after { content: ''; position: absolute; right: -40px; top: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(236,211,145,.22), transparent 70%); pointer-events: none; }
.chair h2 { color: #fff; }
.chair-person { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 14px; }
.chair-name { font-family: var(--font-display); font-size: 28px; line-height: 1.35; }
.chair-time { font-family: var(--font-num); font-weight: 700; font-size: 50px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--brass-light); }
.chair-time.over { color: #ff8b82; }
.chair .pole-bar { background: rgba(255,255,255,.12); border-color: rgba(255,255,255,.2); }
.chair-meta { margin-top: 10px; color: #b7c4d8; font-size: 15px; line-height: 1.45; }
.chair .empty { color: #b7c4d8; }
.chair a.b-phone { color: var(--brass-light); }
.pole-bar { height: 24px; border-radius: 12px; background: var(--grey-bg); border: 1px solid var(--chrome); overflow: hidden; }
.pole-fill { height: 100%; width: 0; border-radius: 12px; transition: width 1s linear; background: repeating-linear-gradient(-45deg, var(--red) 0 12px, #fff 12px 24px, var(--blue) 24px 36px, #fff 36px 48px); background-size: 68px 68px; animation: pole-spin 1.2s linear infinite; }
@keyframes pole-spin { to { background-position: 68px 0; } }
.empty { color: var(--steel); padding: 6px 0; }

/* ============================ QUEUE (ticket stubs) ============================ */
.queue { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
li.empty { padding: 6px 2px; }
.q-item { display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; align-items: stretch; background: #fff; border: 1.5px solid var(--chrome); border-radius: 14px; overflow: hidden; }
.q-num { display: grid; place-items: center; background: var(--ink); color: #fff; font-family: var(--font-num); font-weight: 700; font-size: 26px; border-right: 3px dotted rgba(255,255,255,.35); }
.q-item > div:nth-child(2) { padding: 6px 6px 6px 10px; min-width: 0; align-self: center; }
.q-item.mine { border-color: var(--red); background: #fff6f4; }
.q-item.mine .q-num { background: var(--red); }
.q-name { font-weight: 700; font-size: 16px; line-height: 1.35; overflow-wrap: anywhere; }
.q-phone { color: var(--steel); font-size: 13px; line-height: 1.2; font-family: var(--font-num); letter-spacing: .05em; }
.you { margin-left: 6px; padding: 0 9px; border-radius: 999px; background: var(--red); color: #fff; font-size: 13px; font-weight: 700; vertical-align: 2px; }
.walkin { margin-left: 6px; padding: 0 9px; border-radius: 999px; background: var(--grey-bg); color: var(--steel); font-size: 13px; font-weight: 700; vertical-align: 2px; }
.q-side { display: grid; align-content: center; justify-items: end; gap: 2px; text-align: right; padding: 6px 10px 6px 0; }
.q-wait { font-size: 12px; line-height: 1.2; color: var(--steel); }

.badge { display: inline-block; padding: 0 10px; border-radius: 999px; font-size: 12px; line-height: 1.6; font-weight: 700; white-space: nowrap; }
.badge[data-s="pending"] { background: var(--amber-bg); color: var(--amber); }
.badge[data-s="accepted"] { background: var(--green-bg); color: var(--green); }
.badge[data-s="in_progress"] { background: var(--blue-bg); color: var(--blue); }
.badge[data-s="completed"] { background: var(--grey-bg); color: var(--steel); }
.badge[data-s="cancelled"], .badge[data-s="rejected"] { background: var(--rose-bg); color: var(--red-dark); }

/* ============================ TOASTS ============================ */
#toasts { position: fixed; z-index: 100; left: 12px; right: 12px; top: calc(12px + env(safe-area-inset-top)); display: grid; gap: 8px; pointer-events: none; max-width: 536px; margin: 0 auto; }
.toast { pointer-events: auto; display: grid; gap: 2px; padding: 14px 16px; border-radius: 14px; background: var(--ink); color: #fff; box-shadow: 0 10px 26px rgba(0,0,0,.35); animation: toast-in .25s ease-out; line-height: 1.4; }
.toast strong { font-family: var(--font-display); font-weight: 400; font-size: 20px; }
.toast-alert { background: var(--red); }
.toast-ok { background: var(--green); }
.toast-error { background: var(--red-dark); }
.toast.out { opacity: 0; transition: opacity .35s; }
@keyframes toast-in { from { transform: translateY(-10px); opacity: 0; } }

.ver { text-align: center; font-size: 11px; color: #9aa6b6; padding: 4px 0 14px; }
.foot { text-align: center; padding: 2px 16px 18px; font-size: 13px; }
.foot a { color: var(--steel); }

/* ============================ BARBER PAGES ============================ */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--ink); color: #fff; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); border-bottom: 3px solid var(--brass); }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand-name { font-family: var(--font-display); font-size: 20px; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.topbar .pole, .login-card .pole { flex: none; width: 14px; height: 32px; border-radius: 7px; border: 1px solid rgba(255,255,255,.6); background: var(--stripes); }

.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 20px; background: radial-gradient(circle at 50% 0, #223a63 0, var(--ink) 70%); }
.login-card { width: 100%; max-width: 380px; margin: 0; border: 0; position: relative; overflow: hidden; padding-top: 34px; }
.login-card::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--stripes); }
.login-card .pole { width: 18px; height: 44px; margin-bottom: 12px; border-color: var(--ink); }
.login-card h1 { font-size: 30px; margin-bottom: 2px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px; }
.stat { background: #fff; border: 1px solid var(--chrome); border-radius: 14px; padding: 6px 6px 8px; text-align: center; }
.stat b { display: block; font-family: var(--font-num); font-weight: 700; font-size: 32px; line-height: 1.1; }
.stat span { font-size: 14px; color: var(--steel); }

.switch { display: inline-flex; align-items: center; gap: 8px; background: transparent; border: 0; color: #fff; cursor: pointer; padding: 6px 0; min-height: 44px; font-weight: 600; }
.switch .track { width: 48px; height: 28px; border-radius: 14px; background: #6b7a90; position: relative; transition: background .2s; }
.switch .track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
.switch[aria-checked="true"] .track { background: #2fa866; }
.switch[aria-checked="true"] .track::after { transform: translateX(20px); }

.toolbar { display: flex; gap: 8px; margin: 0 10px; flex-wrap: wrap; }
.toolbar .btn { flex: 1 1 140px; }

.b-item { border: 1.5px solid var(--chrome); border-radius: 14px; padding: 10px; background: #fff; display: grid; gap: 10px; }
.b-top { display: grid; grid-template-columns: 50px minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.b-top .q-num { height: 50px; border-radius: 10px; border-right: 0; }
.b-name { font-weight: 700; font-size: 19px; line-height: 1.35; overflow-wrap: anywhere; }
.b-phone { color: var(--blue); font-family: var(--font-num); font-weight: 600; font-size: 20px; letter-spacing: .04em; text-decoration: none; }
.b-time { font-size: 13px; line-height: 1.35; color: var(--steel); }
.b-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.b-actions .btn { flex: 1 1 78px; padding: 0 10px; }
.b-actions.row { display: grid; grid-template-columns: 1fr 1fr 46px 46px; gap: 8px; }
.b-actions.row .btn { flex: none; padding: 0 6px; min-width: 0; }
.b-actions.row .btn-icon { padding: 0; font-size: 20px; }
.chair .b-actions .btn-ghost { border-color: rgba(255,255,255,.35); color: #fff; }

dialog { border: 0; border-radius: 20px; padding: 22px 16px; width: min(92vw, 420px); color: var(--ink); }
dialog::backdrop { background: rgba(15,27,48,.65); }
dialog h2 { margin-bottom: 2px; }
.dur-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
.dur-grid button { min-height: 72px; border: 1.5px solid var(--chrome); border-radius: 14px; background: #fff; cursor: pointer; font-family: var(--font-num); font-size: 36px; font-weight: 700; line-height: 1.1; }
.dur-grid button small { display: block; font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--steel); }
.dur-grid button.suggest { border-color: var(--green); background: var(--green-bg); }
.dur-grid button.suggest small { color: var(--green); }
.svc-chip { display: inline-block; margin: 2px 0; padding: 0 10px; border-radius: 999px; background: var(--blue-bg); color: var(--blue); font-size: 13px; font-weight: 700; line-height: 1.6; }
.chair .svc-chip { background: rgba(236,211,145,.2); color: var(--brass-light); }
.ticket .svc b { color: var(--ink); }

/* timer reached zero popup */
.time-dialog { position: relative; overflow: hidden; padding-top: 28px; }
.time-dialog::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 10px; background: var(--stripes); }
.time-dialog h2 { color: var(--red-dark); font-size: 28px; }
.dlg-label { margin: 10px 0 6px; font-weight: 700; font-size: 15px; color: var(--steel); }
.ext-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 8px; }
.ext-grid button { min-height: 62px; border: 1.5px solid var(--chrome); border-radius: 12px; background: #fff; cursor: pointer; font-family: var(--font-num); font-size: 28px; font-weight: 700; line-height: 1.1; }
.ext-grid button small { display: block; font-family: var(--font-body); font-size: 11px; font-weight: 600; color: var(--steel); }
.ext-grid button:hover, .ext-grid button:focus-visible { border-color: var(--blue); background: var(--blue-bg); }
.time-dialog .btn-block + .btn-block { margin-top: 8px; }
.dur-grid button:hover, .dur-grid button:focus-visible { border-color: var(--blue); background: var(--blue-bg); }

@media (min-width: 600px) {
  .contact { grid-template-columns: 1fr 200px; align-items: center; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .pole-fill, .mic.listening, .toast { animation: none; }
  .btn, .dots button { transition: none; }
}

/* photo manager (barber) */
.photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
.photo-grid .ph { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; background: var(--grey-bg); }
.photo-grid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-grid .ph button { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border: 0; border-radius: 50%; background: rgba(15,27,48,.82); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
.photo-empty { grid-column: 1 / -1; padding: 14px 4px; color: var(--steel); }
label.btn input { display: none; }

/* call button for each customer (barber) */
.b-side { display: grid; justify-items: end; align-content: start; gap: 8px; }
.call-btn { flex: 0 0 46px; width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: #1f8f4d; color: #fff; text-decoration: none; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
.call-btn:active { transform: scale(.94); }
.b-actions .call-btn { align-self: center; }

/* ============================ v14 additions ============================ */
dialog { max-height: 92vh; overflow-y: auto; }
.notice { max-width: 560px; margin: 0 auto; padding: 9px 14px; background: var(--amber-bg); color: var(--amber); border-bottom: 1px solid #f0d9a0; font-weight: 700; font-size: 15px; line-height: 1.4; text-align: center; }
.contact-address { text-decoration: underline dotted rgba(255,255,255,.4); text-underline-offset: 3px; }
.t-small { display: flex; gap: 8px; flex-wrap: wrap; padding: 4px 14px 14px; }
.t-small .btn { flex: 1 1 140px; }
.pay { margin-top: 4px; padding: 10px 14px 14px; border-top: 2px dashed var(--chrome); }
.pay .note { padding: 0 0 8px; }
.pay-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.pay-actions .btn { flex: 1 1 140px; }
.payqr { display: block; width: min(100%, 320px); margin: 12px auto 0; border-radius: 12px; border: 1px solid var(--chrome); background: #fff; }
.ver-row { text-align: center; margin: 0; }
.install { min-height: 42px; padding: 0 18px; border: 1.5px solid var(--chrome); border-radius: 999px; background: #fff; font-weight: 700; cursor: pointer; color: var(--ink); }

/* barber */
.stat .money { display: block; margin-top: -2px; font-size: 15px; font-weight: 700; color: var(--green); }
.push-banner { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 10px 10px; padding: 10px 12px; background: var(--blue-bg); border-radius: 12px; font-size: 15px; line-height: 1.35; }
.push-banner span { flex: 1; }
.hist-chip { display: inline-block; margin: 2px 0 2px 6px; padding: 0 10px; border-radius: 999px; background: var(--green-bg); color: var(--green); font-size: 13px; font-weight: 700; line-height: 1.6; }
.chair .hist-chip { background: rgba(143, 232, 180, .2); color: #8ee8b4; }
.toast-action { align-self: start; margin-top: 8px; min-height: 38px; padding: 0 16px; border: 0; border-radius: 999px; background: #fff; color: var(--ink); font-weight: 700; cursor: pointer; }
.field.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.field input[type="time"] { width: 100%; }
.hint.small { font-size: 13px; margin: 0 0 12px; }
.svc-head, .svc-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 72px 36px; gap: 6px; align-items: center; }
.svc-head { margin-bottom: 4px; }
.svc-head span { font-size: 13px; font-weight: 700; color: var(--steel); }
.svc-row { margin-bottom: 8px; }
.svc-row input { width: 100%; min-width: 0; min-height: 46px; padding: 0 10px; border: 1.5px solid var(--chrome); border-radius: 10px; background: #f8fafc; font-size: 16px; }
.svc-row input:focus { border-color: var(--blue); outline: none; background: #fff; }
.s-del { width: 36px; height: 36px; border: 0; border-radius: 50%; background: var(--rose-bg); color: var(--red-dark); font-size: 20px; line-height: 1; cursor: pointer; }
.pay-preview img { display: block; width: 100%; max-height: 320px; margin: 8px auto 12px; object-fit: contain; border: 1px solid var(--chrome); border-radius: 12px; background: #fff; }
.help-steps { padding-left: 18px; line-height: 1.9; }
.help-steps li { margin-bottom: 14px; }

/* ============================ v15: call button in the header, details card as first slide ============================ */
.shop-head h1 { display: flex; align-items: center; gap: 8px; min-width: 0; }
.shop-head h1 #shopName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.closed-tag { flex: none; font-style: normal; font-family: var(--font-body); font-size: 12px; font-weight: 700; line-height: 1.7; padding: 0 9px; border-radius: 999px; background: var(--red); color: #fff; }
.shop-head .shop-login { display: inline-flex; align-items: center; gap: 5px; min-height: 30px; margin-top: -5px; padding: 0 4px; border-radius: 0; background: none; color: #cfd8e6; font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }
.shop-call { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 14px; border-radius: 14px; background: var(--red); color: #fff; text-decoration: none; font-family: var(--font-num); font-weight: 700; font-size: 22px; letter-spacing: .03em; box-shadow: inset 0 -3px 0 rgba(0,0,0,.2); }
.shop-call:active { transform: scale(.97); }
.info-slide { position: relative; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 3px; padding: 10px 16px 34px 30px; background: radial-gradient(circle at 88% 0, #28446f 0, var(--ink) 62%); color: #fff; overflow: hidden; }
.info-slide::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 10px; background: repeating-linear-gradient(-45deg, var(--red) 0 8px, #fff 8px 16px, var(--blue) 16px 24px, #fff 24px 32px); }
.info-slide .who { width: 100%; padding-right: 96px; }
.info-slide .contact-name { font-size: 28px; line-height: 1.3; }
.info-clock { position: absolute; top: 10px; right: 12px; display: inline-flex; align-items: center; gap: 5px; padding: 2px 10px; border-radius: 999px; background: rgba(255,255,255,.12); color: var(--brass-light); font-size: 13px; font-weight: 700; }
.map-pill { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; min-height: 36px; padding: 0 12px 0 10px; border-radius: 999px; background: rgba(255,255,255,.14); color: #fff; font-size: 14px; text-decoration: none; }
.map-pill svg { flex: none; color: var(--brass-light); }
.map-pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.info-hours { margin: 0; font-size: 13px; font-weight: 600; color: var(--brass-light); }
.info-slide .who { padding-right: 0; justify-content: flex-start; }
.info-slide .state { margin-left: 8px; }
.shop-head .shop-login { min-height: 26px; margin-top: -6px; }

.pay-hint { background: var(--amber-bg); color: var(--amber); }
.hint-x { flex: none; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(0,0,0,.08); color: inherit; font-size: 22px; line-height: 1; cursor: pointer; }

.check-list { list-style: none; margin: 0 0 10px; padding: 0; display: grid; gap: 4px; font-size: 15px; }
.check-list li.ok { color: var(--green); }
.check-list li.bad { color: var(--red-dark); font-weight: 600; }
.check-list small { font-weight: 400; color: var(--steel); }

.ver { user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; min-height: 30px; }

/* logout lives in the top bar of the barber page */
.topbar .brand { flex: 1; }
.top-logout { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border: 1.5px solid rgba(255,255,255,.4); border-radius: 12px; background: transparent; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
.top-logout:active { background: rgba(255,255,255,.14); }
.topbar { gap: 10px; }
.topbar .switch { gap: 6px; }

/* ============================ v24: tools grid, door QR, accounts, break ============================ */
.toolbar.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; margin-bottom: 4px; }
.toolbar.tools .btn { flex: none; min-height: 50px; padding: 0 6px; font-size: 14px; }
.qend { margin: 0 12px 8px; font-size: 14px; line-height: 1.4; color: var(--steel); }
.break-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 10px 8px; }
.break-bar:empty { display: none; }
.break-bar .btn { flex: 1 1 120px; }
.brk-on { flex: 1 1 100%; padding: 8px 12px; border-radius: 10px; background: var(--amber-bg); color: var(--amber); font-size: 14px; font-weight: 700; line-height: 1.4; }
.mini-link { display: inline-block; min-height: 32px; padding: 4px 0; border: 0; background: none; color: var(--blue); font-size: 14px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.b-nophone { color: var(--steel); font-size: 14px; }
.qr-card { text-align: center; background: #fff; border: 2px solid var(--ink); border-radius: 16px; padding: 14px 14px 12px; }
.qr-shop { font-family: var(--font-display); font-size: 26px; line-height: 1.3; margin-bottom: 4px; }
.qr-box svg { display: block; width: min(100%, 300px); height: auto; margin: 0 auto; }
.qr-cta { margin-top: 6px; font-family: var(--font-display); font-size: 22px; line-height: 1.3; }
.qr-card.empty .qr-cta { display: none; }
.rep-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
.rep-card { padding: 8px 4px; border-radius: 12px; background: var(--lather); text-align: center; }
.rep-card span { display: block; font-size: 12px; color: var(--steel); }
.rep-card b { display: block; font-size: 15px; }
.rep-card em { display: block; font-style: normal; font-weight: 700; color: var(--green); }
.rep-h { margin: 14px 0 6px; font-size: 18px; }
.rep-day { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px; }
.rep-day i { display: block; height: 10px; min-width: 2px; border-radius: 5px; background: var(--blue); }
.rep-day b { font-size: 13px; white-space: nowrap; }
.rep-best { margin: 0; padding-left: 20px; }
.rep-best li { padding: 3px 0; }
.rep-best li span { margin-right: 8px; }
.rep-best li b { float: right; font-size: 13px; }
/* printing the door QR: only the card is printed */
@media print {
  body * { visibility: hidden !important; }
  #qrCard, #qrCard * { visibility: visible !important; }
  #qrDialog { position: absolute !important; inset: 0 !important; margin: 0 !important; padding: 0 !important; border: 0 !important; max-height: none !important; overflow: visible !important; width: auto !important; background: #fff !important; }
  #qrCard { position: absolute; left: 50%; top: 20px; width: 150mm; max-width: 92%; transform: translateX(-50%); border-width: 3px; }
  #qrCard .qr-shop { font-size: 34px; }
  #qrCard .qr-cta { font-size: 28px; }
  dialog::backdrop { display: none !important; }
}

  </style>
</head>
<body>
  <div id="root"></div>
  <div id="toasts" aria-live="polite"></div>

  <template id="tplCustomer">
<div id="demoBanner" class="demo-banner" hidden>डेमो मोड: माहिती फक्त या फोनमध्येच राहते. प्रत्यक्ष वापरासाठी Supabase कळा टाका.</div>

  <header class="shop-head">
    <span class="pole" aria-hidden="true"></span>
    <div class="sh-text">
      <h1><span id="shopName">सलून</span><em id="closedTag" class="closed-tag" hidden>बंद</em></h1>
      <a id="loginLink" class="shop-login" href="#barber"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg> <span>लॉगिन</span></a>
    </div>
    <a id="phoneText" class="shop-call" href="#" aria-label="केशकर्तनकारांना फोन करा">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>
      <span id="phoneNum"></span>
    </a>
  </header>

  <div id="noticeBar" class="notice" role="status" hidden></div>

  <div class="hero">
    <div id="slides" class="slides" tabindex="0" aria-roledescription="carousel" aria-label="दुकानाची माहिती आणि फोटो"></div>
    <div class="hero-shade"></div>
    <div id="dots" class="dots"></div>
  </div>

  <section class="live" aria-label="सध्याची स्थिती">
    <div><b id="liveCount">0</b><span>जण रांगेत</span></div>
    <div><b id="liveWait">0<small>मि.</small></b><span>नवीन नंबरला</span></div>
    <div class="live-chair">
      <span class="lc-label"><svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>ग्राहक खुर्चीवर</span>
      <div class="lc-row"><b id="liveChair">रिकामी</b><i id="liveTime"></i></div>
      <span id="liveEnd" class="lc-end"></span>
    </div>
    <div id="liveBarWrap" class="live-bar" hidden><div id="liveBar" class="pole-fill"></div></div>
  </section>

  <main class="app">
    <section id="ticketWrap" class="card ticket" hidden aria-live="polite"></section>

    <section id="bookWrap" class="card book" aria-labelledby="bookTitle">
      <h2 id="bookTitle" class="visually-hidden">नंबर लावा</h2>
      <form id="bookForm" novalidate>
        <div class="field">
          <label for="name" class="visually-hidden">तुमचे नाव</label>
          <div class="input-mic">
            <input id="name" name="name" type="text" lang="mr" autocomplete="name" maxlength="60" required placeholder="तुमचे नाव लिहा किंवा बोला">
            <button id="micBtn" class="mic" type="button" aria-label="बोलून नाव सांगा" aria-pressed="false">
              <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15zm6-3.500a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.910V20H9.500a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H13v-2.590A6 6 0 0 0 18 11.500z"/></svg>
            </button>
          </div>
          <p id="micStatus" class="mic-status" aria-live="polite" hidden></p>
        </div>
        <div class="field">
          <label for="phone" class="visually-hidden">मोबाईल नंबर</label>
          <div class="input-mic">
            <input id="phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel" maxlength="20" required placeholder="मोबाईल नंबर (10 अंकी)">
            <button id="micPhoneBtn" class="mic" type="button" aria-label="बोलून नंबर सांगा" aria-pressed="false"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15a3.5 3.5 0 0 0 3.5-3.5V6a3.5 3.5 0 0 0-7 0v5.5A3.5 3.5 0 0 0 12 15zm6-3.500a1 1 0 1 0-2 0 4 4 0 0 1-8 0 1 1 0 1 0-2 0 6 6 0 0 0 5 5.910V20H9.500a1 1 0 1 0 0 2h5a1 1 0 1 0 0-2H13v-2.590A6 6 0 0 0 18 11.500z"/></svg></button>
          </div>
          <p id="micPhoneStatus" class="mic-status" aria-live="polite" hidden></p>
        </div>
        <div class="field">
          <label for="service" class="visually-hidden">सेवा</label>
          <select id="service" name="service" required></select>
        </div>
        <p id="formError" class="form-error" role="alert" hidden></p>
        <button id="bookBtn" class="btn btn-primary btn-block" type="submit">माझा नंबर लावा</button>

    <section class="card queue-card" aria-labelledby="queueTitle">
      <div class="section-head">
        <h2 id="queueTitle">थेट रांग</h2>
        <span id="queueCount" class="count"></span>
      </div>
      <ol id="queueList" class="queue"></ol>
      <p id="netError" class="form-error" hidden>सर्व्हरशी संपर्क होत नाही. पुन्हा प्रयत्न सुरू आहे.</p>
    </section>
  </main>

  <p class="ver-row"><button id="installBtn" class="install" type="button" hidden>होम स्क्रीनवर ठेवा</button></p>
  <p id="ver" class="ver"></p>
  </template>

  <template id="tplBarber">
<!-- ---------- login ---------- -->

      <span class="pole" aria-hidden="true"></span>

      <p class="foot"><a id="backLink" href="./">ग्राहक पानावर परत जा</a></p>
    </section>
  </div>

  <!-- ---------- dashboard ---------- -->
  <div id="dashView" hidden>

      <button id="logoutBtn" class="top-logout" type="button"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10.09 15.59 11.5 17l5-5-5-5-1.41 1.41L12.67 11H3v2h9.67l-2.58 2.59zM19 3H5a2 2 0 0 0-2 2v4h2V5h14v14H5v-4H3v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2z"/></svg><span>लॉग आउट</span></button>

      <div class="field">

// ===================== end of settings =====================

const MODE = CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY ? 'supabase' : 'demo';

const esc = (s) =>
  String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function normalizePhone(value) {
  let d = String(value || '').replace(/\D/g, '');
  if (d.length > 10) d = d.slice(-10); // drop +91 / 0 prefixes
  return d;
}

const validPhone = (d) => /^\d{10}$/.test(d);

function maskPhone(p) {
  const d = String(p || '');
  if (d.length < 6) return d;
  return d.slice(0, 2) + '****' + d.slice(-4);
}

function statusLabel(s) {
  return (
    { pending: 'मंजुरीची वाट', accepted: 'रांगेत', in_progress: 'खुर्चीवर', completed: 'पूर्ण', cancelled: 'रद्द', rejected: 'नाकारले' }[s] || s
  );
}

function fmtClock(ms) {
  const neg = ms < 0;
  const total = Math.floor(Math.abs(ms) / 1000);
  const m = String(Math.floor(total / 60)).padStart(2, '0');
  const s = String(total % 60).padStart(2, '0');
  return (neg ? '+' : '') + m + ':' + s;
}

// Marathi style time of day, e.g. "सकाळी 8:38"
function fmtTime(iso) {
  const d = new Date(iso);
  const h = d.getHours();
  const part = h >= 4 && h < 12 ? 'सकाळी' : h >= 12 && h < 16 ? 'दुपारी' : h >= 16 && h < 20 ? 'संध्याकाळी' : 'रात्री';
  const h12 = h % 12 === 0 ? 12 : h % 12;
  return `${part} ${h12}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function waitText(min) {
  if (min <= 0) return 'आता';
  if (min < 60) return `सुमारे ${min} मिनिटे`;
  const h = Math.floor(min / 60);
  const m = min % 60;
  return m ? `सुमारे ${h} तास ${m} मिनिटे` : `सुमारे ${h} तास`;
}

// ---- sound (needs one tap on the page first; browsers block autoplay) ----
let audioCtx = null;
function unlockAudio() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  } catch {
    /* sound is optional */
  }
}
window.addEventListener('pointerdown', unlockAudio, { once: true });

function beep(times = 2) {
  if (!audioCtx) return;
  for (let i = 0; i < times; i++) {
    const t = audioCtx.currentTime + i * 0.28;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.value = 880;
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(0.25, t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.22);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + 0.25);
  }
}

function vibrate(pattern = [200, 100, 200]) {
  try {
    navigator.vibrate?.(pattern);
  } catch {
    /* ignore */
  }
}

// ---- toast ----  (action: { label, onClick } adds a button, e.g. "undo")
function toast(message, { type = 'info', ms = 4500, title = '', action = null } = {}) {
  let host = document.getElementById('toasts');
  if (!host) {
    host = document.createElement('div');
    host.id = 'toasts';
    host.setAttribute('aria-live', 'polite');
    document.body.appendChild(host);
  }
  if (type === 'alert') host.querySelectorAll('.toast').forEach((t) => t.remove()); // newest alert wins
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  if (type === 'alert' || type === 'error') el.setAttribute('role', 'alert');
  el.innerHTML = (title ? `<strong>${esc(title)}</strong>` : '') + `<span>${esc(message)}</span>`;
  if (action) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'toast-action';
    b.textContent = action.label;
    b.addEventListener('click', () => { el.remove(); action.onClick(); });
    el.appendChild(b);
  }
  host.appendChild(el);
  setTimeout(() => el.classList.add('out'), ms);
  setTimeout(() => el.remove(), ms + 400);
}

// gives up waiting after some time, so a screen never hangs on something that will not happen
function withTimeout(promise, ms, message) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(message)), ms))]);
}

function urlB64ToUint8Array(base64String) {
  const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map((c) => c.charCodeAt(0)));
}

async function registerSW() {
  if (!('serviceWorker' in navigator)) return null;

}

// ---- voice input (Chrome on Android, needs https and internet) ----
const NUM_WORDS = {
  'शून्य': '0', 'शुन्य': '0', 'झिरो': '0', 'जीरो': '0', zero: '0',
  'एक': '1', one: '1', 'वन': '1',
  'दोन': '2', 'दो': '2', two: '2', 'टू': '2',
  'तीन': '3', three: '3', 'थ्री': '3',
  'चार': '4', four: '4', 'फोर': '4',
  'पाच': '5', 'पांच': '5', 'पाँच': '5', five: '5', 'फाईव्ह': '5', 'फाइव': '5',
  'सहा': '6', 'छह': '6', 'छः': '6', 'छे': '6', six: '6', 'सिक्स': '6',
  'सात': '7', seven: '7', 'सेव्हन': '7', 'सेवन': '7',
  'आठ': '8', eight: '8', 'एट': '8',
  'नऊ': '9', 'नौ': '9', 'नव': '9', nine: '9', 'नाईन': '9', 'नाइन': '9',
};
const REPEAT_WORDS = { double: 2, 'डबल': 2, triple: 3, 'ट्रिपल': 3 };

// "९८७६ पाच चार डबल तीन" -> "98765433"
function spokenToDigits(text) {
  const dev = '०१२३४५६७८९';
  const t = String(text || '').replace(/[०-९]/g, (ch) => String(dev.indexOf(ch))).toLowerCase();
  let out = '';
  let times = 1;
  for (const tok of t.split(/[\s,.\-]+/).filter(Boolean)) {
    if (REPEAT_WORDS[tok]) { times = REPEAT_WORDS[tok]; continue; }
    const d = NUM_WORDS[tok] ?? (/^\d+$/.test(tok) ? tok : null);
    if (d === null) continue;
    out += d.length === 1 ? d.repeat(times) : d;
    times = 1;
  }
  return out.length > 10 ? out.slice(-10) : out;
}

let stopActiveMic = null;

// kind: 'name' fills a name, 'phone' turns what is said into a 10 digit number
function attachMic(input, button, statusEl, lang = 'mr-IN', kind = 'name') {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { button.hidden = true; return; }
  let rec = null;
  let listening = false;
  const isPhone = kind === 'phone';
  const isText = kind === 'text';
  const what = isPhone ? 'नंबर' : isText ? 'माहिती' : 'नाव';
  const say = (text, isError = false) => {
    if (!statusEl) return;
    statusEl.textContent = text;
    statusEl.classList.toggle('err', isError);
    statusEl.hidden = !text;
  };
  const clean = (t) => t.replace(/[.,।?!]+$/g, '').replace(/\s+/g, ' ').trim();
  const stop = () => { try { rec && rec.stop(); } catch { /* already stopped */ } };

  button.addEventListener('click', () => {
    if (listening) { stop(); return; }
    if (stopActiveMic) stopActiveMic(); // only one microphone at a time
    rec = new SR();
    rec.lang = lang;
    rec.interimResults = true;
    rec.continuous = false;
    rec.maxAlternatives = 1;
    rec.onstart = () => {
      listening = true;
      stopActiveMic = stop;
      button.classList.add('listening');
      button.setAttribute('aria-pressed', 'true');
      say(isPhone ? 'ऐकत आहे... मोबाईल नंबर एक एक अंक बोला' : isText ? 'ऐकत आहे... बोला' : 'ऐकत आहे... तुमचे नाव सांगा');
    };
    rec.onresult = (e) => {
      let text = '';
      for (let i = 0; i < e.results.length; i++) text += ' ' + e.results[i][0].transcript;
      input.value = isPhone ? spokenToDigits(text) : clean(text);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed' || e.error === 'service-not-allowed') say(`माइकची परवानगी द्या (Chrome मध्ये कुलूप चिन्ह, परवानग्या, माइक) किंवा ${what} टाइप करा.`, true);
      else if (e.error === 'no-speech') say('काही ऐकू आले नाही. पुन्हा माइक दाबा.', true);
      else if (e.error === 'network') say(`बोलणे ओळखण्यासाठी इंटरनेट लागते. ${what} टाइप करा.`, true);
      else if (e.error !== 'aborted') say(`बोलणे ओळखता आले नाही. ${what} टाइप करा.`, true);
    };
    rec.onend = () => {
      listening = false;
      if (stopActiveMic === stop) stopActiveMic = null;
      button.classList.remove('listening');
      button.setAttribute('aria-pressed', 'false');
      if (statusEl && !statusEl.classList.contains('err')) {
        if (input.value) say(`${what} बरोबर नसेल तर दुरुस्त करा किंवा पुन्हा माइक दाबा.`);
        else say('');
      }
    };
    try { rec.start(); } catch { say('माइक सुरू करता आला नाही. टाइप करा.', true); }
  });
}

// fills a <select> with the services; shows the price and keeps whatever was chosen

// The barber edits the list in the app (saved in the database as JSON); CONFIG.SERVICES is the fallback.
function getServices(shop, fallback = []) {
  try {

    if (Array.isArray(list) && list.length) {
      return list
        .map((s) => ({ name: String(s.name || '').trim(), minutes: Number(s.minutes) || 20, price: Number(s.price) || 0 }))

function parseHM(v) {
  const m = /^(\d{1,2}):(\d{2})/.exec(String(v || ''));
  if (!m) return null;
  const h = Number(m[1]);
  const mi = Number(m[2]);
  return h > 23 || mi > 59 ? null : h * 60 + mi;
}

function fmtHM(v) {
  const t = parseHM(v);
  if (t === null) return '';
  const d = new Date();
  d.setHours(Math.floor(t / 60), t % 60, 0, 0);
  return fmtTime(d);
}

// open or closed, and the sentence to show a customer when it is closed
function shopStatus(shop, now = new Date()) {
  const closed = (note) => ({ open: false, label: 'दुकान बंद', note });
  if (!shop || !shop.is_open) return closed('दुकान सध्या बंद आहे. कृपया नंतर प्रयत्न करा किंवा फोन करा.');
  const o = parseHM(shop.open_time);
  const c = parseHM(shop.close_time);
  if (o !== null && c !== null && o !== c) {
    const m = now.getHours() * 60 + now.getMinutes();
    const inside = o < c ? m >= o && m < c : m >= o || m < c;
    if (!inside) return closed(`दुकान सध्या बंद आहे. ${m < o ? '' : 'उद्या '}${fmtHM(shop.open_time)} ला उघडेल.`);
  }
  return { open: true, label: 'दुकान सुरू', note: '' };
}

// Shrinks a phone photo (often 4000px, 5 MB) to about 100 KB so it loads fast and fits in the free database.
async function compressImage(file, maxSide = 1000, quality = 0.72) {
  let bmp;
  try {
    bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
  } catch {
    bmp = await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }
  const w = bmp.width || bmp.naturalWidth;
  const h = bmp.height || bmp.naturalHeight;
  const scale = Math.min(1, maxSide / Math.max(w, h));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(w * scale));
  canvas.height = Math.max(1, Math.round(h * scale));
  canvas.getContext('2d').drawImage(bmp, 0, 0, canvas.width, canvas.height);
  return canvas.toDataURL('image/jpeg', quality);
}

// Pure functions: no DOM, no network. Easy to reason about and test.

const ACTIVE = ['pending', 'accepted', 'in_progress'];

function endMs(row) {
  if (row.status !== 'in_progress' || !row.started_at) return 0;
  return new Date(row.started_at).getTime() + (row.duration_minutes || 0) * 60000;
}

/**
 * Orders the active bookings and works out wait times and who is "next".
 * - The person in the chair is always first.
 * - Everyone else is ordered by queue_position, then booking time.
 * - "Next" is the first accepted customer, once the chair is free or the
 *   current customer has nextAlertMin minutes (or less) left.
 */
function buildQueue(rows, now, avgMin = 20, nextAlertMin = 5, minutesFor = null) {
  const active = rows.filter((r) => ACTIVE.includes(r.status));
  active.sort((a, b) => {
    const ai = a.status === 'in_progress' ? 0 : 1;
    const bi = b.status === 'in_progress' ? 0 : 1;
    if (ai !== bi) return ai - bi;
    if (a.queue_position !== b.queue_position) return a.queue_position - b.queue_position;
    return new Date(a.created_at) - new Date(b.created_at);
  });
  // how long this person will probably take: his service's time, else the shop average
  const minsOf = (r) => (minutesFor && minutesFor(r)) || avgMin;

  const currentRow = active.find((r) => r.status === 'in_progress') || null;
  const leftMs = currentRow ? endMs(currentRow) - now : 0;
  const currentWaitMin = currentRow ? Math.max(0, Math.ceil(leftMs / 60000)) : 0;

  let waitSum = 0; // minutes of everybody who is waiting ahead of the next person in the loop
  const list = active.map((r, i) => {
    const item = { ...r, index: i, ahead: i, waitMin: 0, etaMs: now, isNext: false, leftMs: 0, progress: 0 };
    if (r.status === 'in_progress') {
      item.leftMs = leftMs;
      const total = (r.duration_minutes || 1) * 60000;
      item.progress = Math.min(1, Math.max(0, 1 - leftMs / total));
    } else {
      item.waitMin = currentWaitMin + waitSum;
      item.etaMs = now + item.waitMin * 60000;
      waitSum += minsOf(r);
    }
    return item;
  });

  const nextRow = list.find((r) => r.status === 'accepted');
  if (nextRow && (!currentRow || leftMs <= nextAlertMin * 60000)) nextRow.isNext = true;

  return {
    list,
    current: list.find((r) => r.status === 'in_progress') || null,
    waiting: list.filter((r) => r.status !== 'in_progress'),
    waitForNew: currentWaitMin + waitSum, // minutes a person who books right now would wait
  };
}

const SETUP_SQL = "-- =====================================================================\n--  Barber queue: Supabase tables (simple version)\n--  Run this whole file once in: Supabase dashboard > SQL Editor > New query > Run.\n--  Safe to run again later; it never deletes your bookings.\n--\n--  Note: the tables are open to the public key of the site (no extra security),\n--  which is fine for a small shop but means anyone who inspects the site\n--  could read or change the data.\n-- =====================================================================\n\ncreate table if not exists public.shop_settings (\n  id           int primary key default 1 check (id = 1),\n  shop_name    text    not null default 'महाले',\n  barber_name  text    not null default 'दत्तात्रय महाले',\n  phone        text    not null default '9623112334',\n  address      text    not null default 'फुले कॉलनी समोर',\n  is_open      boolean not null default true,\n  avg_minutes  int     not null default 20\n);\n-- newer settings (safe to run again; an older install simply gets the new columns)\nalter table public.shop_settings add column if not exists services   text;                       -- list of services, minutes and prices (JSON)\nalter table public.shop_settings add column if not exists notice     text    not null default ''; -- line shown at the top for customers\nalter table public.shop_settings add column if not exists upi_id     text    not null default ''; -- for the \"pay with UPI\" button\nalter table public.shop_settings add column if not exists pay_qr     text    not null default ''; -- payment QR picture\nalter table public.shop_settings add column if not exists has_qr     boolean not null default false;\nalter table public.shop_settings add column if not exists open_time  text    not null default ''; -- like 09:00\nalter table public.shop_settings add column if not exists close_time text    not null default ''; -- like 21:00\ninsert into public.shop_settings (id) values (1) on conflict (id) do nothing;\n\ncreate table if not exists public.bookings (\n  id               uuid primary key default gen_random_uuid(),\n  name             text not null,\n  phone            text not null,\n  service          text not null default '',\n  status           text not null default 'pending'\n                   check (status in ('pending','accepted','in_progress','completed','cancelled','rejected')),\n  is_walk_in       boolean not null default false,\n  queue_position   bigint generated by default as identity,\n  duration_minutes int,\n  started_at       timestamptz,\n  notified_next    boolean not null default false,\n  created_at       timestamptz not null default now(),\n  updated_at       timestamptz not null default now()\n);\nalter table public.bookings add column if not exists price int not null default 0;                         -- amount, used for the earnings of the day\nalter table public.bookings add column if not exists barber_notified boolean not null default false;      -- the phone of the barber was alerted\nalter table public.bookings add column if not exists last_ahead int;                                       -- last number of people ahead that was sent to the customer\ncreate index if not exists bookings_status_pos_idx on public.bookings (status, queue_position);\ncreate index if not exists bookings_phone_idx on public.bookings (phone);\n\ncreate table if not exists public.push_subscriptions (\n  id         uuid primary key default gen_random_uuid(),\n  booking_id uuid not null references public.bookings(id) on delete cascade,\n  endpoint   text not null unique,\n  p256dh     text not null,\n  auth       text not null,\n  created_at timestamptz not null default now()\n);\n\n-- the phone of the barber (so it rings when a customer books)\ncreate table if not exists public.barber_push (\n  id         uuid primary key default gen_random_uuid(),\n  endpoint   text not null unique,\n  p256dh     text not null,\n  auth       text not null,\n  created_at timestamptz not null default now()\n);\n\n-- photos for the slider, added by the barber (compressed pictures stored as text)\ncreate table if not exists public.slider_photos (\n  id         uuid primary key default gen_random_uuid(),\n  image      text not null,\n  sort       bigint generated by default as identity,\n  created_at timestamptz not null default now()\n);\n\n-- open access for the public (anon) key\nalter table public.shop_settings      enable row level security;\nalter table public.bookings           enable row level security;\nalter table public.push_subscriptions enable row level security;\nalter table public.slider_photos      enable row level security;\nalter table public.barber_push        enable row level security;\n\ndrop policy if exists \"open shop\"          on public.shop_settings;\ndrop policy if exists \"open bookings\"      on public.bookings;\ndrop policy if exists \"open subscriptions\" on public.push_subscriptions;\ndrop policy if exists \"open photos\"        on public.slider_photos;\ndrop policy if exists \"open barber push\"   on public.barber_push;\ncreate policy \"open shop\"          on public.shop_settings      for all using (true) with check (true);\ncreate policy \"open bookings\"      on public.bookings           for all using (true) with check (true);\ncreate policy \"open subscriptions\" on public.push_subscriptions for all using (true) with check (true);\ncreate policy \"open photos\"        on public.slider_photos      for all using (true) with check (true);\ncreate policy \"open barber push\"   on public.barber_push        for all using (true) with check (true);\n\ngrant select, insert, update, delete on public.shop_settings, public.bookings, public.push_subscriptions, public.slider_photos, public.barber_push to anon, authenticated;\ngrant usage, select on all sequences in schema public to anon, authenticated;\n\n-- make Supabase notice the new columns and tables at once\nnotify pgrst, 'reload schema';\n\n-- const SETUP_FN = "// Supabase Edge Function: sends Web Push notifications to customers.\n//\n// Who may call it\n//   * the barber's page (sends PUSH_KEY from js/config.js, which must equal the BARBER_KEY secret), or\n//   * the every-minute cron job (sends the x-cron-secret header), or\n//   * anybody, but ONLY for the \"new_booking\" event: it alerts the barber's phone once for a real, fresh\n//     booking and does nothing else.\n//\n// Deploy with JWT checks off, because we do our own checks above:\n//   supabase functions deploy push --no-verify-jwt\n//\n// Secrets (supabase secrets set ...):\n//   VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT (mailto:you@example.com), CRON_SECRET, BARBER_KEY, DB_KEY\n// SUPABASE_URL is provided automatically.\n\nimport { createClient } from \"npm:@supabase/supabase-js@2\";\nimport webpush from \"npm:web-push@3.6.7\";\n\n// DB_KEY = your publishable key (the same one as in index.html). The tables are open to it,\n// so no secret database key is needed. Older projects can leave DB_KEY out.\nconst db = createClient(\n  Deno.env.get(\"SUPABASE_URL\")!,\n  Deno.env.get(\"DB_KEY\") ?? Deno.env.get(\"SUPABASE_SERVICE_ROLE_KEY\")!,\n  { auth: { persistSession: false } },\n);\n\nwebpush.setVapidDetails(\n  Deno.env.get(\"VAPID_SUBJECT\") ?? \"mailto:owner@example.com\",\n  Deno.env.get(\"VAPID_PUBLIC_KEY\")!,\n  Deno.env.get(\"VAPID_PRIVATE_KEY\")!,\n);\n\nconst CRON_SECRET = Deno.env.get(\"CRON_SECRET\") ?? \"\";\nconst NEXT_ALERT_MINUTES = Number(Deno.env.get(\"NEXT_ALERT_MINUTES\") ?? \"5\");\n// customers get a \"N people ahead of you\" message each time their place changes, once N is this small\nconst NOTIFY_FROM = Number(Deno.env.get(\"NOTIFY_FROM\") ?? \"5\");\n\nconst cors = {\n  \"Access-Control-Allow-Origin\": \"*\",\n  \"Access-Control-Allow-Headers\": \"authorization, x-client-info, apikey, content-type, x-cron-secret\",\n  \"Access-Control-Allow-Methods\": \"POST, OPTIONS\",\n};\n\nconst reply = (body: unknown, status = 200) =>\n  new Response(JSON.stringify(body), { status, headers: { ...cors, \"Content-Type\": \"application/json\" } });\n\ntype Payload = { title: string; body: string; tag?: string };\n\nconst MESSAGES: Record\u003cstring, Payload> = {\n  accepted: { title: \"नंबर स्वीकारला\", body: \"तुम्ही रांगेत आहात. तुमचा नंबर जवळ आला की कळवू.\", tag: \"queue\" },\n  rejected: { title: \"विनंती नाकारली\", body: \"केशकर्तनकार ही विनंती घेऊ शकले नाहीत. कृपया फोन करा.\", tag: \"queue\" },\n  started: { title: \"तुमची पाळी आली\", body: \"कृपया खुर्चीवर बसा.\", tag: \"queue\" },\n  cancelled: { title: \"नंबर रद्द झाला\", body: \"तुमचा नंबर रद्द करण्यात आला.\", tag: \"queue\" },\n};\n\nasync function isAuthorised(req: Request, body: Record\u003cstring, unknown>): Promise\u003cboolean> {\n  const secret = req.headers.get(\"x-cron-secret\");\n  if (CRON_SECRET && secret === CRON_SECRET) return true;\n  // the barber's page sends PUSH_KEY from js/config.js; it must equal the BARBER_KEY secret\n  const key = Deno.env.get(\"BARBER_KEY\") ?? \"\";\n  return key.length > 0 && body.token === key;\n}\n\n// sends one notification; a phone that has gone away (404 / 410) is removed from its table\nasync function pushOne(\n  sub: { id: string; endpoint: string; p256dh: string; auth: string },\n  payload: Payload & { url?: string },\n  table: string,\n): Promise\u003cboolean> {\n  try {\n    await webpush.sendNotification(\n      { endpoint: sub.endpoint, keys: { p256dh: sub.p256dh, auth: sub.auth } },\n      JSON.stringify({ url: \"./\", ...payload }),\n      { TTL: 600, urgency: \"high\" },\n    );\n    return true;\n  } catch (e) {\n    const code = (e as { statusCode?: number }).statusCode;\n    if (code === 404 || code === 410) {\n      await db.from(table).delete().eq(\"id\", sub.id); // customer revoked or expired\n    } else {\n      console.error(\"push failed\", code, (e as Error).message);\n    }\n    return false;\n  }\n}\n\nasync function sendToBooking(bookingId: string, payload: Payload): Promise\u003cnumber> {\n  const { data: subs } = await db.from(\"push_subscriptions\").select(\"*\").eq(\"booking_id\", bookingId);\n  let sent = 0;\n  for (const s of subs ?? []) if (await pushOne(s, payload, \"push_subscriptions\")) sent++;\n  return sent;\n}\n\nasync function sendToBarber(payload: Payload & { url?: string }): Promise\u003cnumber> {\n  const { data: subs } = await db.from(\"barber_push\").select(\"*\");\n  let sent = 0;\n  for (const s of subs ?? []) if (await pushOne(s, payload, \"barber_push\")) sent++;\n  return sent;\n}\n\n// A customer has just booked: ring the barber's phone, once per booking.\nasync function notifyBarber(bookingId: string | null): Promise\u003c{ event: string; sent: number }> {\n  const none = { event: \"new_booking\", sent: 0 };\n  if (!bookingId) return none;\n  const { data: b } = await db.from(\"bookings\").select(\"*\").eq(\"id\", bookingId).maybeSingle();\n  if (!b || b.is_walk_in || b.barber_notified === true) return none;\n  if (Date.now() - new Date(b.created_at).getTime() > 5 * 60000) return none; // only for a fresh booking\n  const { data: claimed } = await db\n    .from(\"bookings\")\n    .update({ barber_notified: true })\n    .eq(\"id\", bookingId)\n    .eq(\"barber_notified\", false)\n    .select(\"id\");\n  if (!claimed || claimed.length === 0) return none; // already done, or the column does not exist yet\n  const sent = await sendToBarber({\n    title: \"नवीन नंबर लागला\",\n    body: b.service ? `${b.name} (${b.service})` : b.name,\n    tag: \"new-booking\",\n    url: \"./#barber\",\n  });\n  return { event: \"new_booking\", sent };\n}\n\n// Tells the first accepted customer \"you're next\" exactly once:\n//  - when nobody is in the chair, or\n//  - when the current customer has NEXT_ALERT_MINUTES (or less) left.\nasync function runCheck(): Promise\u003c{ notified: string | null }> {\n  const { data: current } = await db.from(\"bookings\").select(\"*\").eq(\"status\", \"in_progress\").maybeSingle();\n\n  let minutesLeft = 0;\n  if (current?.started_at) {\n    const end = new Date(current.started_at).getTime() + (current.duration_minutes ?? 0) * 60000;\n    minutesLeft = Math.ceil((end - Date.now()) / 60000);\n    if (minutesLeft > NEXT_ALERT_MINUTES) return { notified: null };\n  }\n\n  const { data: next } = await db\n    .from(\"bookings\")\n    .select(\"*\")\n    .eq(\"status\", \"accepted\")\n    .order(\"queue_position\", { ascending: true })\n    .limit(1)\n    .maybeSingle();\n\n  if (!next || next.notified_next) return { notified: null };\n\n  // Mark first so a second overlapping run cannot send twice.\n  const { data: claimed } = await db\n    .from(\"bookings\")\n    .update({ notified_next: true })\n    .eq(\"id\", next.id)\n    .eq(\"notified_next\", false)\n    .select(\"id\");\n  if (!claimed || claimed.length === 0) return { notified: null };\n\n  const title = current ? \"तुमचा नंबर येत आहे\" : \"तुमचा नंबर आला\";\n  const body = current\n    ? `सुमारे ${Math.max(minutesLeft, 1)} मिनिटांत तुमची पाळी. कृपया आता दुकानात या.`\n    : \"खुर्ची रिकामी आहे. कृपया आता दुकानात या.\";\n  await sendToBooking(next.id, { title, body, tag: \"queue\" });\n  return { notified: next.id };\n}\n\n// \"5 people ahead of you\", \"4\", \"3\", \"2\", then \"you are next\". Sent when the place changes, never twice for\n// the same number. (bookings.last_ahead remembers the last number that was sent; without that column nothing is sent.)\nasync function announcePositions(): Promise\u003cnumber> {\n  const { data: active } = await db.from(\"bookings\").select(\"*\").in(\"status\", [\"pending\", \"accepted\", \"in_progress\"]);\n  if (!active || active.length \u003c 2) return 0;\n  const queue = [...active].sort((a, b) => {\n    const ai = a.status === \"in_progress\" ? 0 : 1;\n    const bi = b.status === \"in_progress\" ? 0 : 1;\n    if (ai !== bi) return ai - bi;\n    if (a.queue_position !== b.queue_position) return a.queue_position - b.queue_position;\n    return new Date(a.created_at).getTime() - new Date(b.created_at).getTime();\n  });\n  let sent = 0;\n  // queue[0] is the one in the chair (or the first one waiting if the chair is empty: runCheck tells him);\n  // everybody after that has \"ahead\" = his place in the list\n  for (let ahead = 1; ahead \u003c queue.length && ahead \u003c= NOTIFY_FROM; ahead++) {\n    const b = queue[ahead];\n    if (b.status === \"in_progress\" || b.last_ahead === ahead) continue;\n    // claim this number first, so two overlapping runs cannot both send\n    let claim = db.from(\"bookings\").update({ last_ahead: ahead }).eq(\"id\", b.id);\n    claim = b.last_ahead === null || b.last_ahead === undefined ? claim.is(\"last_ahead\", null) : claim.eq(\"last_ahead\", b.last_ahead);\n    const { data: claimed, error } = await claim.select(\"id\");\n    if (error || !claimed || claimed.length === 0) continue;\n    const msg = ahead === 1\n      ? { title: \"तुम्ही पुढचे आहात\", body: \"तुमचा नंबर पुढचा आहे. कृपया आता दुकानात या.\" }\n      : { title: `तुमच्या पुढे ${ahead} जण`, body: \"तुमचा नंबर जवळ येत आहे. तयार रहा.\" };\n    sent += await sendToBooking(b.id, { ...msg, tag: \"queue\" });\n  }\n  return sent;\n}\n\nDeno.serve(async (req) => {\n  if (req.method === \"OPTIONS\") return new Response(\"ok\", { headers: cors });\n  if (req.method !== \"POST\") return reply({ error: \"POST only\" }, 405);\n\n  let body: Record\u003cstring, unknown> = {};\n  try {\n    body = await req.json();\n  } catch {\n    return reply({ error: \"Invalid JSON\" }, 400);\n  }\n\n  const event = String(body.event ?? \"\");\n  const bookingId = typeof body.booking_id === \"string\" ? body.booking_id : null;\n\n  if (event === \"new_booking\") return reply(await notifyBarber(bookingId)); // open to the public, see above\n\n  if (!(await isAuthorised(req, body))) return reply({ error: \"unauthorized\" }, 401);\n\n  const result: Record\u003cstring, unknown> = { event };\n\n  // \"test\": the barber presses a button in the app to check that phone alerts really work\n  if (event === \"test\") {\n    result.sent = await sendToBarber({\n      title: \"टेस्ट सूचना\",\n      body: \"ही सूचना दिसली म्हणजे तुमच्या फोनवर सूचना चालू आहेत.\",\n      tag: \"test\",\n      url: \"./#barber\",\n    });\n    return reply(result);\n  }\n\n  if (event in MESSAGES && bookingId) {\n    result.sent = await sendToBooking(bookingId, MESSAGES[event]);\n  }\n  // After anything that changes who is in the chair, or on the timer, see if someone is now \"next\".\n  if ([\"started\", \"cancelled\", \"check\", \"tick\"].includes(event)) {\n    Object.assign(result, await runCheck());\n    result.announced = await announcePositions();\n  }\n\n  return reply(result);\n});\n";

// Returns the QR code of "text" as an SVG picture (a white square with dark dots and a quiet border).
function qrSvg(text, { level = 'M', margin = 4, dark = '#0f1b30', light = '#ffffff' } = {}) {
  const qr = new QRLib.QRCode(-1, QRLib.level[level]);
  qr.addData(String(text));
  qr.make();
  const n = qr.getModuleCount();
  const size = n + margin * 2;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + margin} ${r + margin}h1v1h-1z`;
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size} ${size}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${size}" height="${size}" fill="${light}"/><path d="${d}" fill="${dark}"/></svg>`;
}

  async update(token, id, action, minutes) {
    requireBarber(token);
    const db = load();
    const b = db.bookings.find((x) => x.id === id);
    if (!b) throw fail('नोंद सापडली नाही');
    const touch = () => { b.updated_at = new Date().toISOString(); };

    switch (action) {
      case 'accept':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या स्वीकारता येतात');
        b.status = 'accepted'; touch(); break;
      case 'reject':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या नाकारता येतात');
        b.status = 'rejected'; touch(); break;
      case 'start':
        if (!['pending', 'accepted'].includes(b.status)) throw fail('या ग्राहकाची सेवा सुरू करता येत नाही');
        if (![10, 20, 30, 40, 50, 60].includes(minutes)) throw fail('10 ते 60 मिनिटे निवडा');
        if (db.bookings.some((x) => x.status === 'in_progress')) throw fail('आधी सध्याच्या ग्राहकाचे काम पूर्ण करा');
        b.status = 'in_progress'; b.started_at = new Date().toISOString(); b.duration_minutes = minutes; b.notified_next = false; touch(); break;
      case 'complete':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        b.status = 'completed'; touch(); break;
      case 'extend':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        if (!(minutes >= 5 && minutes <= 60)) throw fail('5 ते 60 मिनिटे निवडा');
        b.duration_minutes += minutes; touch(); break;
      case 'cancel':
        if (!ACTIVE.includes(b.status)) throw fail('ही नोंद आधीच बंद झाली आहे');
        b.status = 'cancelled'; touch(); break;
      case 'move_up':
      case 'move_down': {
        const waiting = db.bookings.filter((x) => ['pending', 'accepted'].includes(x.status)).sort((p, q) => p.queue_position - q.queue_position);
        const i = waiting.findIndex((x) => x.id === id);
        const other = waiting[action === 'move_up' ? i - 1 : i + 1];
        if (other) {
          [b.queue_position, other.queue_position] = [other.queue_position, b.queue_position];
          b.notified_next = false; other.notified_next = false;
        }
        break;
      }
      case 'move_end': {
        if (!['pending', 'accepted'].includes(b.status)) throw fail('हा ग्राहक रांगेत नाही');
        const last = db.bookings.filter((x) => ACTIVE.includes(x.status)).reduce((m, x) => Math.max(m, x.queue_position), 0);
        if (b.queue_position < last) { b.queue_position = last + 1; b.notified_next = false; touch(); }
        break;
      }
      default:
        throw fail('अज्ञात कृती');
    }
    save(db);
  },
