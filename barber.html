  } else if (me.status === 'completed') {
    cls = 'is-done';
    head = `<div class="t-num">पूर्ण</div><div><h2>धन्यवाद, ${first}</h2><p>केस कापणी आवडली असेल. पुन्हा भेटू.</p></div>`;
  } else if (me.status === 'rejected') {
    head = `<div class="t-num">नाही</div><div><h2>विनंती नाकारली</h2><p>केशकर्तनकार ही विनंती घेऊ शकले नाहीत. पुन्हा प्रयत्न करा किंवा फोन करा.</p></div>`;
  } else {
    head = `<div class="t-num">रद्द</div><div><h2>नंबर रद्द झाला</h2><p>हा नंबर रद्द करण्यात आला आहे. तुम्ही पुन्हा नंबर लावू शकता.</p></div>`;
  }

  const active = row && ['pending', 'accepted', 'in_progress'].includes(row.status);
  const svc = active && mine && mine.service ? `<p class="note svc">तुमची सेवा: <b>${esc(mine.service)}</b></p>` : '';
  if (active) {
    if (permission === 'default') {
      body = `${svc}<div class="t-actions"><button class="btn btn-dark btn-block" data-act="notify" type="button">माझी पाळी आली की सूचना द्या</button><p class="note">Chrome विचारेल तेव्हा "परवानगी द्या" दाबा. ${MODE === 'demo' ? 'डेमो मोडमध्ये पान उघडे असतानाच सूचना येतात.' : 'पान बंद असले तरी सूचना येतात.'}</p></div>`;
    } else if (permission === 'denied') {
      body = `${svc}<p class="note">या साइटसाठी सूचना बंद आहेत. Chrome मध्ये कुलूप चिन्ह, परवानग्या, सूचना येथे चालू करा.</p>`;
    } else if (permission === 'granted') {
      body = `${svc}<p class="note">सूचना चालू आहेत. तुमचा नंबर जवळ आला की कळवू.</p>`;
    }
  } else {
    body = `<div class="t-actions"><button class="btn btn-primary btn-block" data-act="again" type="button">पुन्हा नंबर लावा</button></div>`;
  }
  return { cls, html: `<div class="ticket-head">${head}</div>${body}` };
}

function renderTicket(me) {
  const wrap = $('ticketWrap');
  if (!me) { wrap.hidden = true; wrap.innerHTML = ''; return; }
  const { cls, html } = ticketHTML(me);
  wrap.className = `card ticket ${cls}`;
  wrap.innerHTML = html;
  wrap.hidden = false;
}

function endText(c) {
  return c.leftMs < 0 ? 'वेळ संपला' : `संपेल ${fmtTime(endMs(c))}`;
}

function updateClock() {
  $('clockText').textContent = fmtTime(Date.now());
}

function renderLive() {
  const avg = shop.avg_minutes || CONFIG.AVG_SERVICE_MINUTES;
  const c = q.current;
  const cur = c ? Math.max(0, Math.ceil(c.leftMs / 60000)) : 0;
  $('liveCount').textContent = q.list.length;
  $('liveWait').innerHTML = `${cur + q.waiting.length * avg}<small>मि.</small>`;
  $('liveChair').textContent = c ? c.name : 'रिकामी';
  $('liveTime').textContent = c ? fmtClock(c.leftMs) : '';
  $('liveTime').classList.toggle('over', !!c && c.leftMs < 0);
  $('liveEnd').textContent = c ? endText(c) : '';
  $('liveBarWrap').hidden = !c;
  if (c) $('liveBar').style.width = `${Math.max(4, c.progress * 100)}%`;
}

function renderBookForm(me) {
  const active = me && ['pending', 'accepted', 'in_progress'].includes(me.status);
  $('bookWrap').hidden = !!me; // hidden while a ticket (active or finished) is showing
  void active;
}

function queueHTML() {
  if (!q.waiting.length) return '<li class="empty">कोणीही थांबलेले नाही. आता नंबर लावा, तुम्ही पहिले असाल.</li>';
  const isMineRow = (r) => mine && r.id === mine.id;
  const shown = q.waiting.filter((r, i) => showAll || i < VISIBLE || isMineRow(r));
  const hidden = q.waiting.length - shown.length;
  const items = shown
    .map((r) => {
      const isMine = isMineRow(r);
      return `<li class="q-item${isMine ? ' mine' : ''}">
        <div class="q-num">${r.index + 1}</div>
        <div>
          <div class="q-name">${esc(r.name)}${isMine ? '<span class="you">तुम्ही</span>' : ''}${r.is_walk_in ? '<span class="walkin">प्रत्यक्ष</span>' : ''}</div>
          <div class="q-phone">${esc(r.phone_masked || maskPhone(r.phone))}</div>
        </div>
        <div class="q-side"><span class="badge" data-s="${r.status}">${statusLabel(r.status)}</span><span class="q-wait">${waitText(r.waitMin)}</span></div>
      </li>`;
    })
    .join('');
  const more = hidden > 0 ? `<li><button class="btn btn-ghost btn-sm btn-block" data-more="1" type="button">आणखी ${hidden} जण पाहा</button></li>`
    : showAll && q.waiting.length > VISIBLE ? '<li><button class="btn btn-ghost btn-sm btn-block" data-more="0" type="button">कमी दाखवा</button></li>' : '';
  return items + more;
}

function render() {
  recompute();
  const me = findMe();
  if (mine && !me) writeMine(null); // booking too old to be listed any more
  renderHeader();
  renderTicket(me);
  renderBookForm(me);
  renderLive();
  $('queueList').innerHTML = queueHTML();
  const n = q.list.length;
  $('queueCount').textContent = n ? `${n} जण रांगेत` : '';
  signature = makeSignature(me);
  checkAlerts(me);
}

function makeSignature(me) {
  return q.list.map((r) => `${r.id}:${r.status}:${r.isNext ? 1 : 0}:${r.waitMin}`).join('|') + `#${me ? me.status : ''}#${shop.is_open}#${shop.shop_name}#${q.current ? Math.ceil(q.current.leftMs / 60000) : 0}#${showAll}`;
}

// Runs every second: cheap updates only, full render when something changed.
function tick() {
  updateClock();
  recompute();
  const me = findMe();
  if (makeSignature(me) !== signature) { render(); return; }
  const c = q.current;
  if (c) {
    const t = $('liveTime');
    t.textContent = fmtClock(c.leftMs);
    t.classList.toggle('over', c.leftMs < 0);
    $('liveBar').style.width = `${Math.max(4, c.progress * 100)}%`;
    $('liveEnd').textContent = endText(c);
  }
}

/* ------------------------------------------------------------------ alerts */
function checkAlerts(me) {
  if (!me) { prevKey = null; return; }
  const row = q.list.find((r) => r.id === me.id);
  const key = `${me.status}${row && row.isNext ? ':next' : ''}`;
  if (prevKey === null) { prevKey = key; return; }
  if (key === prevKey) return;
  const before = prevKey;
  prevKey = key;

  const statusBefore = before.split(':')[0];
  let title = null;
  let text = '';
  if (me.status !== statusBefore) {
    if (me.status === 'accepted') { title = 'नंबर स्वीकारला'; text = row && row.isNext ? 'तुम्ही पुढचे आहात. कृपया आता दुकानात या.' : 'तुम्ही रांगेत आहात. तुमचा नंबर जवळ आला की कळवू.'; }
    else if (me.status === 'in_progress') { title = 'तुमची पाळी आली'; text = 'कृपया खुर्चीवर बसा.'; }
    else if (me.status === 'rejected') { title = 'विनंती नाकारली'; text = 'केशकर्तनकार ही विनंती घेऊ शकले नाहीत.'; }
    else if (me.status === 'cancelled') { title = 'नंबर रद्द झाला'; text = 'तुमचा नंबर रद्द करण्यात आला.'; }
  } else if (key.endsWith(':next')) {
    title = 'तुम्ही पुढचे आहात'; text = 'कृपया आता दुकानात या.';
  }
  if (!title) return;

  toast(text, { title, type: 'alert', ms: 9000 });
  beep(3);
  vibrate([300, 120, 300, 120, 300]);
  // In demo mode there is no server push, so show a local notification if the tab is in the background.
  if (MODE === 'demo' && document.hidden && 'Notification' in window && Notification.permission === 'granted' && swReg) {
    swReg.showNotification(title, { body: text, icon: 'icons/icon-192.png', vibrate: [300, 120, 300], tag: 'queue' });
  }
}

/* ------------------------------------------------------------------ push */
async function enablePush() {
  if (!('Notification' in window)) { toast('या ब्राउझरमध्ये सूचना चालत नाहीत.', { type: 'error' }); return; }
  const result = await Notification.requestPermission();
  if (result === 'granted') await subscribePush();
  render();
  if (result === 'granted') toast('सूचना चालू झाल्या. तुमचा नंबर जवळ आला की कळवू.', { type: 'ok' });
}

async function subscribePush() {
  if (MODE !== 'supabase' || !CONFIG.VAPID_PUBLIC_KEY || !mine) return;
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY) }));
    const j = sub.toJSON();
    await backend.savePush(mine.id, mine.token, j.endpoint, j.keys.p256dh, j.keys.auth);
  } catch (err) {
    console.error('Push subscribe failed', err);
  }
}

/* ------------------------------------------------------------------ events */
$('queueList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-more]');
  if (b) { showAll = b.dataset.more === '1'; render(); }
});

$('ticketWrap').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  if (b.dataset.act === 'notify') enablePush();
  if (b.dataset.act === 'again') { writeMine(null); prevKey = null; render(); }
});

$('bookForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('formError');
  err.hidden = true;
  const name = $('name').value.trim();
  const phone = normalizePhone($('phone').value);
  const service = $('service').value;
  if (name.length < 2) { err.textContent = 'कृपया तुमचे नाव टाका.'; err.hidden = false; $('name').focus(); return; }
  if (!validPhone(phone)) { err.textContent = 'वैध 10 अंकी मोबाईल नंबर टाका.'; err.hidden = false; $('phone').focus(); return; }

  if (!service) { err.textContent = 'कृपया सेवा निवडा.'; err.hidden = false; $('service').focus(); return; }
  if (!shop.is_open) {
    err.textContent = 'दुकान सध्या बंद आहे. कृपया नंतर प्रयत्न करा किंवा फोन करा.';
    err.hidden = false;
    return;
  }

  const btn = $('bookBtn');
  btn.disabled = true;
  btn.textContent = 'नंबर लावत आहे...';
  try {
    const res = await backend.book({ name, phone, service });
    writeMine({ id: res.id, token: res.token, name, service });
    prevKey = null;
    $('bookForm').reset();
    toast(CONFIG.AUTO_ACCEPT ? 'तुमचा नंबर लागला! तुम्ही रांगेत आहात.' : 'विनंती पाठवली. केशकर्तनकार लवकरच स्वीकारतील.', { type: 'ok' });
    await refresh();
    if (window.Notification?.permission === 'granted') subscribePush();
  } catch (error) {
    err.textContent = error.message;
    err.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = 'माझा नंबर लावा';
  }
});

/* ------------------------------------------------------------------ start */
async function init() {
  if (MODE === 'demo') $('demoBanner').hidden = false;
  $('ver').textContent = `आवृत्ती ${CONFIG.VERSION}`;
  console.info('सलून रांग, आवृत्ती', CONFIG.VERSION);
  updateClock();
  setupSlider();
  loadSlides();
  fillServices($('service'), CONFIG.SERVICES);
  attachMic($('name'), $('micBtn'), $('micStatus'), CONFIG.SPEECH_LANG, 'name');
  attachMic($('phone'), $('micPhoneBtn'), $('micPhoneStatus'), CONFIG.SPEECH_LANG, 'phone');
  swReg = await registerSW();
  navigator.serviceWorker?.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'push') { refresh(); beep(3); vibrate([300, 120, 300]); toast(e.data.body, { title: e.data.title, type: 'alert', ms: 9000 }); }
  });
  await refresh();
  backend.subscribe(refresh);
  let pollN = 0;
  setInterval(() => {
    if (document.hidden) return;
    pollN += 1;
    if (pollN % (backend.isLive && backend.isLive() ? 5 : 1) === 0) refresh();
  }, CONFIG.POLL_SECONDS * 1000);
  setInterval(tick, 1000);
  setInterval(loadSlides, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); loadSlides(); } });
  if (window.Notification?.permission === 'granted') subscribePush();
}

init();

}

function runBarber() {

const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'bq_barber_token';

let token = localStorage.getItem(TOKEN_KEY);
let shop = { ...CONFIG.SHOP };
let bookings = [];
let doneToday = 0;
let q = buildQueue([], Date.now());
let seen = null; // ids we've already told the barber about
const snooze = new Map(); // "later" button: key -> time until which the popup stays quiet
let timeCtx = null;
let alarmTimer = null;
let signature = '';
let lastErrorToast = 0;
let pollTimer = null;
let tickTimer = null;
let unsubscribe = null;
let pendingStartId = null;

/* ------------------------------------------------------------------ views */
function showLogin(message) {
  $('dashView').hidden = true;
  $('loginView').hidden = false;
  $('demoHint').hidden = MODE !== 'demo';
  if (message) { $('loginError').textContent = message; $('loginError').hidden = false; }
  clearInterval(pollTimer); clearInterval(tickTimer);
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
}

async function showDash() {
  $('loginView').hidden = true;
  $('dashView').hidden = false;
  $('demoBanner').hidden = MODE !== 'demo';
  $('resetBtn').hidden = MODE !== 'demo';
  seen = null;
  await refresh();
  if (!token) return; // refresh() logged us out (expired session)
  unsubscribe = backend.subscribe(refresh);
  let pollN = 0;
  pollTimer = setInterval(() => {
    if (document.hidden) return;
    pollN += 1;
    if (pollN % (backend.isLive && backend.isLive() ? 5 : 1) === 0) refresh();
  }, CONFIG.POLL_SECONDS * 1000);
  tickTimer = setInterval(tick, 1000);
}

function logout(message) {
  token = null;
  localStorage.removeItem(TOKEN_KEY);
  showLogin(message);
}

/* ------------------------------------------------------------------ data */
async function refresh() {
  try {
    const [s, data] = await Promise.all([backend.getShop(), backend.list(token)]);
    shop = s;
    bookings = data.bookings;
    doneToday = data.completed_today;
    render();
    detectNew();
  } catch (err) {
    if (err.unauthorized) { logout('तुमचे सेशन संपले. पुन्हा साइन इन करा.'); return; }
    console.error(err);
    if (Date.now() - lastErrorToast > 30000) {
      lastErrorToast = Date.now();
      toast(`सर्व्हरशी संपर्क होत नाही (कारण: ${err.detail || err.message})`, { type: 'error', ms: 8000 });
    }
  }
}

async function act(id, action, minutes) {
  try {
    await backend.update(token, id, action, minutes);
    await refresh();
    return true;
  } catch (err) {
    if (err.unauthorized) { logout('तुमचे सेशन संपले. पुन्हा साइन इन करा.'); return false; }
    toast(err.message, { type: 'error' });
    return false;
  }
}

/* ------------------------------------------------------------------ render */
function recompute() {
  q = buildQueue(bookings, Date.now(), shop.avg_minutes || CONFIG.AVG_SERVICE_MINUTES, CONFIG.NEXT_ALERT_MINUTES);
}

const svcChip = (r) => (r.service ? `<span class="svc-chip">${esc(r.service)}</span>` : '');

function chairHTML() {
  const c = q.current;
  if (!c) return '<p class="empty">खुर्ची रिकामी आहे. स्वीकारलेल्या ग्राहकासमोर "सुरू करा" दाबा.</p>';
  return `
    <div class="chair-person">
      <div>
        <div class="chair-name">${esc(c.name)}</div>
        ${svcChip(c) ? `<div>${svcChip(c)}</div>` : ''}
        <a class="b-phone" href="tel:${esc(c.phone)}">${esc(c.phone)}</a>
      </div>
      <div id="chairTime" class="chair-time" aria-label="उरलेला वेळ">${fmtClock(c.leftMs)}</div>
    </div>
    <div class="pole-bar"><div id="chairFill" class="pole-fill" style="width:${Math.max(4, c.progress * 100)}%"></div></div>
    <p class="chair-meta">ठरलेला वेळ ${c.duration_minutes} मिनिटे. संपेल: ${fmtTime(endMs(c))}</p>
    <div class="b-actions" style="margin-top:12px">
      <button class="btn btn-primary" data-act="complete" data-id="${c.id}" type="button">पूर्ण करा</button>
      <button class="btn btn-ghost" data-act="extend" data-id="${c.id}" data-min="10" type="button">10 मिनिटे वाढवा</button>
      <button class="btn btn-danger" data-act="cancel" data-id="${c.id}" type="button">रद्द करा</button>
    </div>`;
}

function itemHTML(r, i, total) {
  const num = r.index + 1;
  let actions = '';
  if (r.status === 'pending') {
    actions = `<button class="btn btn-primary" data-act="accept" data-id="${r.id}" type="button">स्वीकारा</button>
               <button class="btn btn-danger" data-act="reject" data-id="${r.id}" type="button">नाकारा</button>`;
  } else {
    actions = `<button class="btn btn-blue" data-act="start" data-id="${r.id}" data-name="${esc(r.name)}" data-service="${esc(r.service || '')}" type="button">सुरू करा</button>
               <button class="btn btn-danger" data-act="cancel" data-id="${r.id}" type="button">काढा</button>`;
  }
  const up = `<button class="btn btn-ghost btn-icon" data-act="move_up" data-id="${r.id}" aria-label="${esc(r.name)} यांना वर हलवा" ${i === 0 ? 'disabled' : ''} type="button">&uarr;</button>`;
  const down = `<button class="btn btn-ghost btn-icon" data-act="move_down" data-id="${r.id}" aria-label="${esc(r.name)} यांना खाली हलवा" ${i === total - 1 ? 'disabled' : ''} type="button">&darr;</button>`;
  return `<li class="b-item">
    <div class="b-top">
      <div class="q-num">${num}</div>
      <div>
        <div class="b-name">${esc(r.name)}${r.is_walk_in ? '<span class="walkin">प्रत्यक्ष</span>' : ''}</div>
        ${svcChip(r) ? `<div>${svcChip(r)}</div>` : ''}
        <a class="b-phone" href="tel:${esc(r.phone)}">${esc(r.phone)}</a>
        <div class="b-time">नोंद: ${fmtTime(r.created_at)}, प्रतीक्षा: ${waitText(r.waitMin)}</div>
      </div>
      <span class="badge" data-s="${r.status}">${r.isNext ? 'पुढचा' : statusLabel(r.status)}</span>
    </div>
    <div class="b-actions row">${actions}${up}${down}</div>
  </li>`;
}

function render() {
  recompute();
  $('shopName').textContent = shop.shop_name;
  const sw = $('openSwitch');
  sw.setAttribute('aria-checked', String(!!shop.is_open));
  $('openLabel').textContent = shop.is_open ? 'दुकान सुरू' : 'दुकान बंद';
  $('sWaiting').textContent = q.waiting.length;
  $('sChair').textContent = q.current ? 1 : 0;
  $('sDone').textContent = doneToday;
  $('chairBody').innerHTML = chairHTML();
  $('waitCount').textContent = q.waiting.length ? `${q.waiting.length} प्रतीक्षेत` : '';
  $('waitList').innerHTML = q.waiting.length
    ? q.waiting.map((r, i) => itemHTML(r, i, q.waiting.length)).join('')
    : '<li class="empty">कोणीही प्रतीक्षेत नाही. नवीन नंबर इथे लगेच दिसतील.</li>';
  signature = makeSignature();
}

function makeSignature() {
  return q.list.map((r) => `${r.id}:${r.status}:${r.isNext ? 1 : 0}:${r.waitMin}:${r.queue_position}:${r.duration_minutes}`).join('|') + `#${shop.is_open}`;
}

function tick() {
  recompute();
  if (makeSignature() !== signature) { render(); return; }
  const c = q.current;
  if (!c) return;
  const t = $('chairTime');
  const f = $('chairFill');
  if (t) { t.textContent = fmtClock(c.leftMs); t.classList.toggle('over', c.leftMs < 0); }
  if (f) f.style.width = `${Math.max(4, c.progress * 100)}%`;
  maybeTimePopup(c);
}

/* ---------- timer reached zero: ask what to do next ---------- */
function maybeTimePopup(c) {
  if (c.leftMs > 0 || timeCtx) return;
  const key = `${c.id}:${c.duration_minutes}`;
  if ((snooze.get(key) || 0) > Date.now()) return;
  if (document.querySelector('dialog[open]')) return; // wait until the barber closes the other window
  const nx = q.waiting.find((r) => r.status === 'accepted') || null;
  timeCtx = { id: c.id, key, next: nx, handled: false };
  $('timeWho').textContent = `${c.name}${c.service ? ` (${c.service})` : ''} यांचा ठरलेला ${c.duration_minutes} मिनिटांचा वेळ संपला.`;
  $('nextBtn').textContent = nx ? `पूर्ण करा आणि पुढचा सुरू करा: ${nx.name}` : 'काम पूर्ण झाले';
  $('timeDialog').showModal();
  beep(3); vibrate([500, 200, 500, 200, 500]);
  alarmTimer = setInterval(() => { beep(2); vibrate([300, 150, 300]); }, 15000); // keeps ringing until he answers
}

$('extGrid').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-m]');
  if (!b || !timeCtx) return;
  const ctx = timeCtx;
  ctx.handled = true;
  $('timeDialog').close();
  if (await act(ctx.id, 'extend', Number(b.dataset.m))) toast(`${b.dataset.m} मिनिटे वेळ वाढवला`, { type: 'ok' });
});
$('nextBtn').addEventListener('click', async () => {
  if (!timeCtx) return;
  const ctx = timeCtx;
  ctx.handled = true;
  $('timeDialog').close();
  if ((await act(ctx.id, 'complete')) && ctx.next) openDuration(ctx.next.id, ctx.next.name, ctx.next.service);
});
$('timeLater').addEventListener('click', () => $('timeDialog').close());
$('timeDialog').addEventListener('close', () => {
  clearInterval(alarmTimer);
  alarmTimer = null;
  if (timeCtx && !timeCtx.handled) snooze.set(timeCtx.key, Date.now() + 120000);
  timeCtx = null;
});

function detectNew() {
  const ids = new Set(bookings.map((b) => b.id));
  if (seen === null) { seen = ids; return; }
  const fresh = bookings.filter((b) => !b.is_walk_in && !seen.has(b.id)); // walk-ins are added by the barber himself
  seen = ids;
  if (fresh.length) {
    const text = fresh.map((b) => (b.service ? `${b.name} (${b.service})` : b.name)).join(', ');
    toast(text, { type: 'alert', title: fresh.length === 1 ? 'नवीन नंबर लागला' : `${fresh.length} नवीन नंबर लागले`, ms: 7000 });
    beep(2); vibrate([250, 100, 250]);
  }
}

/* ------------------------------------------------------------------ events */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('loginError');
  err.hidden = true;
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = 'साइन इन होत आहे...';
  try {
    token = await backend.login($('user').value.trim(), $('pass').value);
    localStorage.setItem(TOKEN_KEY, token);
    $('pass').value = '';
    await showDash();
  } catch (error) {
    err.textContent = error.message || 'साइन इन करता आले नाही';
    err.hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = 'साइन इन';
  }
});

$('logoutBtn').addEventListener('click', () => logout());
$('resetBtn').addEventListener('click', () => { if (confirm('डेमो माहिती पुसायची?')) { backend.resetDemo(); refresh(); } });

$('openSwitch').addEventListener('click', async () => {
  try {
    await backend.setOpen(token, !shop.is_open);
    await refresh();
  } catch (err) { toast(err.message, { type: 'error' }); }
});

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const { act: action, id } = b.dataset;
  if (action === 'start') { openDuration(id, b.dataset.name, b.dataset.service); return; }
  if (action === 'cancel' && !confirm('या ग्राहकाला रांगेतून काढायचे?')) return;
  act(id, action, b.dataset.min ? Number(b.dataset.min) : null);
});

/* duration dialog */
function openDuration(id, name, service = '') {
  pendingStartId = id;
  const hit = CONFIG.SERVICES.find((s) => s.name === service);
  const suggested = hit ? Math.min(60, Math.max(10, Math.ceil(hit.minutes / 10) * 10)) : 0;
  $('durWho').textContent = `${name}${service ? ` (${service})` : ''} यांना किती वेळ लागेल? शेवटच्या ${CONFIG.NEXT_ALERT_MINUTES} मिनिटांआधी पुढच्या ग्राहकाला सूचना जाईल.`;
  $('durGrid').innerHTML = [10, 20, 30, 40, 50, 60]
    .map((m) => `<button type="button" data-m="${m}"${m === suggested ? ' class="suggest"' : ''}>${m}<small>${m === suggested ? 'सुचवलेले' : 'मिनिटे'}</small></button>`)
    .join('');
  $('durDialog').showModal();
}
$('durGrid').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-m]');
  if (!b) return;
  $('durDialog').close();
  act(pendingStartId, 'start', Number(b.dataset.m));
});
$('durCancel').addEventListener('click', () => $('durDialog').close());

/* slider photos dialog */
async function loadPhotos() {
  try {
    const list = await backend.getSlides();
    $('photoGrid').innerHTML = list.length
      ? list.map((p) => `<div class="ph"><img src="${esc(p.src)}" alt="फोटो"><button type="button" data-del="${p.id}" aria-label="हा फोटो काढा">&times;</button></div>`).join('')
      : '<p class="photo-empty">अजून फोटो नाहीत. खाली "फोटो जोडा" दाबा.</p>';
    $('photoAddLabel').hidden = list.length >= CONFIG.MAX_PHOTOS;
    return list.length;
  } catch (err) {
    $('photoGrid').innerHTML = `<p class="photo-empty">फोटो मिळाले नाहीत (कारण: ${esc(err.detail || err.message)})</p>`;
    return 0;
  }
}
const photoSay = (t, isErr = false) => { $('photoMsg').textContent = t; $('photoMsg').classList.toggle('err', isErr); $('photoMsg').hidden = !t; };

$('photoBtn').addEventListener('click', () => { photoSay(''); $('photoDialog').showModal(); loadPhotos(); });
$('photoClose').addEventListener('click', () => $('photoDialog').close());
$('photoGrid').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-del]');
  if (!b || !confirm('हा फोटो काढायचा?')) return;
  try { await backend.deleteSlide(token, b.dataset.del); photoSay('फोटो काढला.'); await loadPhotos(); } catch (err) { photoSay(err.message, true); }
});
$('photoInput').addEventListener('change', async (e) => {
  const files = [...e.target.files];
  e.target.value = '';
  let added = 0;
  for (const [i, f] of files.entries()) {
    photoSay(`फोटो जोडत आहे... ${i + 1}/${files.length}`);
    try {
      await backend.addSlide(token, await compressImage(f));
      added++;
    } catch (err) {
      photoSay(err.unauthorized ? 'पुन्हा साइन इन करा' : err.message || 'हा फोटो जोडता आला नाही', true);
      break;
    }
  }
  const total = await loadPhotos();
  if (added) photoSay(`${added} फोटो जोडले. ग्राहकांच्या पानावर 30 सेकंदात दिसतील. एकूण: ${total}`);
});

/* shop details dialog */
$('shopBtn').addEventListener('click', () => {
  $('shopError').hidden = true;
  ['sNameSt', 'sBarberSt', 'sPhoneSt', 'sAddressSt'].forEach((id) => { $(id).hidden = true; });
  $('sName').value = shop.shop_name || '';
  $('sBarber').value = shop.barber_name || '';
  $('sPhone').value = shop.phone || '';
  $('sAddress').value = shop.address || '';
  $('shopDialog').showModal();
});
$('shopCancel').addEventListener('click', () => $('shopDialog').close());
$('shopForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('shopError');
  err.hidden = true;
  const info = {
    shop_name: $('sName').value.trim(),
    barber_name: $('sBarber').value.trim(),
    phone: normalizePhone($('sPhone').value),
    address: $('sAddress').value.trim(),
  };
  if (info.shop_name.length < 2) { err.textContent = 'कृपया दुकानाचे नाव टाका.'; err.hidden = false; return; }
  if (info.barber_name.length < 2) { err.textContent = 'कृपया केशकर्तनकाराचे नाव टाका.'; err.hidden = false; return; }
  if (!validPhone(info.phone)) { err.textContent = 'वैध 10 अंकी फोन नंबर टाका.'; err.hidden = false; return; }
  try {
    await backend.saveShop(token, info);
    $('shopDialog').close();
    toast('माहिती जतन केली. ग्राहकांच्या पानावर लगेच दिसेल.', { type: 'ok' });
    await refresh();
  } catch (error) {
    if (error.unauthorized) { $('shopDialog').close(); logout('तुमचे सेशन संपले. पुन्हा साइन इन करा.'); return; }
    err.textContent = error.message; err.hidden = false;
  }
});

/* walk-in dialog */
$('walkinBtn').addEventListener('click', () => { $('walkError').hidden = true; $('wMicStatus').hidden = true; $('wPhoneMicStatus').hidden = true; $('walkForm').reset(); $('walkDialog').showModal(); $('wName').focus(); });
$('walkCancel').addEventListener('click', () => $('walkDialog').close());
$('walkForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('walkError');
  err.hidden = true;
  const name = $('wName').value.trim();
  const phone = normalizePhone($('wPhone').value);
  const service = $('wService').value;
  if (name.length < 2) { err.textContent = 'कृपया नाव टाका.'; err.hidden = false; return; }
  if (!validPhone(phone)) { err.textContent = 'वैध 10 अंकी मोबाईल नंबर टाका.'; err.hidden = false; return; }
  if (!service) { err.textContent = 'कृपया सेवा निवडा.'; err.hidden = false; return; }
  try {
    await backend.addWalkin(token, { name, phone, service });
    $('walkDialog').close();
    toast(`${name} रांगेत जोडले`, { type: 'ok' });
    await refresh();
  } catch (error) {
    if (error.unauthorized) { $('walkDialog').close(); logout('तुमचे सेशन संपले. पुन्हा साइन इन करा.'); return; }
    err.textContent = error.message; err.hidden = false;
  }
});

/* ------------------------------------------------------------------ start */
(async function init() {
  $('ver').textContent = `आवृत्ती ${CONFIG.VERSION}`;
  attachMic($('sName'), $('sNameMic'), $('sNameSt'), CONFIG.SPEECH_LANG, 'text');
  attachMic($('sBarber'), $('sBarberMic'), $('sBarberSt'), CONFIG.SPEECH_LANG, 'name');
  attachMic($('sPhone'), $('sPhoneMic'), $('sPhoneSt'), CONFIG.SPEECH_LANG, 'phone');
  attachMic($('sAddress'), $('sAddressMic'), $('sAddressSt'), CONFIG.SPEECH_LANG, 'text');
  fillServices($('wService'), CONFIG.SERVICES);
  attachMic($('wName'), $('wMicBtn'), $('wMicStatus'), CONFIG.SPEECH_LANG, 'name');
  attachMic($('wPhone'), $('wPhoneMicBtn'), $('wPhoneMicStatus'), CONFIG.SPEECH_LANG, 'phone');
  await registerSW();
  if (token) await showDash(); else showLogin();
})();

}
