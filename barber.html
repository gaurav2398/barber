const supabaseBackend = (() => {
// Supabase backend (simple version): the page talks straight to the tables with the public key.
// There are no SQL functions to maintain. The barber login is the one in js/config.js.

const ACTIVE = ['pending', 'accepted', 'in_progress'];
const COLS = 'id,name,phone,service,status,is_walk_in,queue_position,duration_minutes,started_at,created_at';
// the shop row WITHOUT the big payment-QR picture (that is fetched separately, only when needed)
const SHOP_COLS = 'id,shop_name,barber_name,phone,address,is_open,avg_minutes,services,notice,upi_id,has_qr,open_time,close_time';
// ---------------------------------------------------------------------------
// Tiny client for Supabase's REST API. It uses plain fetch(), so it needs nothing
// from any CDN: if your network can reach your Supabase project, it works.
// ---------------------------------------------------------------------------
const baseUrl = () => CONFIG.SUPABASE_URL.replace(/\/+$/, '') + '/rest/v1/';

function authHeaders(extra = {}) {
  const h = { apikey: CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json', ...extra };
  if (String(CONFIG.SUPABASE_ANON_KEY).startsWith('eyJ')) h.Authorization = `Bearer ${CONFIG.SUPABASE_ANON_KEY}`; // old style keys
  return h;
}

class Query {
  constructor(table) {
    this.table = table;
    this.op = 'select';
    this.params = [];
    this.body = null;
    this.prefer = [];
    this.opts = {};
    this.wantRows = false;
    this.mode = null; // 'single' | 'maybe'
  }
  select(cols = '*', opts = {}) {
    if (this.op === 'select') { this.cols = cols; this.opts = opts; } else { this.cols = cols; this.wantRows = true; }
    return this;
  }
  insert(row) { this.op = 'insert'; this.body = row; return this; }
  update(patch) { this.op = 'update'; this.body = patch; return this; }
  delete() { this.op = 'delete'; return this; }
  upsert(row, o = {}) { this.op = 'upsert'; this.body = row; this.onConflict = o.onConflict; return this; }
  eq(c, v) { this.params.push([c, `eq.${v}`]); return this; }
  in(c, vs) { this.params.push([c, `in.(${vs.join(',')})`]); return this; }
  gte(c, v) { this.params.push([c, `gte.${v}`]); return this; }
  order(c, { ascending = true } = {}) { this.params.push(['order', `${c}.${ascending ? 'asc' : 'desc'}`]); return this; }
  limit(n) { this.params.push(['limit', String(n)]); return this; }
  single() { this.mode = 'single'; return this; }
  maybeSingle() { this.mode = 'maybe'; return this; }
  then(resolve, reject) { return this.exec().then(resolve, reject); }

  async exec() {
    const q = new URLSearchParams();
    if (this.cols) q.set('select', this.cols);
    if (this.onConflict) q.set('on_conflict', this.onConflict);
    for (const [k, v] of this.params) q.append(k, v);
    const prefer = [];
    let method = 'GET';
    if (this.op === 'insert') { method = 'POST'; prefer.push(this.wantRows ? 'return=representation' : 'return=minimal'); }
    if (this.op === 'update') { method = 'PATCH'; prefer.push(this.wantRows ? 'return=representation' : 'return=minimal'); }
    if (this.op === 'delete') { method = 'DELETE'; prefer.push('return=minimal'); }
    if (this.op === 'upsert') { method = 'POST'; prefer.push('resolution=merge-duplicates', 'return=minimal'); }
    if (this.op === 'select' && this.opts.head) method = 'HEAD';
    if (this.opts.count) prefer.push(`count=${this.opts.count}`);
    const headers = authHeaders(prefer.length ? { Prefer: prefer.join(',') } : {});
    let res;
    try {
      res = await fetch(`${baseUrl()}${this.table}?${q.toString()}`, { method, headers, body: this.body ? JSON.stringify(this.body) : undefined });
    } catch (err) {
      return { data: null, error: { message: err.message || 'Failed to fetch' } };
    }
    let count = null;
    const range = res.headers.get('content-range'); // "0-4/5" or "*/5"
    if (range && range.includes('/')) { const n = Number(range.split('/')[1]); count = Number.isNaN(n) ? null : n; }
    if (!res.ok) {
      let e = {};
      try { e = await res.json(); } catch { /* not json */ }
      return { data: null, error: { message: e.message || `HTTP ${res.status}`, details: e.details, code: e.code } };
    }
    if (this.opts.head) return { data: null, error: null, count };
    let data = null;
    const text = await res.text();
    if (text) { try { data = JSON.parse(text); } catch { data = null; } }
    if (this.mode === 'single') {
      if (!Array.isArray(data) || data.length !== 1) return { data: null, error: { message: 'row not found' } };
      return { data: data[0], error: null, count };
    }
    if (this.mode === 'maybe') return { data: Array.isArray(data) ? data[0] ?? null : null, error: null, count };
    return { data, error: null, count };
  }
}

async function sb() {
  return { from: (table) => new Query(table) };
}

// ---------------------------------------------------------------------------
// Optional live updates. This needs the official supabase-js library, which is loaded
// from a CDN only for this. If your network blocks every CDN the page still works:
// it just checks for changes every few seconds instead of instantly.
// ---------------------------------------------------------------------------
let realtimeLib;
let live = false;

function loadScript(src) {
  return new Promise((resolve, reject) => {
    const el = document.createElement('script');
    const timer = setTimeout(() => { el.remove(); reject(new Error('timeout')); }, 8000);
    el.src = src;
    el.onload = () => { clearTimeout(timer); resolve(); };
    el.onerror = () => { clearTimeout(timer); el.remove(); reject(new Error('blocked')); };
    document.head.appendChild(el);
  });
}

async function loadRealtimeLib() {
  if (realtimeLib !== undefined) return realtimeLib;
  realtimeLib = null;
  for (const src of ['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2', 'https://unpkg.com/@supabase/supabase-js@2']) {
    try {
      await loadScript(src);
      if (window.supabase && window.supabase.createClient) { realtimeLib = window.supabase; break; }
    } catch { /* try the next one */ }
  }
  return realtimeLib; // null when no CDN is reachable: the page then just checks for changes every few seconds
}

const fail = (msg, extra = {}) => Object.assign(new Error(msg), extra);

// turn a Supabase error into a Marathi message that keeps the technical reason for the screen
function toErr(error) {
  console.error('Supabase error:', error);
  return fail('काहीतरी चुकले. इंटरनेट तपासा आणि पुन्हा प्रयत्न करा', { detail: error.message || error.details || '' });
}

// await a query; any error is thrown
async function run(query) {
  const { data, error, count } = await query;
  if (error) throw toErr(error);
  return { data, count };
}

// await a query but hand the error back (used when an older database may lack a newer column)
const runSoft = (query) => query;

function checkPerson(name, phone, service, walkin = false) {
  const sv = String(service || '').trim();
  if (sv.length < 2 || sv.length > 40) throw fail('कृपया सेवा निवडा');
  const n = String(name || '').trim();
  const p = walkin && NO_PHONE.test(String(phone)) ? String(phone) : normalizePhone(phone);
  if (n.length < 2 || n.length > 60) throw fail('कृपया नाव टाका');
  if (!NO_PHONE.test(p) && !validPhone(p)) throw fail('वैध 10 अंकी मोबाईल नंबर टाका');
  return { n, p, sv };
}

async function assertNoActiveBooking(c, phone) {
  const { data } = await run(c.from('bookings').select('id').eq('phone', phone).in('status', ACTIVE).limit(1));
  if (data.length) throw fail('या नंबरवर आधीच एक नोंद सुरू आहे');
}

// the shop row; an older database without the newer columns still works (it just has fewer settings)
async function getShopRow() {
  const c = await sb();
  let r = await runSoft(c.from('shop_settings').select(SHOP_COLS).eq('id', 1).single());
  if (r.error) r = await runSoft(c.from('shop_settings').select('*').eq('id', 1).single());
  if (r.error) throw toErr(r.error);
  const { pay_qr, ...shop } = r.data;
  return { ...shop, has_qr: shop.has_qr ?? !!pay_qr };
}

// asks the push function (optional) to send something. Never blocks or breaks the page.
function callPush(payload) {
  if (!CONFIG.VAPID_PUBLIC_KEY) return;
  fetch(`${CONFIG.SUPABASE_URL}/functions/v1/${CONFIG.PUSH_FUNCTION}`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY },
    body: JSON.stringify(payload),
  })
    .then((r) => r.json().then((j) => console.info('push:', r.status, j)))
    .catch((err) => console.warn('push function not reachable (alerts only work while the page is open):', err.message));
}
const notify = (event, bookingId) => { if (CONFIG.PUSH_KEY) callPush({ event, booking_id: bookingId, token: CONFIG.PUSH_KEY }); };

const EVENT_FOR_ACTION = { accept: 'accepted', reject: 'rejected', start: 'started', complete: 'check', cancel: 'cancelled', move_up: 'check', move_down: 'check', move_end: 'check', extend: 'check' };

// insert a booking; if the database has no "price" column yet, save it without the price
async function insertBooking(c, row) {
  let r = await runSoft(c.from('bookings').insert(row).select('id').single());
  if (r.error && /price/i.test(r.error.message || '')) {
    const { price, ...withoutPrice } = row;
    r = await runSoft(c.from('bookings').insert(withoutPrice).select('id').single());
  }
  if (r.error) throw toErr(r.error);
  return r.data;
}

const api = {
  async getShop() {
    return getShopRow();
  },

  async getPayQr() {
    const c = await sb();
    return (await run(c.from('shop_settings').select('pay_qr').eq('id', 1).single())).data.pay_qr || '';
  },

  // customers get the queue without full phone numbers
  async getQueue() {
    const c = await sb();
    const since = new Date(Date.now() - 86400000).toISOString();
    const { data } = await run(c.from('bookings').select(COLS).gte('created_at', since));
    return data.map(({ phone, ...r }) => ({ ...r, phone_masked: NO_PHONE.test(phone) ? '' : maskPhone(phone) }));
  },

  async book({ name, phone, service }) {
    const c = await sb();
    const { n, p, sv } = checkPerson(name, phone, service);
    const shop = await getShopRow();
    const st = shopStatus(shop);
    if (!st.open) throw fail(st.note);
    await assertNoActiveBooking(c, p);
    const full = await run(c.from('bookings').select('id', { count: 'exact', head: true }).in('status', ACTIVE));
    if (full.count >= CONFIG.MAX_QUEUE) throw fail('रांग सध्या पूर्ण आहे. थोड्या वेळाने प्रयत्न करा');
    const price = priceOf(getServices(shop, CONFIG.SERVICES), sv);
    const status = CONFIG.AUTO_ACCEPT ? 'accepted' : 'pending';
    const row = await insertBooking(c, { name: n, phone: p, service: sv, status, price });
    callPush({ event: 'new_booking', booking_id: row.id }); // wakes the barber's phone (if he turned that on)
    return { id: row.id, token: row.id, price };
  },

  // the customer cancels his own number (not allowed once he is in the chair)
  async cancelMine(id) {
    const c = await sb();
    const { data } = await run(c.from('bookings').update({ status: 'cancelled', updated_at: new Date().toISOString() }).eq('id', id).in('status', ['pending', 'accepted']).select('id'));
    if (!data || !data.length) throw fail('आता नंबर रद्द करता येत नाही');
  },

  // "I will be late": swap places with the person behind
  async delayMine(id) {
    const c = await sb();
    const { data: waiting } = await run(c.from('bookings').select('id,queue_position').in('status', ['pending', 'accepted']).order('queue_position', { ascending: true }));
    const i = waiting.findIndex((x) => x.id === id);
    if (i < 0) throw fail('आता हे करता येत नाही');
    const other = waiting[i + 1];
    if (!other) throw fail('तुम्ही आधीच शेवटी आहात');
    const now = new Date().toISOString();
    await run(c.from('bookings').update({ queue_position: other.queue_position, notified_next: false, updated_at: now }).eq('id', id));
    await run(c.from('bookings').update({ queue_position: waiting[i].queue_position, notified_next: false, updated_at: now }).eq('id', other.id));
  },

  async savePush(bookingId, _token, endpoint, p256dh, auth) {
    const c = await sb();
    await run(c.from('push_subscriptions').upsert({ booking_id: bookingId, endpoint, p256dh, auth }, { onConflict: 'endpoint' }));
  },

  // the barber's own phone, so that it rings when a customer books
  async saveBarberPush(token, sub) {
    requireBarber(token);

    await run(c.from('barber_push').upsert({ endpoint: sub.endpoint, p256dh: sub.keys.p256dh, auth: sub.keys.auth }, { onConflict: 'endpoint' }));

  subscribe(cb) {
    let channel = null;
    let rc = null;
    let stopped = false;
    loadRealtimeLib().then((lib) => {
      if (stopped || !lib) return;
      try {
        rc = lib.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY);
        channel = rc
          .channel('queue-watch-' + Math.random().toString(36).slice(2))
          .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, cb)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'shop_settings' }, cb)
          .subscribe((status) => { live = status === 'SUBSCRIBED'; });
      } catch (err) {
        console.warn('Live updates not available, using polling', err);
      }
    });
    return () => { stopped = true; live = false; if (rc && channel) rc.removeChannel(channel); };
  },

  // true while instant updates work, so the pages can check less often
  isLive() {
    return live;
  },

  // ---------- barber ----------
  async login(username, password) {
    const b = CONFIG.BARBER;

  async list(token) {

    let r = await runSoft(c.from('bookings').select(COLS + ',price').in('status', ACTIVE).order('queue_position', { ascending: true }));

    let done = await runSoft(c.from('bookings').select('price').eq('status', 'completed').gte('updated_at', since));

  // earlier visits of these phone numbers: { phone: { visits, last_service } }
  async history(token, phones) {
    requireBarber(token);
    const out = {};
    phones.forEach((p) => { out[p] = { visits: 0, last_service: '' }; });
    if (!phones.length) return out;
    const c = await sb();
    const { data } = await run(c.from('bookings').select('phone,service,created_at').eq('status', 'completed').in('phone', phones).order('created_at', { ascending: false }).limit(300));
    data.forEach((r) => {
      const h = out[r.phone];
      if (!h) return;
      if (h.visits === 0) h.last_service = r.service;
      h.visits += 1;
    });
    return out;
  },

  async update(token, id, action, minutes = null) {
    requireBarber(token);
    const c = await sb();
    const b = (await run(c.from('bookings').select('*').eq('id', id).maybeSingle())).data;
    if (!b) throw fail('नोंद सापडली नाही');
    const set = (patch) => run(c.from('bookings').update({ ...patch, updated_at: new Date().toISOString() }).eq('id', id));

    switch (action) {
      case 'accept':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या स्वीकारता येतात');
        await set({ status: 'accepted' }); break;
      case 'reject':
        if (b.status !== 'pending') throw fail('फक्त प्रतीक्षेतील विनंत्या नाकारता येतात');
        await set({ status: 'rejected' }); break;
      case 'start': {
        if (!['pending', 'accepted'].includes(b.status)) throw fail('या ग्राहकाची सेवा सुरू करता येत नाही');
        if (![10, 20, 30, 40, 50, 60].includes(minutes)) throw fail('10 ते 60 मिनिटे निवडा');
        const busy = await run(c.from('bookings').select('id').eq('status', 'in_progress').limit(1));
        if (busy.data.length) throw fail('आधी सध्याच्या ग्राहकाचे काम पूर्ण करा');
        await set({ status: 'in_progress', started_at: new Date().toISOString(), duration_minutes: minutes, notified_next: false }); break;
      }
      case 'complete':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        await set({ status: 'completed' }); break;
      case 'extend':
        if (b.status !== 'in_progress') throw fail('हा ग्राहक खुर्चीवर नाही');
        if (!(minutes >= 5 && minutes <= 60)) throw fail('5 ते 60 मिनिटे निवडा');
        await set({ duration_minutes: b.duration_minutes + minutes }); break;
      case 'cancel':
        if (!ACTIVE.includes(b.status)) throw fail('ही नोंद आधीच बंद झाली आहे');
        await set({ status: 'cancelled' }); break;
      case 'move_up':
      case 'move_down': {
        const { data: waiting } = await run(c.from('bookings').select('id,queue_position').in('status', ['pending', 'accepted']).order('queue_position', { ascending: true }));
        const i = waiting.findIndex((x) => x.id === id);
        const other = waiting[action === 'move_up' ? i - 1 : i + 1];
        if (other) {
          const now = new Date().toISOString();
          await run(c.from('bookings').update({ queue_position: other.queue_position, notified_next: false, updated_at: now }).eq('id', id));
          await run(c.from('bookings').update({ queue_position: waiting[i].queue_position, notified_next: false, updated_at: now }).eq('id', other.id));
        }
        break;
      }
      case 'move_end': {
        if (!['pending', 'accepted'].includes(b.status)) throw fail('हा ग्राहक रांगेत नाही');
        const { data: top } = await run(c.from('bookings').select('queue_position').in('status', ACTIVE).order('queue_position', { ascending: false }).limit(1));
        const last = top.length ? top[0].queue_position : 0;
        if (b.queue_position < last) await set({ queue_position: last + 1, notified_next: false });
        break;
      }
      default:
        throw fail('अज्ञात कृती');
    }
    const event = EVENT_FOR_ACTION[action];
    if (event) notify(event, id);
  },

    await run(c.from('bookings').update({ status: snap.status, started_at: snap.started_at, duration_minutes: snap.duration_minutes, updated_at: new Date().toISOString() }).eq('id', id));
  },

      return { label, ok: !r.error, why: r.error ? r.error.message || '' : '' };
    };
    const out = [
      await probe('दर आणि कमाई', 'bookings', 'price'),
      await probe('सेवा, सूचना आणि दुकानाची वेळ', 'shop_settings', 'services,notice,open_time,close_time'),
      await probe('पेमेंट QR आणि UPI', 'shop_settings', 'upi_id,pay_qr,has_qr'),
      await probe('बार्बरच्या फोनवरील सूचना (टेबल)', 'barber_push', 'id'),
      await probe('बार्बरच्या फोनवरील सूचना (खूण)', 'bookings', 'barber_notified'),
      await probe('"तुमच्या पुढे N जण" सूचना', 'bookings', 'last_ahead'),
      await probe('स्लायडर फोटो', 'slider_photos', 'id'),

    // the push function: the new code answers "new_booking" for everybody, the old code says 401

    else {

          method: 'POST', headers: { 'Content-Type': 'application/json', apikey: CONFIG.SUPABASE_ANON_KEY }, body: JSON.stringify({ event: 'new_booking', booking_id: null }),
        });
        fn.ok = r.ok;
        fn.why = r.ok ? '' : r.status === 404 ? 'फंक्शन तयार केलेले नाही' : r.status === 401 ? 'जुना कोड आहे' : `फंक्शन सुरू होत नाही (HTTP ${r.status}): Secrets तपासा`;
      } catch { fn.why = 'फंक्शन पोहोचत नाही'; }
    }
    out.push(fn);
    return out;
  },

    if (r.status === 404) throw fail('"push" नावाचे फंक्शन Supabase मध्ये सापडत नाही. ते तयार करून Deploy करा.');

    if (!r.ok) throw fail(`फंक्शन चालत नाही (HTTP ${r.status}). Supabase, Edge Functions, push, Logs मध्ये कारण दिसेल. Secrets (VAPID_PUBLIC_KEY, VAPID_PRIVATE_KEY, VAPID_SUBJECT) तपासा.`);

  async saveShop(token, info) {

const backend = MODE === 'supabase' ? supabaseBackend : demoBackend;

function runCustomer() {

const $ = (id) => document.getElementById(id);
const STORE = 'bq_my_booking';

let shop = { ...CONFIG.SHOP };
let rows = [];
let q = buildQueue([], Date.now());
let mine = readMine();
let signature = '';
let showAll = false;
const VISIBLE = 4;
let prevKey = null;
let swReg = null;
let showQr = false; // payment QR picture is shown
let payQr = null; // the picture itself (null = not loaded yet)
let svcSig = '';
let infoSig = '';
let shopLoaded = false; // the details card waits for the real shop data, so it never flashes wrong information
let deferredInstall = null;

const avgMinutes = () => shop.avg_minutes || CONFIG.AVG_SERVICE_MINUTES;
const servicesOf = () => getServices(shop, CONFIG.SERVICES);
// how long a customer's service usually takes (0 = unknown, the shop average is used)
const minutesFor = (r) => (servicesOf().find((s) => s.name === r.service) || {}).minutes || 0;

function readMine() {
  try { return JSON.parse(localStorage.getItem(STORE) || 'null'); } catch { return null; }
}
function writeMine(v) {
  mine = v;
  if (v) localStorage.setItem(STORE, JSON.stringify(v)); else localStorage.removeItem(STORE);
}

/* ------------------------------------------------------------------ slider (photos added by the barber) */
let slideSig = null; // what is on screen right now
let loadedIds = null; // what the database had the last time we looked
let slideIdx = 0;
let slideCount = 0;
let pausedUntil = 0;

function markDot() {
  [...$('dots').children].forEach((d, i) => d.setAttribute('aria-current', String(i === slideIdx)));
}

function goSlide(i) {
  if (!slideCount) return;
  slideIdx = (i + slideCount) % slideCount;
  $('slides').scrollTo({ left: slideIdx * $('slides').clientWidth, behavior: 'smooth' });
  markDot();
}

function renderSlides(list) {
  const all = [...CONFIG.SLIDES, ...list];
  const sig = all.map((s) => s.id || s.src).join('|');
  if (sig !== slideSig) {
    slideSig = sig;
    slideCount = 1 + all.length; // the barber's details card is always the first slide
    slideIdx = 0;
    $('slides').innerHTML = '<figure class="slide info-slide" id="infoSlide"></figure>' +
      all.map((s) => `<figure class="slide"><img src="${esc(s.src)}" alt="${esc(s.alt || 'दुकानाचा फोटो')}" loading="lazy" decoding="async"></figure>`).join('');
    infoSig = '';
    $('dots').innerHTML = slideCount > 1 ? Array.from({ length: slideCount }, (_, i) => `<button type="button" aria-label="स्लाइड ${i + 1}" data-i="${i}"></button>`).join('') : '';
    $('slides').scrollLeft = 0;
    markDot();
  }
  renderInfoSlide();
}

// cheap check (ids only); the pictures themselves are downloaded only when something changed
async function loadSlides() {
  try {
    const ids = await backend.getSlideIds();
    const key = ids.join('|');
    if (key === loadedIds) return;
    const list = await backend.getSlides();
    loadedIds = key;
    renderSlides(list);
  } catch (err) {
    console.error(err);
    if (slideSig === null) renderSlides([]);
  }
}

function setupSlider() {
  const wrap = $('slides');
  wrap.addEventListener('scroll', () => {
    const i = Math.round(wrap.scrollLeft / (wrap.clientWidth || 1));
    if (i !== slideIdx && i < slideCount) { slideIdx = i; markDot(); }
  }, { passive: true });
  $('dots').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (b) { pausedUntil = Date.now() + 10000; goSlide(Number(b.dataset.i)); }
  });
  ['touchstart', 'pointerdown', 'keydown'].forEach((ev) => wrap.addEventListener(ev, () => { pausedUntil = Date.now() + 10000; }, { passive: true }));
  if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    setInterval(() => {
      if (document.hidden || Date.now() < pausedUntil || slideCount < 2) return;
      goSlide(slideIdx + 1);
    }, 4500);
  }
}

/* ------------------------------------------------------------------ data */
async function refresh() {

}

function recompute() {

function findMe() {

function ticketHTML(me) {
  const row = q.list.find((r) => r.id === me.id);
  const first = esc(me.name.split(' ')[0]);
  const permission = 'Notification' in window ? Notification.permission : 'unsupported';
  let cls = '';
  let head = '';
  let body = '';

  if (row && row.status === 'in_progress') {
    cls = 'is-chair';
    head = `<div class="t-num">आता</div><div><h2>${first}, तुमची पाळी आली</h2><p>कृपया खुर्चीवर बसा. ठरलेला वेळ: ${row.duration_minutes} मिनिटे.</p></div>`;
  } else if (row && (row.isNext || (row.ahead === 1 && row.status === 'accepted'))) {
    cls = 'is-next';
    head = `<div class="t-num">#${row.index + 1}</div><div><h2>${first}, तुम्ही पुढचे आहात</h2><p>कृपया आता दुकानात या.</p></div>`;
  } else if (row && row.status === 'accepted') {
    head = `<div class="t-num">#${row.index + 1}</div><div><h2>${first}, तुम्ही रांगेत आहात</h2><p>तुमच्या पुढे ${row.ahead} जण. अंदाजे ${fmtTime(row.etaMs)} ला तुमचा नंबर.</p></div>`;
  } else if (row && row.status === 'pending') {
    head = `<div class="t-num">#${row.index + 1}</div><div><h2>विनंती पाठवली</h2></div>`;
  } else if (me.status === 'completed') {
    cls = 'is-done';
    head = `<div class="t-num">पूर्ण</div><div><h2>धन्यवाद, ${first}</h2><p>केस कापणी आवडली असेल. पुन्हा भेटू.</p></div>`;
  } else if (me.status === 'rejected') {
    head = `<div class="t-num">नाही</div><div><h2>विनंती नाकारली</h2><p>केशकर्तनकार ही विनंती घेऊ शकले नाहीत. पुन्हा प्रयत्न करा किंवा फोन करा.</p></div>`;
  } else {
    head = `<div class="t-num">रद्द</div><div><h2>नंबर रद्द झाला</h2><p>हा नंबर रद्द करण्यात आला आहे. तुम्ही पुन्हा नंबर लावू शकता.</p></div>`;
  }

  const active = row && ['pending', 'accepted', 'in_progress'].includes(row.status);
  const svc = active && mine && mine.service ? `<p class="note svc">तुमची सेवा: <b>${esc(mine.service)}</b>${mine.price ? ` (₹${mine.price})` : ''}</p>` : '';
  if (active) {
    if (permission === 'default') {
      body = `${svc}<div class="t-actions"><button class="btn btn-dark btn-block" data-act="notify" type="button">माझी पाळी आली की सूचना द्या</button></div>`;
    } else if (permission === 'denied') {
      body = `${svc}<p class="note">या साइटसाठी सूचना बंद आहेत. Chrome मध्ये कुलूप चिन्ह, परवानग्या, सूचना येथे चालू करा.</p>`;
    } else if (permission === 'granted') {
      body = `${svc}<p class="note">सूचना चालू आहेत. ब्राउझर बंद असला तरी तुमच्या पुढे ${CONFIG.NOTIFY_FROM} जण राहिले की प्रत्येक वेळी कळवू.</p>`;
    } else {
      body = svc;
    }
    // waiting (not yet in the chair): let him step back or give up his number
    if (row.status !== 'in_progress') {
      const last = row.index === q.list.length - 1;
      body += `<div class="t-small">${last ? '' : '<button class="btn btn-ghost btn-sm" data-act="delay" type="button">उशीर होईल, एक नंबर मागे जा</button>'}<button class="btn btn-ghost btn-sm" data-act="cancel" type="button">नंबर रद्द करा</button></div>`;
    }
    if (row.status === 'in_progress') body += payHTML();
  } else {
    body = (me.status === 'completed' ? payHTML() : '') + `<div class="t-actions"><button class="btn btn-primary btn-block" data-act="again" type="button">पुन्हा नंबर लावा</button></div>`;
  }
  return { cls, html: `<div class="ticket-head">${head}</div>${body}` };
}

function renderBookForm(me) {

function queueHTML() {
  if (!q.waiting.length) return '<li class="empty">कोणीही थांबलेले नाही. आता नंबर लावा, तुम्ही पहिले असाल.</li>';
  const isMineRow = (r) => mine && r.id === mine.id;
  const shown = q.waiting.filter((r, i) => showAll || i < VISIBLE || isMineRow(r));
  const hidden = q.waiting.length - shown.length;
  const items = shown
    .map((r) => {
      const isMine = isMineRow(r);
      return `<li class="q-item${isMine ? ' mine' : ''}">
        <div class="q-num">${r.index + 1}</div>
        <div>
          <div class="q-name">${esc(r.name)}${isMine ? '<span class="you">तुम्ही</span>' : ''}${r.is_walk_in ? '<span class="walkin">प्रत्यक्ष</span>' : ''}</div>
          <div class="q-phone">${esc(r.phone_masked || maskPhone(r.phone))}</div>
        </div>
        <div class="q-side"><span class="badge" data-s="${r.status}">${statusLabel(r.status)}</span><span class="q-wait">${waitText(r.waitMin)}</span></div>
      </li>`;
    })
    .join('');
  const more = hidden > 0 ? `<li><button class="btn btn-ghost btn-sm btn-block" data-more="1" type="button">आणखी ${hidden} जण पाहा</button></li>`
    : showAll && q.waiting.length > VISIBLE ? '<li><button class="btn btn-ghost btn-sm btn-block" data-more="0" type="button">कमी दाखवा</button></li>' : '';
  return items + more;
}

function render() {
  recompute();
  const me = findMe();
  if (mine && !me) writeMine(null); // booking too old to be listed any more
  renderHeader();
  renderInfoSlide();
  renderTicket(me);
  renderBookForm(me);
  renderLive();
  $('queueList').innerHTML = queueHTML();
  const n = q.list.length;
  $('queueCount').textContent = n ? `${n} जण रांगेत` : '';
  signature = makeSignature(me);
  checkAlerts(me);
}

function makeSignature(me) {
  return q.list.map((r) => `${r.id}:${r.status}:${r.isNext ? 1 : 0}:${r.waitMin}`).join('|') + `#${me ? me.status : ''}#${shopStatus(shop).open}#${shop.shop_name}#${q.current ? Math.ceil(q.current.leftMs / 60000) : 0}#${showAll}#${showQr}#${shop.notice}#${shop.upi_id}#${shop.has_qr}`;
}

// Runs every second: cheap updates only, full render when something changed.
function tick() {
  updateClock();
  recompute();
  const me = findMe();
  if (makeSignature(me) !== signature) { render(); return; }
  const c = q.current;
  if (c) {
    const t = $('liveTime');
    t.textContent = fmtClock(c.leftMs);
    t.classList.toggle('over', c.leftMs < 0);
    $('liveBar').style.width = `${Math.max(4, c.progress * 100)}%`;
    $('liveEnd').textContent = endText(c);
  }
}

/* ------------------------------------------------------------------ alerts */
// shows the banner + beeps + vibrates; the same title is never shown twice within 8 seconds
// (a push message and the page's own check can both report the same thing)
const recentAlerts = new Map();
function alertOnce(title, text) {
  const now = Date.now();
  if ((recentAlerts.get(title) || 0) > now - 8000) return false;
  recentAlerts.set(title, now);
  toast(text, { title, type: 'alert', ms: 9000 });
  beep(2);
  vibrate([300, 120, 300]);
  return true;
}

// "your place changed": N people ahead, from NOTIFY_FROM down to 1 (the page's own version of the push message)
let prevAhead = null;
function checkAhead(row) {
  const now = row && row.status !== 'in_progress' ? row.ahead : null;
  const was = prevAhead;
  prevAhead = now;
  if (was === null || now === null || now >= was || now < 1 || now > CONFIG.NOTIFY_FROM) return;
  alertOnce(now === 1 ? 'तुम्ही पुढचे आहात' : `तुमच्या पुढे ${now} जण`, now === 1 ? 'तुमचा नंबर पुढचा आहे. कृपया आता दुकानात या.' : 'तुमचा नंबर जवळ येत आहे. तयार रहा.');
}
function checkAlerts(me) {
  if (!me) { prevKey = null; prevAhead = null; return; }
  const row = q.list.find((r) => r.id === me.id);
  checkAhead(row);
  const key = `${me.status}${row && row.isNext ? ':next' : ''}`;
  if (prevKey === null) { prevKey = key; return; }
  if (key === prevKey) return;
  const before = prevKey;
  prevKey = key;

  const statusBefore = before.split(':')[0];
  let title = null;
  let text = '';
  if (me.status !== statusBefore) {
    if (me.status === 'accepted') { title = 'नंबर स्वीकारला'; text = row && row.isNext ? 'तुम्ही पुढचे आहात. कृपया आता दुकानात या.' : 'तुम्ही रांगेत आहात. तुमचा नंबर जवळ आला की कळवू.'; }
    else if (me.status === 'in_progress') { title = 'तुमची पाळी आली'; text = 'कृपया खुर्चीवर बसा.'; }
    else if (me.status === 'rejected') { title = 'विनंती नाकारली'; text = 'केशकर्तनकार ही विनंती घेऊ शकले नाहीत.'; }
    else if (me.status === 'cancelled') { title = 'नंबर रद्द झाला'; text = 'तुमचा नंबर रद्द करण्यात आला.'; }
  } else if (key.endsWith(':next')) {
    title = 'तुम्ही पुढचे आहात'; text = 'कृपया आता दुकानात या.';
  }
  if (!title) return;

  alertOnce(title, text);
  // In demo mode there is no server push, so show a local notification if the tab is in the background.
  if (MODE === 'demo' && document.hidden && 'Notification' in window && Notification.permission === 'granted' && swReg) {
    swReg.showNotification(title, { body: text, icon: 'icons/icon-192.png', vibrate: [300, 120, 300], tag: 'queue' });
  }
}

/* ------------------------------------------------------------------ push */
async function enablePush() {
  if (!('Notification' in window)) { toast('या ब्राउझरमध्ये सूचना चालत नाहीत.', { type: 'error' }); return; }
  const result = await Notification.requestPermission();
  if (result === 'granted') await subscribePush();
  render();
  if (result === 'granted') toast('सूचना चालू झाल्या. तुमचा नंबर जवळ आला की कळवू.', { type: 'ok' });
}

async function subscribePush() {
  if (MODE !== 'supabase' || !CONFIG.VAPID_PUBLIC_KEY || !mine) return;
  try {
    const reg = await withTimeout(navigator.serviceWorker.ready, 4000, 'sw.js फाइल अपलोड केलेली नाही');
    const sub = (await reg.pushManager.getSubscription()) ||
      (await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToUint8Array(CONFIG.VAPID_PUBLIC_KEY) }));
    const j = sub.toJSON();
    await backend.savePush(mine.id, mine.token, j.endpoint, j.keys.p256dh, j.keys.auth);
  } catch (err) {
    console.error('Push subscribe failed', err);
  }
}

/* ------------------------------------------------------------------ events */
$('queueList').addEventListener('click', (e) => {
  const b = e.target.closest('[data-more]');
  if (b) { showAll = b.dataset.more === '1'; render(); }
});

$('ticketWrap').addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const act = b.dataset.act;
  if (act === 'notify') enablePush();
  if (act === 'again') { writeMine(null); prevKey = null; showQr = false; render(); }
  if (act === 'qr') { showQr = !showQr; render(); if (showQr) loadQr(); }
  if (act === 'cancel' && confirm('तुमचा नंबर रद्द करायचा?')) {
    backend.cancelMine(mine.id).then(() => { toast('तुमचा नंबर रद्द केला.', { type: 'ok' }); return refresh(); }).catch((err) => toast(err.message, { type: 'error' }));
  }
  if (act === 'delay') {
    backend.delayMine(mine.id).then(() => { toast('ठीक आहे, तुम्ही एक नंबर मागे गेलात.', { type: 'ok' }); return refresh(); }).catch((err) => toast(err.message, { type: 'error' }));
  }
});

// the payment QR picture is big, so it is downloaded only when somebody asks to see it
async function loadQr() {
  if (!shop.has_qr || payQr !== null) return;
  payQr = '';
  try { payQr = await backend.getPayQr(); } catch (err) { console.error(err); }
  render();
}

$('bookForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('formError');
  err.hidden = true;
  const name = $('name').value.trim();
  const phone = normalizePhone($('phone').value);
  const service = $('service').value;
  if (name.length < 2) { err.textContent = 'कृपया तुमचे नाव टाका.'; err.hidden = false; $('name').focus(); return; }
  if (!validPhone(phone)) { err.textContent = 'वैध 10 अंकी मोबाईल नंबर टाका.'; err.hidden = false; $('phone').focus(); return; }

  if (!service) { err.textContent = 'कृपया सेवा निवडा.'; err.hidden = false; $('service').focus(); return; }
  const st = shopStatus(shop);
  if (!st.open) {
    err.textContent = st.note;
    err.hidden = false;
    return;
  }

  // Chrome only shows its "Allow notifications?" box after a tap, and this tap is the best moment: it is asked now
  // and the phone is saved for this booking as soon as the booking exists
  const permAsk = window.Notification && Notification.permission === 'default' ? Notification.requestPermission() : null;
  const btn = $('bookBtn');
  btn.disabled = true;
  btn.textContent = 'नंबर लावत आहे...';
  try {
    const res = await backend.book({ name, phone, service });
    writeMine({ id: res.id, token: res.token, name, service, price: res.price || 0 });
    localStorage.setItem('bq_last', JSON.stringify({ name, phone, service })); // remembered for next time
    prevKey = null;
    $('bookForm').reset();
    toast(CONFIG.AUTO_ACCEPT ? 'तुमचा नंबर लागला! तुम्ही रांगेत आहात.' : 'विनंती पाठवली. केशकर्तनकार लवकरच स्वीकारतील.', { type: 'ok' });
    await refresh();
    if (permAsk) permAsk.then((p) => { if (p === 'granted') subscribePush().then(render); }).catch(() => {});
    else if (window.Notification?.permission === 'granted') subscribePush();
  } catch (error) {
    err.textContent = error.message;
    err.hidden = false;
  } finally {
    btn.disabled = false;
    btn.textContent = 'माझा नंबर लावा';
  }
});

/* ------------------------------------------------------------------ start */
async function init() {
  if (MODE === 'demo') $('demoBanner').hidden = false;
  $('ver').textContent = `आवृत्ती ${CONFIG.VERSION}`;
  console.info('सलून रांग, आवृत्ती', CONFIG.VERSION);
  updateClock();
  setupSlider();
  renderSlides([]); // the details card shows at once; photos are added when they arrive
  loadSlides();
  fillServices($('service'), servicesOf());
  attachMic($('name'), $('micBtn'), $('micStatus'), CONFIG.SPEECH_LANG, 'name');
  attachMic($('phone'), $('micPhoneBtn'), $('micPhoneStatus'), CONFIG.SPEECH_LANG, 'phone');
  swReg = await registerSW();
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredInstall = e; $('installBtn').hidden = false; });
  window.addEventListener('appinstalled', () => { $('installBtn').hidden = true; });
  $('installBtn').addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
    $('installBtn').hidden = true;
  });
  navigator.serviceWorker?.addEventListener('message', (e) => {
    if (e.data && e.data.type === 'push') { refresh(); alertOnce(e.data.title, e.data.body); }
  });
  await refresh();
  // fill in the name, number and service he used last time
  try {
    const last = JSON.parse(localStorage.getItem('bq_last') || 'null');
    if (last && !$('name').value && !$('phone').value) {
      $('name').value = last.name || '';
      $('phone').value = last.phone || '';
      if (last.service && servicesOf().some((x) => x.name === last.service)) $('service').value = last.service;
    }
  } catch { /* ignore */ }
  backend.subscribe(refresh);
  let pollN = 0;
  setInterval(() => {
    if (document.hidden) return;
    pollN += 1;
    if (pollN % (backend.isLive && backend.isLive() ? 5 : 1) === 0) refresh();
  }, CONFIG.POLL_SECONDS * 1000);
  setInterval(tick, 1000);
  setInterval(loadSlides, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { refresh(); loadSlides(); } });
  if (window.Notification?.permission === 'granted') subscribePush();
}

init();

}

function runBarber() {

const $ = (id) => document.getElementById(id);
const TOKEN_KEY = 'bq_barber_token';

let token = localStorage.getItem(TOKEN_KEY);
let shop = { ...CONFIG.SHOP };
let bookings = [];
let doneToday = 0;
let earnings = 0;
const historyCache = new Map(); // phone -> { visits, last_service }
let svcSig = '';
let pushChecked = false;
let prevBy = new Map(); // bookings as they were at the last check, to notice customers who cancelled themselves
const ownTouch = new Map(); // ids the barber himself has just changed: id -> time
let breakSig = '';
const NO_PHONE = /^W\d{9}$/; // a walk-in without a phone number
const hasPhone = (r) => !NO_PHONE.test(r.phone);
let q = buildQueue([], Date.now());
let seen = null; // ids we've already told the barber about
const snooze = new Map(); // "later" button: key -> time until which the popup stays quiet
let timeCtx = null;
let alarmTimer = null;
let signature = '';
let lastErrorToast = 0;
let pollTimer = null;
let tickTimer = null;
let unsubscribe = null;
let pendingStartId = null;

/* ------------------------------------------------------------------ views */
function showLogin(message) {
  $('dashView').hidden = true;
  $('loginView').hidden = false;
  $('demoHint').hidden = MODE !== 'demo';
  if (message) { $('loginError').textContent = message; $('loginError').hidden = false; }
  clearInterval(pollTimer); clearInterval(tickTimer);
  if (unsubscribe) { unsubscribe(); unsubscribe = null; }
}

async function showDash() {
  $('loginView').hidden = true;
  $('dashView').hidden = false;
  $('demoBanner').hidden = MODE !== 'demo';
  $('resetBtn').hidden = MODE !== 'demo';
  $('resetBtn').parentElement.hidden = MODE !== 'demo'; // an empty strip at the bottom is not needed
  seen = null;
  prevBy = new Map();
  await refresh();
  if (!token) return; // refresh() logged us out (expired session)
  unsubscribe = backend.subscribe(refresh);
  let pollN = 0;
  pollTimer = setInterval(() => {
    if (document.hidden) return;
    pollN += 1;
    if (pollN % (backend.isLive && backend.isLive() ? 5 : 1) === 0) refresh();
  }, CONFIG.POLL_SECONDS * 1000);
  tickTimer = setInterval(tick, 1000);
}

function logout(message) {
  token = null;
  localStorage.removeItem(TOKEN_KEY);
  showLogin(message);
}

const servicesOf = () => getServices(shop, CONFIG.SERVICES);
const minutesFor = (r) => (servicesOf().find((x) => x.name === r.service) || {}).minutes || 0;
// if the database has not got the newer columns yet, point the barber to the one-time SQL
const dbMessage = (err) => {
  const text = `${err.detail || ''} ${err.message || ''}`;
  if (!/column|schema cache|does not exist|relation/i.test(text)) return err.message;
  const m = /'([a-z_]+)' column|column [\w.]*?([a-z_]+) does not exist|table 'public\.([a-z_]+)'|relation "?(?:public\.)?([a-z_]+)"? does not exist/i.exec(text);
  const what = m ? m[1] || m[2] || m[3] || m[4] : '';
  return `आधी SQL एकदा चालवा${what ? ` (सापडत नाही: ${what})` : ''}. आधीच चालवला असेल तर 10 सेकंद थांबून पुन्हा प्रयत्न करा. (सेटअप मदत उघडण्यासाठी: पानाच्या शेवटी "आवृत्ती" वर 5 वेळा टॅप करा)`;
};

/* ------------------------------------------------------------------ data */
async function refresh() {
  try {
    const [s, data] = await Promise.all([backend.getShop(), backend.list(token)]);
    shop = s;
    bookings = data.bookings;
    doneToday = data.completed_today;
    earnings = data.earnings_today || 0;
    render();
    detectNew();
    loadHistory();
    if (!pushChecked) { pushChecked = true; syncBarberPush(false); }
  } catch (err) {
    if (err.unauthorized) { logout('तुमचे सेशन संपले. पुन्हा साइन इन करा.'); return; }
    console.error(err);
    if (Date.now() - lastErrorToast > 30000) {
      lastErrorToast = Date.now();
      toast(`सर्व्हरशी संपर्क होत नाही (कारण: ${err.detail || err.message})`, { type: 'error', ms: 8000 });
    }
  }
}

async function act(id, action, minutes, { undo = true } = {}) {
  ownTouch.set(id, Date.now());
  const before = bookings.find((b) => b.id === id);
  const snap = before ? { status: before.status, started_at: before.started_at, duration_minutes: before.duration_minutes } : null;
  try {
    await backend.update(token, id, action, minutes);
    if (action === 'complete' && before) historyCache.delete(before.phone); // his visit count has just gone up
    await refresh();
    if (undo && snap && (action === 'complete' || action === 'cancel')) {
      const text = action === 'complete' ? `${before.name}: काम पूर्ण झाले` : `${before.name} यांना रांगेतून काढले`;
      toast(text, { type: 'ok', ms: 8000, action: { label: 'परत आणा', onClick: () => undoAction(id, snap, before) } });
    }
    return true;
  } catch (err) {
    if (err.unauthorized) { logout('तुमचे सेशन संपले. पुन्हा साइन इन करा.'); return false; }
    toast(err.message, { type: 'error' });
    return false;
  }
}

async function undoAction(id, snap, before) {
  ownTouch.set(id, Date.now());
  try {
    await backend.restore(token, id, snap);
    historyCache.delete(before.phone);
    await refresh();
    toast(`${before.name} यांना परत आणले.`, { type: 'ok' });
  } catch (err) {
    toast(err.message, { type: 'error' });
  }
}

// earlier visits ("3 वेळा आले") are looked up once per phone number and remembered
async function loadHistory() {
  const need = [...new Set(bookings.map((b) => b.phone))].filter((p) => !historyCache.has(p));
  if (!need.length) return;
  try {
    const h = await backend.history(token, need);
    need.forEach((p) => historyCache.set(p, h[p] || { visits: 0, last_service: '' }));
    render();
  } catch (err) {
    console.error(err);
    need.forEach((p) => historyCache.set(p, { visits: 0, last_service: '' }));
  }
}

/* ------------------------------------------------------------------ render */
function recompute() {
  q = buildQueue(bookings, Date.now(), shop.avg_minutes || CONFIG.AVG_SERVICE_MINUTES, CONFIG.NEXT_ALERT_MINUTES, minutesFor);
}

// green round call button: one tap opens the phone dialler with this customer's number
const callBtn = (r) => !hasPhone(r) ? '' : `<a class="call-btn" href="tel:${esc(r.phone)}" aria-label="${esc(r.name)} यांना फोन करा"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg></a>`;
const histChip = (r) => { const h = historyCache.get(r.phone); return h && h.visits ? `<span class="hist-chip">${h.visits} वेळा आले</span>` : ''; };
const lastService = (r) => { const h = historyCache.get(r.phone); return h && h.last_service ? `. मागच्या वेळी: ${esc(h.last_service)}` : ''; };
const svcChip = (r) => (r.service ? `<span class="svc-chip">${esc(r.service)}</span>` : '');

function chairHTML() {
  const c = q.current;
  if (!c) return '<p class="empty">खुर्ची रिकामी आहे. स्वीकारलेल्या ग्राहकासमोर "सुरू करा" दाबा.</p>';
  return `
    <div class="chair-person">
      <div>
        <div class="chair-name">${esc(c.name)}</div>
        ${svcChip(c) || histChip(c) ? `<div>${svcChip(c)}${histChip(c)}</div>` : ''}
        ${hasPhone(c) ? `<a class="b-phone" href="tel:${esc(c.phone)}">${esc(c.phone)}</a>` : '<span class="b-nophone">फोन नाही</span>'}
      </div>
      <div id="chairTime" class="chair-time" aria-label="उरलेला वेळ">${fmtClock(c.leftMs)}</div>
    </div>
    <div class="pole-bar"><div id="chairFill" class="pole-fill" style="width:${Math.max(4, c.progress * 100)}%"></div></div>
    <p class="chair-meta">ठरलेला वेळ ${c.duration_minutes} मिनिटे. संपेल: ${fmtTime(endMs(c))}</p>
    <div class="b-actions" style="margin-top:12px">
      <button class="btn btn-primary" data-act="complete" data-id="${c.id}" type="button">पूर्ण करा</button>
      <button class="btn btn-ghost" data-act="extend" data-id="${c.id}" data-min="10" type="button">10 मिनिटे वाढवा</button>
      <button class="btn btn-danger" data-act="cancel" data-id="${c.id}" type="button">रद्द करा</button>
      ${callBtn(c)}
    </div>`;
}

function itemHTML(r, i, total) {
  const num = r.index + 1;
  let actions = '';
  if (r.status === 'pending') {
    actions = `<button class="btn btn-primary" data-act="accept" data-id="${r.id}" type="button">स्वीकारा</button>
               <button class="btn btn-danger" data-act="reject" data-id="${r.id}" type="button">नाकारा</button>`;
  } else {
    actions = `<button class="btn btn-blue" data-act="start" data-id="${r.id}" data-name="${esc(r.name)}" data-service="${esc(r.service || '')}" type="button">सुरू करा</button>
               <button class="btn btn-danger" data-act="cancel" data-id="${r.id}" type="button">काढा</button>`;
  }
  const up = `<button class="btn btn-ghost btn-icon" data-act="move_up" data-id="${r.id}" aria-label="${esc(r.name)} यांना वर हलवा" ${i === 0 ? 'disabled' : ''} type="button">&uarr;</button>`;
  const down = `<button class="btn btn-ghost btn-icon" data-act="move_down" data-id="${r.id}" aria-label="${esc(r.name)} यांना खाली हलवा" ${i === total - 1 ? 'disabled' : ''} type="button">&darr;</button>`;
  return `<li class="b-item">
    <div class="b-top">
      <div class="q-num">${num}</div>
      <div>
        <div class="b-name">${esc(r.name)}${r.is_walk_in ? '<span class="walkin">प्रत्यक्ष</span>' : ''}</div>
        ${svcChip(r) || histChip(r) ? `<div>${svcChip(r)}${histChip(r)}</div>` : ''}
        ${hasPhone(r) ? `<a class="b-phone" href="tel:${esc(r.phone)}">${esc(r.phone)}</a>` : '<span class="b-nophone">फोन नाही</span>'}
        <div class="b-time">नोंद: ${fmtTime(r.created_at)}, प्रतीक्षा: ${waitText(r.waitMin)}${lastService(r)}</div>
        ${i < total - 1 ? `<button class="mini-link" data-act="move_end" data-id="${r.id}" type="button">शेवटी ढकला</button>` : ''}
      </div>
      <div class="b-side">
        <span class="badge" data-s="${r.status}">${r.isNext ? 'पुढचा' : statusLabel(r.status)}</span>
        ${callBtn(r)}
      </div>
    </div>
    <div class="b-actions row">${actions}${up}${down}</div>
  </li>`;
}

function render() {
  recompute();
  $('shopName').textContent = shop.shop_name;
  const sw = $('openSwitch');
  sw.setAttribute('aria-checked', String(!!shop.is_open));
  $('openLabel').textContent = shop.is_open ? 'सुरू' : 'बंद';
  $('sWaiting').textContent = q.waiting.length;
  $('sChair').textContent = q.current ? 1 : 0;
  $('sDone').textContent = doneToday;
  $('sMoney').textContent = earnings ? `₹${earnings.toLocaleString('en-IN')}` : '';
  $('sMoney').hidden = !earnings;
  const sig = JSON.stringify(servicesOf());
  if (sig !== svcSig) { svcSig = sig; fillServices($('wService'), servicesOf()); }
  // until a payment QR or UPI id is saved: a hint
  const noPay = !shop.has_qr && !String(shop.upi_id || '').trim();
  $('payHint').hidden = !noPay || localStorage.getItem('bq_hide_payhint') === '1';
  // when everybody will be done
  const left = q.waitForNew;
  $('qEnd').hidden = !(q.list.length && left > 0);
  if (!$('qEnd').hidden) $('qEnd').textContent = `सगळ्यांचे काम संपायला साधारण ${waitText(left).replace('सुमारे ', '')}, म्हणजे ${fmtTime(Date.now() + left * 60000)} पर्यंत.`;
  renderBreakBar();
  $('chairBody').innerHTML = chairHTML();
  $('waitCount').textContent = q.waiting.length ? `${q.waiting.length} प्रतीक्षेत` : '';
  $('waitList').innerHTML = q.waiting.length
    ? q.waiting.map((r, i) => itemHTML(r, i, q.waiting.length)).join('')
    : '<li class="empty">कोणीही प्रतीक्षेत नाही. नवीन नंबर इथे लगेच दिसतील.</li>';
  signature = makeSignature();
}

function makeSignature() {
  return q.list.map((r) => `${r.id}:${r.status}:${r.isNext ? 1 : 0}:${r.waitMin}:${r.queue_position}:${r.duration_minutes}`).join('|') + `#${shop.is_open}#${historyCache.size}#${earnings}`;
}

function tick() {
  recompute();
  if (makeSignature() !== signature) { render(); return; }
  const c = q.current;
  if (!c) return;
  const t = $('chairTime');
  const f = $('chairFill');
  if (t) { t.textContent = fmtClock(c.leftMs); t.classList.toggle('over', c.leftMs < 0); }
  if (f) f.style.width = `${Math.max(4, c.progress * 100)}%`;
  maybeTimePopup(c);
}

/* ---------- timer reached zero: ask what to do next ---------- */
function maybeTimePopup(c) {
  if (c.leftMs > 0 || timeCtx) return;
  const key = `${c.id}:${c.duration_minutes}`;
  if ((snooze.get(key) || 0) > Date.now()) return;
  if (document.querySelector('dialog[open]')) return; // wait until the barber closes the other window
  const nx = q.waiting.find((r) => r.status === 'accepted') || null;
  timeCtx = { id: c.id, key, next: nx, handled: false };
  $('timeWho').textContent = `${c.name}${c.service ? ` (${c.service})` : ''} यांचा ठरलेला ${c.duration_minutes} मिनिटांचा वेळ संपला.`;
  $('nextBtn').textContent = nx ? `पूर्ण करा आणि पुढचा सुरू करा: ${nx.name}` : 'काम पूर्ण झाले';
  $('timeDialog').showModal();
  beep(3); vibrate([500, 200, 500, 200, 500]);
  alarmTimer = setInterval(() => { beep(2); vibrate([300, 150, 300]); }, 15000); // keeps ringing until he answers
}

$('extGrid').addEventListener('click', async (e) => {
  const b = e.target.closest('button[data-m]');
  if (!b || !timeCtx) return;
  const ctx = timeCtx;
  ctx.handled = true;
  $('timeDialog').close();
  if (await act(ctx.id, 'extend', Number(b.dataset.m))) toast(`${b.dataset.m} मिनिटे वेळ वाढवला`, { type: 'ok' });
});
$('nextBtn').addEventListener('click', async () => {
  if (!timeCtx) return;
  const ctx = timeCtx;
  ctx.handled = true;
  $('timeDialog').close();
  if ((await act(ctx.id, 'complete', null, { undo: false })) && ctx.next) openDuration(ctx.next.id, ctx.next.name, ctx.next.service);
});
$('timeLater').addEventListener('click', () => $('timeDialog').close());
$('timeDialog').addEventListener('close', () => {
  clearInterval(alarmTimer);
  alarmTimer = null;
  if (timeCtx && !timeCtx.handled) snooze.set(timeCtx.key, Date.now() + 120000);
  timeCtx = null;
});

function detectCancelled() {
  const now = Date.now();
  const ids = new Set(bookings.map((b) => b.id));
  const gone = [];
  prevBy.forEach((old, id) => {
    if (!ids.has(id) && old.status !== 'in_progress' && !((ownTouch.get(id) || 0) > now - 20000)) gone.push(old.name);
  });
  prevBy = new Map(bookings.map((b) => [b.id, b]));
  if (gone.length) { toast(gone.join(', '), { type: 'error', title: gone.length === 1 ? 'ग्राहकाने नंबर रद्द केला' : 'ग्राहकांनी नंबर रद्द केले', ms: 8000 }); beep(1); }
}

function detectNew() {
  detectCancelled();
  const ids = new Set(bookings.map((b) => b.id));
  if (seen === null) { seen = ids; return; }
  const fresh = bookings.filter((b) => !b.is_walk_in && !seen.has(b.id)); // walk-ins are added by the barber himself
  seen = ids;
  if (fresh.length) {
    const text = fresh.map((b) => (b.service ? `${b.name} (${b.service})` : b.name)).join(', ');
    toast(text, { type: 'alert', title: fresh.length === 1 ? 'नवीन नंबर लागला' : `${fresh.length} नवीन नंबर लागले`, ms: 7000 });
    beep(2); vibrate([250, 100, 250]);
  }
}

/* ------------------------------------------------------------------ events */
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('loginError');
  err.hidden = true;
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = 'साइन इन होत आहे...';
  try {
    token = await backend.login($('user').value.trim(), $('pass').value);
    localStorage.setItem(TOKEN_KEY, token);
    askBarberPush(); // the sign-in tap lets Chrome show its notification box
    $('pass').value = '';
    await showDash();
  } catch (error) {
    err.textContent = error.message || 'साइन इन करता आले नाही';
    err.hidden = false;
  } finally {
    btn.disabled = false; btn.textContent = 'साइन इन';
  }
});

$('logoutBtn').addEventListener('click', () => logout());
$('resetBtn').addEventListener('click', () => { if (confirm('डेमो माहिती पुसायची?')) { backend.resetDemo(); refresh(); } });

$('openSwitch').addEventListener('click', async () => {
  try {
    await backend.setOpen(token, !shop.is_open);
    await refresh();
  } catch (err) { toast(err.message, { type: 'error' }); }
});

document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const { act: action, id } = b.dataset;
  if (action === 'start') { openDuration(id, b.dataset.name, b.dataset.service); return; }
  if (action === 'cancel' && !confirm('या ग्राहकाला रांगेतून काढायचे?')) return;
  act(id, action, b.dataset.min ? Number(b.dataset.min) : null);

// There is no banner. Chrome only shows its "Allow notifications?" box after a tap, so it is asked

let pushArmed = false;
function armPushAsk() {
  if (pushArmed) return;
  pushArmed = true;
  document.addEventListener('click', () => { pushArmed = false; askBarberPush(); }, { once: true, capture: true });
}

async function askBarberPush() {
  if (!pushPossible() || Notification.permission !== 'default') return;

    if ((await Notification.requestPermission()) !== 'granted') return;
    await subscribeBarberPhone();

}

async function syncBarberPush() {
  if (!pushPossible() || !token) return;
  if (Notification.permission === 'granted') {
    try { await subscribeBarberPhone(); } catch (err) { console.error('barber push', err); toast(`फोनवरील सूचना चालू झाल्या नाहीत: ${dbMessage(err)}`, { type: 'error', ms: 7000 }); }

/* ---------- accounts: today, last 7 days, last 30 days, best services ---------- */
const rupees = (n) => `₹${Math.round(n).toLocaleString('en-IN')}`;
function dayStart(back) { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate() - back).getTime(); }
function renderReport(rows) {
  const items = rows.map((r) => ({ ...r, t: new Date(r.at).getTime() }));
  const sum = (from, to = Infinity) => items.filter((r) => r.t >= from && r.t < to).reduce((a, r) => ({ n: a.n + 1, money: a.money + r.price }), { n: 0, money: 0 });
  const card = (title, v) => `<div class="rep-card"><span>${title}</span><b>${v.n} ग्राहक</b><em>${rupees(v.money)}</em></div>`;
  const days = Array.from({ length: 7 }, (_, i) => {
    const from = dayStart(i);
    const v = sum(from, i === 0 ? Infinity : dayStart(i - 1));
    const label = i === 0 ? 'आज' : i === 1 ? 'काल' : `${new Date(from).toLocaleDateString('mr-IN', { weekday: 'short' })} ${new Date(from).getDate()}`;
    return { label, ...v };
  });
  const top = Math.max(1, ...days.map((d) => d.money));
  const by = new Map();
  items.filter((r) => r.t >= dayStart(29)).forEach((r) => { const k = r.service || 'इतर'; const v = by.get(k) || { n: 0, money: 0 }; v.n += 1; v.money += r.price; by.set(k, v); });
  const best = [...by.entries()].sort((a, b) => b[1].n - a[1].n).slice(0, 5);
  $('reportBody').innerHTML = `
    <div class="rep-cards">${card('आज', sum(dayStart(0)))}${card('गेले 7 दिवस', sum(dayStart(6)))}${card('गेले 30 दिवस', sum(dayStart(29)))}</div>
    <h3 class="rep-h">गेले 7 दिवस</h3>
    <div class="rep-days">${days.map((d) => `<div class="rep-day"><span>${esc(d.label)}</span><i style="width:${Math.round((d.money / top) * 100)}%"></i><b>${d.n} · ${rupees(d.money)}</b></div>`).join('')}</div>
    <h3 class="rep-h">सर्वात जास्त चालणाऱ्या सेवा (30 दिवस)</h3>
    ${best.length ? `<ol class="rep-best">${best.map(([name, v]) => `<li><span>${esc(name)}</span><b>${v.n} वेळा · ${rupees(v.money)}</b></li>`).join('')}</ol>` : '<p class="hint">अजून पूर्ण झालेले काम नाही.</p>'}
    ${items.some((r) => r.price) ? '' : '<p class="hint small">दर (₹) दिसत नाहीत? "सेवा व दर" मध्ये दर भरा आणि जुना SQL एकदा चालवला आहे का ते पाहा.</p>'}`;
}
$('reportBtn').addEventListener('click', async () => {
  $('reportBody').innerHTML = '<p class="hint">तपासत आहे...</p>';
  $('reportDialog').showModal();
  try { renderReport(await backend.report(token)); } catch (err) { $('reportBody').innerHTML = `<p class="form-error">${esc(dbMessage(err))}</p>`; }
});
$('reportClose').addEventListener('click', () => $('reportDialog').close());

/* walk-in dialog */
$('walkinBtn').addEventListener('click', () => { $('walkError').hidden = true; $('wMicStatus').hidden = true; $('wPhoneMicStatus').hidden = true; $('walkForm').reset(); $('walkDialog').showModal(); $('wName').focus(); });
$('walkCancel').addEventListener('click', () => $('walkDialog').close());
$('walkForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('walkError');
  err.hidden = true;
  const name = $('wName').value.trim();
  const rawPhone = $('wPhone').value.trim();
  // no number given: a made-up id is used instead (no call button, never shown to customers)
  const phone = rawPhone ? normalizePhone(rawPhone) : `W${String(Math.floor(Math.random() * 1e9)).padStart(9, '0')}`;
  const service = $('wService').value;
  if (name.length < 2) { err.textContent = 'कृपया नाव टाका.'; err.hidden = false; return; }
  if (rawPhone && !validPhone(phone)) { err.textContent = 'वैध 10 अंकी मोबाईल नंबर टाका, किंवा रिकामा ठेवा.'; err.hidden = false; return; }
  if (!service) { err.textContent = 'कृपया सेवा निवडा.'; err.hidden = false; return; }
  try {
    await backend.addWalkin(token, { name, phone, service });
    $('walkDialog').close();
    toast(`${name} रांगेत जोडले`, { type: 'ok' });
    await refresh();
  } catch (error) {
    if (error.unauthorized) { $('walkDialog').close(); logout('तुमचे सेशन संपले. पुन्हा साइन इन करा.'); return; }
    err.textContent = dbMessage(error); err.hidden = false;
  }
});

/* ------------------------------------------------------------------ start */
(async function init() {
  $('ver').textContent = `आवृत्ती ${CONFIG.VERSION}`;
  // "customer page": show it in THIS tab by clearing the "#barber" part of the address. Nothing is opened or
  // downloaded, so it works from a file on the computer, from GitHub, in an installed app, with pop-ups blocked.
  // The "लॉगिन/डॅशबोर्ड" link on the customer page brings him straight back (he stays signed in).
  const here = location.href.split('#')[0];
  [$('custLink'), $('backLink')].forEach((a) => {
    a.href = here; // still a normal link (right-click, long press)
    a.addEventListener('click', (e) => { e.preventDefault(); location.hash = ''; });
  });
  attachMic($('sName'), $('sNameMic'), $('sNameSt'), CONFIG.SPEECH_LANG, 'text');
  attachMic($('sBarber'), $('sBarberMic'), $('sBarberSt'), CONFIG.SPEECH_LANG, 'name');
  attachMic($('sPhone'), $('sPhoneMic'), $('sPhoneSt'), CONFIG.SPEECH_LANG, 'phone');
  attachMic($('sAddress'), $('sAddressMic'), $('sAddressSt'), CONFIG.SPEECH_LANG, 'text');
  fillServices($('wService'), servicesOf());
  attachMic($('wName'), $('wMicBtn'), $('wMicStatus'), CONFIG.SPEECH_LANG, 'name');
  attachMic($('wPhone'), $('wPhoneMicBtn'), $('wPhoneMicStatus'), CONFIG.SPEECH_LANG, 'phone');
  await registerSW();
  // a push that arrives while the barber page is open and visible: the worker hands it to the page
  navigator.serviceWorker?.addEventListener('message', (e) => {
    if (!e.data || e.data.type !== 'push') return;
    if (e.data.title === 'नवीन नंबर लागला') { refresh(); return; } // the new-booking alert is shown by the normal check
    toast(e.data.body, { title: e.data.title, type: 'alert', ms: 8000 });
    beep(2); vibrate([250, 100, 250]);
  });
  if (token) await showDash(); else showLogin();
})();

}

// ---------- start: pick the page from the address (#barber = barber dashboard) ----------
const isBarber = location.hash.replace('#', '') === 'barber';
window.addEventListener('hashchange', () => location.reload());
const tpl = document.getElementById(isBarber ? 'tplBarber' : 'tplCustomer');
document.getElementById('root').appendChild(tpl.content.cloneNode(true));
document.title = isBarber ? 'केशकर्तनकार डॅशबोर्ड' : document.title;
if (isBarber) runBarber(); else runCustomer();

  </script>
